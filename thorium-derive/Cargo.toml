[package]
name = "thorium-derive"
resolver = "2"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Derives useful functions and traits for Thorium."
license-file = "../LICENSE"

[lib]
name = "thorium_derive"
path = "src/lib.rs"
proc-macro = true

[features]

# darling parses the derive attributes of the sync, python, and schema derives
sync = ["dep:darling"]

python = ["sync"]

# the schema derives: tables, views, projections, and keyspaces
schema = ["dep:darling"]

# the ThorPal tool derive, whose attributes darling parses
thorpal = ["dep:darling", "dep:convert_case"]

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = { version = "0.21", optional = true }
# pinned to the same version rig-derive uses so both macros derive identical
# PascalCase tool struct names from the same fn names
convert_case = { version = "0.11", optional = true }
