# Findings that CI linters and scanners should stop reporting
#
# .github/scripts/lint_report.py removes every finding that matches an entry
# here from the job log, inline annotations, GitLab Code Quality report, job
# summary, pass/fail gate, and the SARIF uploaded to code scanning. It is used
# by both the GitHub workflows and .gitlab/security.yml. The summary still
# lists each entry, how many findings it hid, and its reason, and the
# `<tool>-ignored.txt` file in the report artifact lists every hidden finding.
#
# On GitHub pull requests and GitLab merge request pipelines this file is read
# from the base branch, so a change cannot hide its own findings: new or
# changed entries take effect once they are merged. GitLab push pipelines read
# it from the pushed commit and flag the change in the summary. Review changes
# here like changes to the workflows themselves.
#
# Each entry is an [[ignore]] table with these keys:
#
#   tool    (required) the reporter's --tool name: hadolint, trivy-config,
#           zizmor, action-pins, or tool-versions
#   rule    (required) the rule id, such as DL3008, DS-0002,
#           zizmor/unpinned-uses, or outdated; shell-style wildcards allowed
#   paths   (optional) repo-relative path patterns; defaults to every file.
#           Shell-style wildcards, where `*` also matches `/`, so
#           "tools/images/*" covers everything below that directory
#   reason  (required) why the finding is acceptable; shown to reviewers
#   expires (optional) a date like 2027-01-31; after it the entry stops
#           applying and the job warns, so temporary ignores get revisited
#
# Prefer fixing a finding, or an inline `# hadolint ignore=DLxxxx` or
# `# zizmor: ignore[audit]` comment next to a single line, over a broad entry.
# Rust lints are configured in the code with #[allow(...)] instead.
#
# Examples:
#
# [[ignore]]
# tool = "zizmor"
# rule = "zizmor/secrets-outside-env"
# paths = [".github/workflows/tools.yml"]
# reason = "Registry credentials are scoped to the tool build job"
# expires = 2027-01-31

[[ignore]]
tool = "hadolint"
rule = "DL3015"
reason = "Recommended packages are allowed in our images"

[[ignore]]
tool = "hadolint"
rule = "DL3008"
reason = "Pinned apt versions are removed from distro archives and break rebuilds; images track the distro's current packages"

[[ignore]]
tool = "hadolint"
rule = "DL3033"
reason = "Pinned yum versions are removed from distro repositories and break rebuilds; images track the distro's current packages"

[[ignore]]
tool = "hadolint"
rule = "DL3013"
reason = "Images track the current release of the pip packages they install, as they do for apt and yum packages"

[[ignore]]
tool = "hadolint"
rule = "DL3003"
reason = "cd within a single RUN is used deliberately for multi-step builds"

[[ignore]]
tool = "hadolint"
rule = "DL3007"
reason = "Images intentionally build from the latest upstream and internal base images"

[[ignore]]
tool = "hadolint"
rule = "DL3067"
paths = ["tools/images/github.com/OSIF/suricata/Dockerfile"]
reason = "Must copy over pre-built layers to new image to remove volumes that make some files ephemeral"

[[ignore]]
tool = "trivy-config"
rule = "DS-0001"
reason = "Images intentionally build from the latest upstream and internal base images"

[[ignore]]
tool = "trivy-config"
rule = "DS-0013"
reason = "cd within a single RUN is used deliberately for multi-step builds"

[[ignore]]
tool = "trivy-config"
rule = "DS-0002"
reason = "Images built here are run in k8s by Thorium with user overrides"

[[ignore]]
tool = "trivy-config"
rule = "DS-0026"
reason = "Images run as Kubernetes workloads, which ignore Docker HEALTHCHECK; tool images run as short-lived jobs"

[[ignore]]
tool = "trivy-config"
rule = "DS-0029"
reason = "Recommended packages are allowed in our images"
