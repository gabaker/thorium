# Builds, publishes, scans, and checks Thorium on every push and pull request, in one run whose
# stages are ordered with `needs:`
#
# GitHub starts every queued job as soon as a runner is free and has no job priority, so when
# separate workflows each start all their jobs at once the release builds wait behind the checks
# for the account's runners (20 at once on the free plan, and far fewer macOS runners). One
# workflow lets `needs:` decide the order instead:
#
#   0. Check · changed paths: `git diff` against the pull request's base or the branch's previous
#      push decides which lints and tests this run needs, and whether the image publishes (see
#      its step for the rules).
#   1. Builds, in parallel: the mdBook docs, the UI bundle, the Helm chart package, and the glibc
#      (x86_64 and arm64), musl (x86_64 and arm64), Windows, and macOS binaries. The macOS thorctl
#      and thoradm build in one job, so the run asks for a single one of the scarce macOS runners.
#   2. Build · core container image: the image is built from the build artifacts, once for
#      linux/amd64 and once for linux/arm64 (the publish joins the two into one multi-arch
#      image under the tag, each architecture also pushed under the tag plus `-amd64` or `-arm64`
#      from release_refs.py). Every RUN step of the Dockerfile runs on the runner's own
#      architecture, so the arm64 build needs no emulation. Once it is built,
#      the security scans (security-scan.yml) start: the scan of this image and the repository
#      scans, beside the publish rather than before it, so they never delay or block it.
#   3. Publish, once the image is built and the charts packaged: the core image is published on
#      the default branch, release tags, and every branch on forks, never on pull requests
#      (.github/scripts/release_refs.py has the rules). A branch push publishes it only when a
#      path the image is built from changed, or when there is no previous commit to compare. The
#      charts publish after the image they deploy. A release tag (`1.2.3` or `v1.2.3`) publishes
#      the image under the tag as pushed, alone, and the charts with the tag less a leading `v`
#      as their version, deploying that image; a tag that is not SemVer builds and is scanned
#      but publishes nothing, which the build job decides before any push. Only default-branch
#      runs that publish the image point `latest` at the highest release on the default branch,
#      and no tag run moves `latest`, `main`, or a branch's tag.
#   4. After the image publish, in parallel: the workflow and Dockerfile lints (workflow-lint.yml,
#      dockerfile-lint.yml), and the lints and tests whose areas changed: the Rust checks
#      (rust-check.yml), version consistency, the Helm chart lint, the deployment tools checks,
#      and the CI change gating check, CI script tests, and CI name limit check (in the version
#      job).
#   GitHub Pages deploys from the default branch once the docs are built and the image published.
#
# - Every run, on every branch, tag, and pull request, builds everything (binaries, the image,
#   the docs, the UI bundle, and the charts) and runs every security scan (Trivy, zizmor,
#   hadolint, the action pin and pinned tool version checks, and their code scanning uploads). No
#   build or scan job reads the changed areas; publishing is limited to the refs and changes
#   above (the publish jobs read only the changes job's publish-image output).
# - The lints and tests run only when their area changed: Rust (any Rust change), thoradm,
#   thorctl, the charts, the deployment tools, the version copies, and the CI files. Pushes to the
#   default branch, manual runs, new branches, and any change under .github/ run them all; release
#   tags run none, since a tag's commit was checked on its branch.
#   .github/scripts/check_ci_gating.py checks these rules, and every new job must be classified
#   in it.
# - No build, publish, package, or Pages job, nor any job one of them needs, needs a security
#   scan, check, test, or lint job, directly or through its `if:`, so a failed or slow scan or
#   check never skips, delays, or blocks a build or publish; the scans and checks report their
#   own results, and nothing needs them. The chart package and publish run beside the chart lint,
#   not after it; package.sh checks the rendered chart it packages.
# - The scan and check jobs run whatever the build and publish jobs concluded (`!cancelled()`), so
#   a failed or skipped build never hides them. The scans wait for the image build, whose image
#   they scan, and the checks for the image publish, only so the builds get the runners first. A
#   lint or test a run doesn't need is skipped, and nothing that needs it is blocked by the skip.
# - rust-check.yml, security-scan.yml, workflow-lint.yml, and dockerfile-lint.yml are reusable
#   workflows called from here. They keep their own weekly schedules, which run all their repo
#   jobs; security-scan.yml's also rescans the published images in place of a build's image.
#   tools.yml (tool images) and rerun-unassigned.yml (re-runs this workflow's jobs no runner
#   picked up) stay separate workflows.
# - Jobs start with no token permissions and are granted only what they use. The registry and code
#   scanning tokens are only held by jobs that build or scan nothing, here and in the workflows
#   called from here (a caller's permissions only cap what the called jobs can be granted).
# - Actions are pinned by full commit SHA, checkout does not persist credentials, context values
#   reach scripts through env vars rather than template expansion, and setup-helm is given an empty
#   token, since it needs none but defaults to the job's.
name: Thorium Build

on:
  # Dependabot branches are built by their pull requests instead, so each update runs once
  push:
    branches:
      - '**'
      - '!dependabot/**'
    # release tags, with or without a leading v; release_refs.py checks the rest of the SemVer
    # rule, and a tag that fails it publishes nothing
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # pull requests build and scan everything and check what they change, but never publish, so
  # reviewers see whether the image builds
  pull_request:
  # runs every stage for the chosen ref, publishing as a push to it would
  workflow_dispatch:

# jobs start with no token permissions and are granted only what they use
permissions: {}

# superseded runs are cancelled, except on the default branch and release tags so their publish
# is never interrupted. Fork feature branches also publish and can be cancelled mid-publish; the
# next run republishes. A queued run is still replaced when a newer run queues behind it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/tags/') }}

env:
  HELM_VERSION: v3.22.0
  CHARTS: deploy/charts

jobs:
  # decides which lints and tests this run needs from the paths it changes (the rules are in its
  # step); the builds, publishes, and scans never read it
  changes:
    name: Check · changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      thoradm: ${{ steps.decide.outputs.thoradm }}
      thorctl: ${{ steps.decide.outputs.thorctl }}
      charts: ${{ steps.decide.outputs.charts }}
      deploy-tools: ${{ steps.decide.outputs.deploy-tools }}
      versions: ${{ steps.decide.outputs.versions }}
      ci: ${{ steps.decide.outputs.ci }}
      publish-image: ${{ steps.decide.outputs.publish-image }}
    steps:
      # the full history holds a push's previous commit and a pull request's base; without blobs it
      # is only commits and trees, which is all `git diff --name-only` reads
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # Each output switches on lints and tests for one area:
      # - rust: rust-check.yml's workspace-wide jobs (cargo check, Clippy, rustfmt, the unit tests,
      #   and the integration test compile check)
      # - thoradm: rust-check.yml's thoradm tests
      # - thorctl: rust-check.yml's thorctl tests
      # - charts: the Helm chart lint
      # - deploy-tools: the minithor and megathor checks
      # - versions: version consistency
      # - ci: the CI change gating check, which runs in the version consistency job (with the CI
      #   name limit check, which also runs for rust)
      # A full run (the default branch, a manual run, a new branch, or a change under .github/)
      # sets every area, and a release tag sets none.
      # publish-image is no area: on a ref that publishes, the core image (built on every run) is
      # pushed only when a path it is built from changed, on a release tag, or on a run with no
      # previous commit to compare. A push to the default branch compares with its previous commit
      # for it, though that push runs every lint and test.
      - name: Choose the stages to run
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          full=false rust=false thoradm=false thorctl=false charts=false deploy_tools=false
          versions=false ci=false publish_image=false base=""
          changed="${RUNNER_TEMP}/changed-files.txt"
          : > "$changed"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # a release tag's commit was checked on its branch, so the tag runs no lint or test;
            # it publishes the image
            publish_image=true
            reason="release tag ${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # the checkout is the pull request's merge commit, whose first parent is its base
            base="HEAD^1"
            reason="the pull request's changes"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && ! "$BEFORE" =~ ^0*$ ]] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
            reason="the changes since ${BEFORE:0:12}"
          else
            # a manual run, a new branch (whose first image must publish), or a push that
            # rewrote history so its previous commit is gone
            full=true publish_image=true
            reason="a full run (${GITHUB_EVENT_NAME} with no previous commit to compare)"
          fi
          # a push to the default branch runs every lint and test, while its changed paths still
          # decide whether the image publishes
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" \
            && -n "$DEFAULT_BRANCH" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" && "$full" != "true" ]]; then
            full=true
            reason="a full run (a push to ${DEFAULT_BRANCH}; the image publishes for ${reason})"
          fi
          # renames are listed as a removed and an added path, so both count, and rename
          # detection never needs the blobs the checkout left out
          if [[ -n "$base" ]] && ! git diff --no-renames --name-only "$base" HEAD > "$changed"; then
            full=true publish_image=true
            reason="a full run (git could not compare with ${base})"
          fi
          while IFS= read -r path; do
            # the areas a path's lints and tests belong to; the first matching pattern wins
            case "$path" in
              # the workflows, their scripts, and the ignore file every report reads
              .github/*) full=true ;;
              # the thoradm tests read these guides
              api/docs/src/admins/thoradm/*) rust=true thoradm=true ;;
              # the rest of the docs are built on every run and no test reads them
              api/docs/*) ;;
              # Rust code every crate builds on, so thoradm and thorctl are tested too
              Cargo.toml | Cargo.lock | rust-toolchain | rust-toolchain.toml | .cargo/* | api/* \
                | thorium-derive/* | cart-rs/*) rust=true thoradm=true thorctl=true ;;
              thoradm/*) rust=true thoradm=true ;;
              # thorctl's tests read the committed toolboxes; tools.yml builds the tool images
              thorctl/* | tools/toolbox.json | tools/toolbox.v1.json) rust=true thorctl=true ;;
              # the Rust unit tests check the operator's CRD and read its template helpers
              deploy/charts/thorium/charts/operator/*) rust=true charts=true deploy_tools=true ;;
              # megathor renders its values against the charts
              deploy/charts/*) charts=true deploy_tools=true ;;
              minithor/* | megathor/*) deploy_tools=true ;;
              # built on every run, built by tools.yml, or read by no lint or test
              ui/* | .gitmodules | Dockerfile | .dockerignore | tools/* | base/* | deploy/* \
                | skills/* | README.md | contributors.md | LICENSE | cliff.toml | .gitignore \
                | .hadolint.yaml) ;;
              # anything else is treated as Rust source of any crate, so an unlisted path runs
              # more, not less
              *) rust=true thoradm=true thorctl=true ;;
            esac
            # the files .github/scripts/versions.py reads
            case "$path" in
              Cargo.toml | */Cargo.toml | Cargo.lock | pyproject.toml | */pyproject.toml \
                | ui/package.json | ui/package-lock.json | deploy/charts/* | minithor/minithor \
                | minithor/README.md | megathor/inventory/group_vars/all.yml \
                | megathor/roles/common/defaults/main.yml \
                | api/docs/src/admins/deploy/deploy-helm.md) versions=true ;;
            esac
            # the paths a published image is built from: on a ref that publishes, the image is
            # pushed only when one of these changed
            case "$path" in
              .github/workflows/ci.yml | .github/actions/* | .github/scripts/* \
                | .github/lint-ignore.toml) publish_image=true ;;
              .github/* | deploy/charts/* | minithor/* | megathor/* | tools/* | base/* | deploy/* \
                | skills/* | README.md | contributors.md | LICENSE | cliff.toml | .gitignore \
                | .hadolint.yaml) ;;
              # the UI, the docs, the root Dockerfile, and any Rust or other unlisted path
              *) publish_image=true ;;
            esac
          done < "$changed"
          if [[ "$full" == "true" ]]; then
            rust=true thoradm=true thorctl=true charts=true deploy_tools=true versions=true ci=true
          fi
          {
            echo "rust=${rust}"
            echo "thoradm=${thoradm}"
            echo "thorctl=${thorctl}"
            echo "charts=${charts}"
            echo "deploy-tools=${deploy_tools}"
            echo "versions=${versions}"
            echo "ci=${ci}"
            echo "publish-image=${publish_image}"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Lints and tests for ${reason}"
            echo
            echo "The builds, publishes, and security scans run on every run."
            echo
            echo "| Lints and tests | Run |"
            echo "| --- | --- |"
            echo "| Rust checks | ${rust} |"
            echo "| thoradm tests | ${thoradm} |"
            echo "| thorctl tests | ${thorctl} |"
            echo "| Helm chart lint | ${charts} |"
            echo "| Deployment tools | ${deploy_tools} |"
            echo "| Version consistency | ${versions} |"
            echo "| CI change gating | ${ci} |"
            echo
            echo "Core image published (on a ref that publishes): ${publish_image}"
            echo
            echo "$(wc -l < "$changed") changed files"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::Changed files"
          cat "$changed"
          echo "::endgroup::"

  # builds the user docs with mdBook, for the core image and GitHub Pages
  build-mdbook-docs:
    name: Build · docs (mdBook)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo install mdbook
        run: cargo install --locked --version 0.5.4 mdbook
      - name: Build mdbook docs
        run: mdbook build api/docs
      # the container image serves these docs from the API
      - name: Upload docs as artifacts (API hosted)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorium-mdbook-bundle
          path: api/docs/book/
      # published to GitHub Pages by deploy-updated-pages
      - name: Upload docs as artifacts (Github pages)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: api/docs/book/

  # builds the web UI bundle for the core image; its style check only warns
  build-ui-bundle:
    name: Build · UI bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Node 26.12.1 on Alpine, the image GitLab's UI jobs use. To move it, resolve the new
      # tag's multi-arch index digest from Docker Hub and update the tag and the digest together
      NODE_IMAGE: docker.io/library/node:26.12.1-alpine@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the UI installs, checks and builds in the pinned Node image rather than with the
      # runner's preinstalled Node, which changes with the runner image
      - name: Install UI Dependencies
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}/ui:/ui" -w /ui "$NODE_IMAGE" npm ci
      # style problems only warn so they never block a UI build
      - name: Check UI Style
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}/ui:/ui" -w /ui "$NODE_IMAGE" npm run validate-style ||
            echo "::warning title=UI style::prettier found style issues; run 'npm run format' in ui/"
      - name: Build UI Bundle
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}/ui:/ui" -w /ui "$NODE_IMAGE" npm run build
      - name: Upload UI Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorium-ui-bundle
          path: ui/dist/

  # builds the Linux glibc binaries and the developer docs for the core image
  build-glibc-binaries:
    name: Build · Linux binaries (glibc)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # only the server binaries the image runs; it takes thorctl, the agent, and the reactor
      # from the musl and Windows builds
      - name: Build binaries
        run: |
          rustup install nightly
          rustup default nightly
          lscpu
          cargo build --release --features vendored-openssl -p thorium-api -p thorium-operator \
            -p thoradm -p thorium-scaler -p thorium-search-streamer -p thorium-event-handler
          cargo doc --no-deps
          # gather the binaries the container build needs into one artifact
          mkdir glibc
          mv target/release/thoradm glibc/.
          mv target/release/thorium-api glibc/.
          mv target/release/thorium-scaler glibc/.
          mv target/release/thorium-event-handler glibc/.
          mv target/release/thorium-search-streamer glibc/.
          mv target/release/thorium-operator glibc/.
          mv target/doc dev_docs
      - name: Upload glibc binaries as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorium-glibc-binaries
          path: glibc/
      - name: Upload dev docs as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorium-dev-docs-bundle
          path: dev_docs/

  # builds the static Linux x86_64 (musl) binaries for the core image. actions-rust-cross builds
  # this target through cross, as it does the arm64 and Windows targets, whose image carries the
  # musl toolchain and C compiler, so the runner installs no packages. The reactor has no default
  # features, so it builds in the same cargo run as the others
  build-cross-binaries:
    name: Build · Linux binaries (musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # only the binaries the image serves for this target; gxhash needs AES, which x86_64 needs
      # named. The action runs cargo on the runner for an x86_64 target unless told to use cross,
      # and strips only binaries it builds without cross, so cargo strips these. LZMA_API_STATIC
      # makes liblzma-sys (thoradm, through zip) build its bundled liblzma, as the arm64 build does.
      # cross passes RUSTFLAGS and CARGO_* variables into its container, and the others
      # CROSS_BUILD_ENV_PASSTHROUGH names
      - name: Build binaries
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          LZMA_API_STATIC: "1"
          CROSS_BUILD_ENV_PASSTHROUGH: LZMA_API_STATIC
        with:
          command: build
          target: x86_64-unknown-linux-musl
          toolchain: nightly
          args: "--features vendored-openssl --release -p thorctl -p thorium-agent -p thorium-reactor -p thoradm -p thorium-operator"
          force-use-cross: true
          strip: true
          # these binaries are published, so never restore caches another workflow run could have written
          use-rust-cache: false
          cache-cross-binary: false
      # the upload's if-no-files-found only fails when every path is missing, so a shipped binary
      # that cargo did not produce (a renamed bin target, a dropped -p) fails here, in this job,
      # instead of as a COPY error in the image build
      - name: Check x86_64-unknown-linux-musl binaries exist
        env:
          TARGET: x86_64-unknown-linux-musl
        run: |
          missing=0
          for bin in thorctl thorium-agent thorium-reactor thoradm thorium-operator; do
            if [ ! -f "target/${TARGET}/release/${bin}" ]; then
              echo "::error::target/${TARGET}/release/${bin} was not built"
              missing=1
            fi
          done
          exit "$missing"
      - name: Upload x86_64-unknown-linux-musl binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-unknown-linux-musl-binaries
          path: |
            target/x86_64-unknown-linux-musl/release/thorctl
            target/x86_64-unknown-linux-musl/release/thorium-agent
            target/x86_64-unknown-linux-musl/release/thorium-reactor
            target/x86_64-unknown-linux-musl/release/thoradm
            target/x86_64-unknown-linux-musl/release/thorium-operator
          if-no-files-found: error

  # builds the static Linux arm64 (aarch64 musl) binaries for the core image. actions-rust-cross
  # builds this target through cross, whose image carries the aarch64 musl toolchain and C
  # compiler, so the runner installs no packages and the build runs on the same x86_64 runners as
  # the other builds. The reactor has no default features, so it builds in the same cargo run as
  # the others
  build-arm64-cross-binaries:
    name: Build · Linux arm64 binaries (musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # only the binaries the image serves for this target. gxhash needs AES and NEON; aarch64
      # enables NEON by default but needs AES named. The action strips only binaries it builds
      # without cross, so cargo strips these. LZMA_API_STATIC makes liblzma-sys (thoradm, through
      # zip) build its bundled liblzma, as the macOS build does. cross passes RUSTFLAGS and CARGO_*
      # variables into its container, and the others CROSS_BUILD_ENV_PASSTHROUGH names
      - name: Build binaries
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        env:
          RUSTFLAGS: "-C target-feature=+aes,+neon"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          LZMA_API_STATIC: "1"
          CROSS_BUILD_ENV_PASSTHROUGH: LZMA_API_STATIC
        with:
          command: build
          target: aarch64-unknown-linux-musl
          toolchain: nightly
          args: "--features vendored-openssl --release -p thorctl -p thorium-agent -p thorium-reactor -p thoradm -p thorium-operator"
          strip: true
          # these binaries are published, so never restore caches another workflow run could have written
          use-rust-cache: false
          cache-cross-binary: false
      # the upload's if-no-files-found only fails when every path is missing, so a shipped binary
      # that cargo did not produce (a renamed bin target, a dropped -p) fails here, in this job,
      # instead of as a COPY error in the image build
      - name: Check aarch64-unknown-linux-musl binaries exist
        env:
          TARGET: aarch64-unknown-linux-musl
        run: |
          missing=0
          for bin in thorctl thorium-agent thorium-reactor thoradm thorium-operator; do
            if [ ! -f "target/${TARGET}/release/${bin}" ]; then
              echo "::error::target/${TARGET}/release/${bin} was not built"
              missing=1
            fi
          done
          exit "$missing"
      - name: Upload aarch64-unknown-linux-musl binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-unknown-linux-musl-binaries
          path: |
            target/aarch64-unknown-linux-musl/release/thorctl
            target/aarch64-unknown-linux-musl/release/thorium-agent
            target/aarch64-unknown-linux-musl/release/thorium-reactor
            target/aarch64-unknown-linux-musl/release/thoradm
            target/aarch64-unknown-linux-musl/release/thorium-operator
          if-no-files-found: error

  # builds the Linux arm64 (aarch64 glibc) server binaries the arm64 core image runs. As with the
  # musl builds, actions-rust-cross builds this target through cross, whose image carries the
  # aarch64 glibc toolchain, so the build runs on the same x86_64 runners as the other builds
  build-arm64-glibc-binaries:
    name: Build · Linux arm64 server binaries (glibc)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the same server binaries the glibc build makes for x86_64. gxhash needs AES and NEON;
      # aarch64 enables NEON by default but needs AES named. cargo strips the binaries, since the
      # action strips only binaries it builds without cross, and LZMA_API_STATIC makes
      # liblzma-sys build its bundled liblzma, so the build needs no arm64 liblzma in the cross image
      - name: Build binaries
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        env:
          RUSTFLAGS: "-C target-feature=+aes,+neon"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          LZMA_API_STATIC: "1"
          CROSS_BUILD_ENV_PASSTHROUGH: LZMA_API_STATIC
        with:
          command: build
          target: aarch64-unknown-linux-gnu
          toolchain: nightly
          args: "--features vendored-openssl --release -p thorium-api -p thorium-operator -p thoradm -p thorium-scaler -p thorium-search-streamer -p thorium-event-handler"
          strip: true
          # these binaries are published, so never restore caches another workflow run could have written
          use-rust-cache: false
          cache-cross-binary: false
      # as for the musl builds, a server binary cargo did not produce fails here rather than as a
      # COPY error in the image build
      - name: Check aarch64-unknown-linux-gnu binaries exist
        env:
          TARGET: aarch64-unknown-linux-gnu
        run: |
          missing=0
          for bin in thorium-api thorium-operator thoradm thorium-scaler thorium-search-streamer thorium-event-handler; do
            if [ ! -f "target/${TARGET}/release/${bin}" ]; then
              echo "::error::target/${TARGET}/release/${bin} was not built"
              missing=1
            fi
          done
          exit "$missing"
      - name: Upload aarch64-unknown-linux-gnu binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-unknown-linux-gnu-binaries
          path: |
            target/aarch64-unknown-linux-gnu/release/thorium-api
            target/aarch64-unknown-linux-gnu/release/thorium-operator
            target/aarch64-unknown-linux-gnu/release/thoradm
            target/aarch64-unknown-linux-gnu/release/thorium-scaler
            target/aarch64-unknown-linux-gnu/release/thorium-search-streamer
            target/aarch64-unknown-linux-gnu/release/thorium-event-handler
          if-no-files-found: error

  # The three Windows binaries build in one job. actions-rust-cross builds this target through
  # cross, whose image carries the MinGW toolchain, so the runner installs no packages
  build-windows-cross-binaries:
    name: Build · Windows binaries
    # This needs to run on Ubuntu or agent builds fail
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Windows Cross agent and thorctl Binaries
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: x86_64-pc-windows-gnu
          toolchain: nightly
          args: "--features vendored-openssl --release -p thorium-agent -p thorctl"
          strip: true
          # these binaries are published, so never restore caches another workflow run could have written
          use-rust-cache: false
          cache-cross-binary: false
      # the reactor builds on its own and without default features, as GitLab builds it
      - name: Build Windows Cross reactor Binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: x86_64-pc-windows-gnu
          toolchain: nightly
          args: "--features vendored-openssl --release --no-default-features -p thorium-reactor"
          strip: true
          # these binaries are published, so never restore caches another workflow run could have written
          use-rust-cache: false
          cache-cross-binary: false
      - name: Upload agent x86_64-pc-windows-gnu binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-pc-windows-gnu-agent
          path: target/x86_64-pc-windows-gnu/release/thorium-agent.exe
          if-no-files-found: error
      - name: Upload thorctl x86_64-pc-windows-gnu binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-pc-windows-gnu-thorctl
          path: target/x86_64-pc-windows-gnu/release/thorctl.exe
          if-no-files-found: error
      - name: Upload reactor x86_64-pc-windows-gnu binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-pc-windows-gnu-reactor
          path: target/x86_64-pc-windows-gnu/release/thorium-reactor.exe
          if-no-files-found: error

  # thorctl and thoradm build on one macOS runner, so a run asks for a single one of the scarce
  # macOS runners. Each binary builds for each target in its own cargo run, in turn: a shared
  # `cargo build -p thorctl -p thoradm` would unify their features and compile thorctl's
  # thorium-api with thoradm's server features instead of its client features only, and one
  # target at a time keeps one target's compile in the runner's memory. It needs no other job, so
  # it starts with the other builds. The image serves both binaries for each macOS target. Cargo
  # runs directly, as actions-rust-cross does on macOS, since that action takes a single target.
  # The four release builds run in turn, so the job takes the longest timeout GitHub allows a job
  # (360 minutes), twice the 180 minutes each of the other release builds gets. Its runner image
  # is the MACOS_RUNNER repository variable when set (macos-15, say, while macos-latest's runners
  # are scarce), else macos-latest
  build-macos-binaries:
    name: Build · macOS binaries
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    permissions:
      contents: read
    # gxhash needs AES, which aarch64-apple-darwin enables by default and x86_64 needs named.
    # Target-specific flags keep each target's own; RUSTFLAGS would apply to both.
    # LZMA_API_STATIC makes liblzma-sys (through thoradm's zip) build its bundled liblzma instead
    # of linking a Homebrew liblzma that pkg-config finds on the runner and most Macs lack; it
    # applies to every build, so a thorctl dependency that pulls liblzma-sys in links it statically
    env:
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: "-C target-feature=+aes,+sse2"
      LZMA_API_STATIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      # one binary and one target per cargo run, so each binary resolves its own features and the
      # runner's memory holds one target's compile at a time
      - name: Build thorctl for aarch64-apple-darwin
        run: cargo +nightly build --release --features vendored-openssl -p thorctl --target aarch64-apple-darwin
      - name: Build thorctl for x86_64-apple-darwin
        run: cargo +nightly build --release --features vendored-openssl -p thorctl --target x86_64-apple-darwin
      - name: Build thoradm for aarch64-apple-darwin
        run: cargo +nightly build --release --features vendored-openssl -p thoradm --target aarch64-apple-darwin
      - name: Build thoradm for x86_64-apple-darwin
        run: cargo +nightly build --release --features vendored-openssl -p thoradm --target x86_64-apple-darwin
      # the upload's if-no-files-found only fails when every path is missing, so a shipped binary
      # that cargo did not produce fails here, in this step, instead of as a COPY error in the image
      # build
      - name: Check macOS binaries exist
        run: |
          missing=0
          for binary in thorctl thoradm; do
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              if [ ! -f "target/${target}/release/${binary}" ]; then
                echo "::error::target/${target}/release/${binary} was not built"
                missing=1
              fi
            done
          done
          exit "$missing"
      - name: Strip macOS binaries
        run: |
          for binary in thorctl thoradm; do
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              strip "target/${target}/release/${binary}"
            done
          done
      # the image serves these binaries for download onto any Mac, so they must be self-contained:
      # a library linked from outside the system paths, such as a Homebrew dylib the runner has,
      # would fail to load on a Mac without it, so any such library fails the job here
      - name: Check macOS binaries link only system libraries
        run: |
          outside=0
          for binary in thorctl thoradm; do
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              path="target/${target}/release/${binary}"
              libs=$(otool -L "$path" | tail -n +2 | awk '{print $1}')
              for lib in $libs; do
                case "$lib" in
                  /usr/lib/*|/System/*) ;;
                  *)
                    echo "::error::${path} links ${lib}, which is outside /usr/lib and /System"
                    outside=1
                    ;;
                esac
              done
            done
          done
          exit "$outside"
      - name: Upload thorctl aarch64-apple-darwin binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-apple-darwin-thorctl
          path: target/aarch64-apple-darwin/release/thorctl
          if-no-files-found: error
      - name: Upload thorctl x86_64-apple-darwin binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-apple-darwin-thorctl
          path: target/x86_64-apple-darwin/release/thorctl
          if-no-files-found: error
      - name: Upload thoradm aarch64-apple-darwin binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-apple-darwin-thoradm
          path: target/aarch64-apple-darwin/release/thoradm
          if-no-files-found: error
      - name: Upload thoradm x86_64-apple-darwin binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-apple-darwin-thoradm
          path: target/x86_64-apple-darwin/release/thoradm
          if-no-files-found: error

  # builds the core container image from the build artifacts and saves it for the publish
  build-core-container:
    name: Build · core container image
    needs:
      - build-mdbook-docs
      - build-ui-bundle
      - build-glibc-binaries
      - build-cross-binaries
      - build-arm64-cross-binaries
      - build-arm64-glibc-binaries
      - build-macos-binaries
      - build-windows-cross-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      image-amd64: ${{ steps.image.outputs.image-amd64 }}
      image-arm64: ${{ steps.image.outputs.image-arm64 }}
      latest-image: ${{ steps.image.outputs.latest-image }}
      latest-source: ${{ steps.image.outputs.latest-source }}
      publish: ${{ steps.image.outputs.publish }}
      # whether the saved image was uploaded, so security-scan.yml skips the image scan when there
      # is none
      saved: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download UI Bundle Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thorium-ui-bundle
          path: ui/dist
      - name: Download mdBook Bundle Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thorium-mdbook-bundle
          path: user_docs
      - name: Download Developer Docs Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thorium-dev-docs-bundle
          path: dev_docs
      - name: Download Thorium glibc Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thorium-glibc-binaries
          path: glibc
      - name: Download Thorium musl Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-unknown-linux-musl-binaries
          path: musl
      - name: Download Thorium Linux arm64 Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-unknown-linux-musl-binaries
          path: aarch64
      - name: Download Thorium Linux arm64 glibc Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-unknown-linux-gnu-binaries
          path: aarch64-gnu
      - name: Download Thorium Windows Agent Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-pc-windows-gnu-agent
          path: windows/agent
      - name: Download Thorium Windows Thorctl Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-pc-windows-gnu-thorctl
          path: windows/thorctl
      - name: Download Thorium Windows Reactor Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-pc-windows-gnu-reactor
          path: windows/reactor
      # the macOS build uploads one artifact per binary and target; merging them puts both
      # binaries of a target in one directory
      - name: Download Thorium macos x86_64 Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: x86_64-apple-darwin-*
          merge-multiple: true
          path: macos/x86_64
      - name: Download Thorium macos aarch64 Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aarch64-apple-darwin-*
          merge-multiple: true
          path: macos/aarch64
      - name: Stage Artifacts For Container Build
        run: |
          mkdir -p glibc
          mkdir -p target/release
          mkdir -p target/doc
          mkdir -p api/docs/book
          mkdir -p target/x86_64-unknown-linux-musl/release
          mkdir -p target/x86_64-pc-windows-gnu/release
          mkdir -p target/x86_64-apple-darwin/release
          mkdir -p target/aarch64-apple-darwin/release
          mkdir -p target/aarch64-unknown-linux-musl/release
          mkdir -p target/aarch64-unknown-linux-gnu/release
          mv user_docs/* api/docs/book
          mv dev_docs/* target/doc/.
          mv glibc/* target/release/.
          mv musl/* target/x86_64-unknown-linux-musl/release/.
          mv aarch64/* target/aarch64-unknown-linux-musl/release/.
          mv aarch64-gnu/* target/aarch64-unknown-linux-gnu/release/.
          mv windows/agent/thorium-agent.exe target/x86_64-pc-windows-gnu/release/
          mv windows/thorctl/thorctl.exe target/x86_64-pc-windows-gnu/release/
          mv windows/reactor/thorium-reactor.exe target/x86_64-pc-windows-gnu/release/
          mv macos/x86_64/* target/x86_64-apple-darwin/release/.
          mv macos/aarch64/* target/aarch64-apple-darwin/release/.
      # .github/scripts/release_refs.py picks the image tag, whether to publish it, and which release
      # `latest` points at; see its docstring for the rules
      - name: Choose Image Tags
        id: image
        env:
          IS_FORK: ${{ github.event.repository.fork }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/release_refs.py image
      # one single-platform image per architecture, under the tag plus the architecture; the
      # publish joins them under the tag itself
      - name: Build Thorium Container Images
        env:
          IMAGE_AMD64: ${{ steps.image.outputs.image-amd64 }}
          IMAGE_ARM64: ${{ steps.image.outputs.image-arm64 }}
        run: |
          docker build --platform linux/amd64 --file ./Dockerfile --tag "$IMAGE_AMD64" --label "runnumber=${GITHUB_RUN_ID}" .
          docker build --platform linux/arm64 --file ./Dockerfile --tag "$IMAGE_ARM64" --label "runnumber=${GITHUB_RUN_ID}" .
      # each image's platform, and the architecture of the binaries it runs, match its tag, so a
      # misplaced artifact never publishes as the other architecture
      - name: Check Thorium Container Image Architectures
        env:
          IMAGE_AMD64: ${{ steps.image.outputs.image-amd64 }}
          IMAGE_ARM64: ${{ steps.image.outputs.image-arm64 }}
        run: |
          sh .github/scripts/check_image_arch.sh "$IMAGE_AMD64" amd64
          sh .github/scripts/check_image_arch.sh "$IMAGE_ARM64" arm64
      # the images are saved for security-scan.yml's image scan, and handed to the publish job so
      # the registry token never shares a job with the build
      - name: Save Thorium Container Images
        id: save
        # a build that is not published only needs the tars for the scan, so failing to save them,
        # such as running out of disk, does not fail the build
        continue-on-error: ${{ steps.image.outputs.publish != 'true' }}
        env:
          IMAGE_AMD64: ${{ steps.image.outputs.image-amd64 }}
          IMAGE_ARM64: ${{ steps.image.outputs.image-arm64 }}
        run: |
          docker save --output "${RUNNER_TEMP}/thorium-image-amd64.tar" "$IMAGE_AMD64"
          docker save --output "${RUNNER_TEMP}/thorium-image-arm64.tar" "$IMAGE_ARM64"
      # handed to the publish job and to security-scan.yml's image scan, which runs beside the
      # publish, so the scan never delays or blocks publishing
      - name: Upload Thorium Container Image
        id: upload
        if: steps.save.outcome == 'success'
        # as with saving, a build that is not published only needs the image for the scan
        continue-on-error: ${{ steps.image.outputs.publish != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorium-core-image
          path: |
            ${{ runner.temp }}/thorium-image-amd64.tar
            ${{ runner.temp }}/thorium-image-arm64.tar
          retention-days: 1

  # pushes the core container image when release_refs.py says this ref publishes and the changes
  # job says a path the image is built from changed (always on release tags and full runs), once
  # the image is built and the charts packaged; it needs no scan or check
  publish-core-container:
    name: Publish · core container image
    needs:
      - changes
      - build-core-container
      - helm-package
    if: needs.build-core-container.outputs.publish == 'true' && needs.changes.outputs.publish-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # push images to ghcr.io
    steps:
      - name: Download Thorium Container Image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thorium-core-image
          path: ${{ runner.temp }}/image
      - name: Load Thorium Container Images
        run: |
          docker load --input "${RUNNER_TEMP}/image/thorium-image-amd64.tar"
          docker load --input "${RUNNER_TEMP}/image/thorium-image-arm64.tar"
      - name: Login to Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push Thorium amd64 Container Image
        env:
          IMAGE_AMD64: ${{ needs.build-core-container.outputs.image-amd64 }}
        run: docker push "$IMAGE_AMD64"
      - name: Push Thorium arm64 Container Image
        env:
          IMAGE_ARM64: ${{ needs.build-core-container.outputs.image-arm64 }}
        run: docker push "$IMAGE_ARM64"
      # the tag itself becomes one image index over both architectures' images, so a pull picks
      # the puller's architecture; the tag is only written once both architectures are pushed
      - name: Join the Thorium Container Images Under the Tag
        env:
          IMAGE: ${{ needs.build-core-container.outputs.image }}
          IMAGE_AMD64: ${{ needs.build-core-container.outputs.image-amd64 }}
          IMAGE_ARM64: ${{ needs.build-core-container.outputs.image-arm64 }}
        run: docker buildx imagetools create --tag "$IMAGE" "$IMAGE_AMD64" "$IMAGE_ARM64"
      # copies the release's image index in the registry, so the release image is never rebuilt.
      # release_refs.py sets latest-source on default-branch runs only, and the ref type check
      # keeps a release tag's run from ever moving latest
      - name: Point latest at the Highest Release
        if: github.ref_type == 'branch' && needs.build-core-container.outputs.latest-source != ''
        env:
          LATEST_SOURCE: ${{ needs.build-core-container.outputs.latest-source }}
          LATEST_IMAGE: ${{ needs.build-core-container.outputs.latest-image }}
        run: |
          # a release tag's own run may still be building when the default branch reaches it, so a
          # missing release image is skipped while any other failure fails the step
          if ! INSPECT=$(docker buildx imagetools inspect "$LATEST_SOURCE" 2>&1); then
            if grep -qi "not found" <<< "$INSPECT"; then
              echo "::warning::${LATEST_SOURCE} is not published yet, so latest was not updated"
              exit 0
            fi
            echo "$INSPECT"
            echo "::error::Failed to inspect ${LATEST_SOURCE}"
            exit 1
          fi
          echo "Pointing latest at ${LATEST_SOURCE}"
          docker buildx imagetools create --tag "$LATEST_IMAGE" "$LATEST_SOURCE"

  # The security scans below wait for the image build and the checks for the image publish,
  # whatever they concluded, so they take runners only once the builds have theirs; a failed or
  # skipped build or publish never stops them, and no build or publish job needs them. The scans
  # run on every run; each lint and test runs only when the `changes` job says its area changed.
  # The reusable workflows are called with `./`, the local syntax actionlint and GitHub's docs
  # use, rather than the `$/` form zizmor suggests, which actionlint rejects

  # the workspace-wide Rust jobs run on any Rust change; the thoradm and thorctl tests only when
  # that crate or the Rust code it builds on changed
  rust-check:
    name: Test · Rust
    needs:
      - changes
      - publish-core-container
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    permissions:
      contents: read # check out the repository
    uses: ./.github/workflows/rust-check.yml # zizmor: ignore[self-repository]
    with:
      thoradm: ${{ needs.changes.outputs.thoradm }}
      thorctl: ${{ needs.changes.outputs.thorctl }}

  # scans this run's core image, from the artifact the build saved it in, and the repository.
  # It starts once the image is built, beside the publish, and nothing needs it, so the scans
  # never delay or block publishing; a build that saved no image passes an empty artifact name,
  # which skips the image scan and leaves the repository scans to run
  security-scan:
    name: Scan · security
    needs: build-core-container
    if: ${{ !cancelled() }}
    permissions:
      contents: read # check out the repository
      security-events: write # upload SARIF results to code scanning
    uses: ./.github/workflows/security-scan.yml # zizmor: ignore[self-repository]
    with:
      core-image-artifact: ${{ needs.build-core-container.outputs.saved == 'true' && 'thorium-core-image' || '' }}
      core-image: ${{ needs.build-core-container.outputs.image }}

  workflow-lint:
    name: Lint · workflows
    needs: publish-core-container
    if: ${{ !cancelled() }}
    permissions:
      contents: read # check out the repository, and let zizmor and the pin check query GitHub
      security-events: write # upload SARIF results to code scanning
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  dockerfile-lint:
    name: Lint · Dockerfiles
    needs: publish-core-container
    if: ${{ !cancelled() }}
    permissions:
      contents: read # check out the repository
      security-events: write # upload SARIF results to code scanning
    uses: ./.github/workflows/dockerfile-lint.yml # zizmor: ignore[self-repository]

  # checks every copy of the Thorium version matches the workspace version in Cargo.toml, that
  # every job keeps to the change gating rules (builds and scans run on every run, and each lint
  # and test is gated on its area), that the CI scripts pass their unit tests, and that every
  # keyspace and bucket name the integration tests derive in CI fits its limit
  versions:
    name: Check · versions and CI gating
    needs:
      - changes
      - publish-core-container
    if: ${{ !cancelled() && (needs.changes.outputs.versions == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # every copy of the version (Cargo, the web UI, the charts, deployment defaults, and docs)
      # must match the workspace version; `python3 .github/scripts/versions.py bump` fixes them
      - name: Check versions
        if: needs.changes.outputs.versions == 'true'
        run: python3 .github/scripts/versions.py check
      # PyYAML comes from the distro's signed packages when the runner image lacks it
      - name: Install PyYAML
        if: ${{ !cancelled() && needs.changes.outputs.ci == 'true' }}
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      # reads the workflows and runs the change detection step in scratch git repositories; it
      # runs after a failed version check too
      - name: Check change gating
        if: ${{ !cancelled() && needs.changes.outputs.ci == 'true' }}
        run: python3 -I .github/scripts/check_ci_gating.py
      # the standard library unittest suites beside the CI scripts (test_*.py), which run each
      # script as CI does; they run after a failed version or gating check too
      - name: Test the CI scripts
        if: ${{ !cancelled() && needs.changes.outputs.ci == 'true' }}
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      # every Scylla keyspace and S3 bucket the integration tests name from CI's run id and
      # namespace fits its limit (48 and 63 characters), worked out from the test sources without
      # a build; it runs after a failed version or gating check too, and on any Rust change
      - name: Check CI name limits
        id: name-limits
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') }}
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-name-limits"
          python3 -I .github/scripts/check_ci_name_limits.py \
            --sarif "${RUNNER_TEMP}/ci-name-limits/ci-name-limits.sarif"
      # a name over its limit is an error and fails the job; nothing waits for this job
      - name: Report CI name limit findings
        if: ${{ !cancelled() && steps.name-limits.outcome != 'skipped' }}
        run: |
          python3 .github/scripts/lint_report.py --tool ci-name-limits --format sarif \
            --input "${RUNNER_TEMP}/ci-name-limits/ci-name-limits.sarif" \
            --ignore-file .github/lint-ignore.toml \
            --output-dir "${RUNNER_TEMP}/ci-name-limits" --fail-level error

  # lints and renders the Helm charts and checks the rendered manifests (GitLab runs these
  # same steps, read from this job)
  helm-lint:
    name: Lint · Helm charts
    needs:
      - changes
      - publish-core-container
    if: ${{ !cancelled() && needs.changes.outputs.charts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # helm lint can't read the generated credentials back from a cluster, so the thorium chart
      # is linted with secrets.renderOnly for its templates to render at all
      - name: Lint
        run: |
          helm lint --strict "$CHARTS/infra-operators"
          helm lint --strict -n thorium --set secrets.renderOnly=true "$CHARTS/thorium"
      # secrets.renderOnly stands in placeholder credentials, since helm template can't read the
      # generated ones back from a cluster and the chart refuses to regenerate them otherwise
      - name: Render the default, namespace-prefixed, and production deployments
        run: |
          helm template infra-operators "$CHARTS/infra-operators" -n infra-operators > /dev/null
          helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true > /dev/null
          helm template thorium "$CHARTS/thorium" -n dev-thorium --set secrets.renderOnly=true > /dev/null
          helm template thorium "$CHARTS/thorium" -n thorium -f "$CHARTS/thorium/values-production.yaml" \
            --set secrets.renderOnly=true > /dev/null
      # the example values files in the docs must keep rendering, alone and layered
      - name: Render the example values files
        run: |
          for example in "$CHARTS"/examples/*.yaml "$CHARTS/thorium/values-production.yaml"; do
            echo "rendering $example"
            helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true \
              -f "$example" > /dev/null
          done
          helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true \
            -f "$CHARTS/thorium/values-production.yaml" -f "$CHARTS/examples/site.yaml" > /dev/null
      - name: Check the chart refuses to regenerate credentials without renderOnly
        run: |
          if stderr=$(helm template thorium "$CHARTS/thorium" -n thorium 2>&1 > /dev/null); then
            echo "helm template rendered generated credentials without secrets.renderOnly"
            exit 1
          fi
          if ! grep -q "so these credentials would be regenerated" <<< "$stderr"; then
            echo "helm template failed for another reason than the credentials guard:"
            echo "$stderr"
            exit 1
          fi
      # the Thorium namespace names the Scylla keyspace and prefixes the Redis keys, so the chart
      # takes only lowercase letters, digits and underscores, a leading letter, and 48 characters
      - name: Check the chart refuses a Thorium namespace the operator would refuse
        run: |
          longest="n$(head -c 47 /dev/zero | tr '\0' a)"
          for good in thorium thorium_dev2 "$longest"; do
            helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true \
              --set-string operator.cluster.config.thorium.namespace="$good" > /dev/null
          done
          for bad in Thorium thorium-dev 1thorium _thorium "" "${longest}a"; do
            if stderr=$(helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true \
              --set-string operator.cluster.config.thorium.namespace="$bad" 2>&1 > /dev/null); then
              echo "helm template accepted the Thorium namespace '$bad'"
              exit 1
            fi
            if ! grep -q "/cluster/config/thorium/namespace" <<< "$stderr"; then
              echo "helm template refused '$bad' for another reason than the namespace pattern:"
              echo "$stderr"
              exit 1
            fi
            if helm lint --strict -n thorium --set secrets.renderOnly=true \
              --set-string operator.cluster.config.thorium.namespace="$bad" "$CHARTS/thorium" > /dev/null 2>&1; then
              echo "helm lint accepted the Thorium namespace '$bad'"
              exit 1
            fi
          done
      # PyYAML comes from the distro's signed packages when the runner image lacks it
      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      # the toolbox import Job's thorctl flags and retry limit follow the operator.toolbox values
      - name: Check the toolbox import Job for each toolbox value combination
        run: |
          "$CHARTS/scripts/check-toolbox-job.sh"
      - name: Check the namespace blacklist covers every prefixed namespace
        run: |
          helm template thorium "$CHARTS/thorium" -n dev-thorium --set secrets.renderOnly=true \
            --set 'operator.cluster.namespaceBlacklist={extra}' \
            --show-only charts/operator/templates/thoriumcluster.yaml \
            | python3 -c '
          import sys, yaml
          cluster = next(d for d in yaml.safe_load_all(sys.stdin) if d and d.get("kind") == "ThoriumCluster")
          found = set(cluster["spec"]["config"]["thorium"]["namespace_blacklist"])
          prefixed = {f"dev-{ns}" for ns in ("thorium", "redis", "scylla", "elastic", "seaweedfs", "quickwit", "jaeger")}
          fixed = {"infra-operators", "kube-system", "kube-public", "kube-node-lease", "default", "thorium", "scylla", "scylla-operator", "cert-manager", "redis", "elastic-system", "jaeger", "quickwit", "extra"}
          missing = sorted((prefixed | fixed) - found)
          if missing:
              sys.exit(f"thorium.namespace_blacklist is missing {missing}")
          '
      # A dev cluster is marked by a label a cluster admin puts on the Thorium Namespace, so the
      # chart must never render that Namespace or let anything it deploys change Namespaces, and
      # the operator must be able to read it
      - name: Check the operator only reads Namespaces and the chart never labels one
        run: |
          for own in true false; do
            helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true \
              --set operator.cluster.upgrade.autoTargetDev=true \
              --set operator.controller.watchOwnNamespaceOnly=$own \
              | OWN=$own python3 -c '
          import os, sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          own = os.environ["OWN"] == "true"
          # the chart never renders the release Namespace, which helm install --create-namespace makes
          named = [d["metadata"]["name"] for d in docs if d.get("kind") == "Namespace"]
          if "thorium" in named:
              sys.exit("the chart renders the release Namespace thorium")
          # nothing the chart deploys may change a Namespace, so only a cluster admin sets its labels
          for doc in docs:
              if doc.get("kind") not in ("ClusterRole", "Role"):
                  continue
              for rule in doc.get("rules") or []:
                  if "namespaces" in rule.get("resources", []) and set(rule.get("verbs", [])) & {"patch", "update", "*"}:
                      sys.exit(doc["kind"] + " " + doc["metadata"]["name"] + " can change Namespaces: " + str(rule))
          # the operator reads the Namespace, limited to the release namespace when it watches only it
          role = next(d for d in docs if d.get("kind") == "ClusterRole" and d["metadata"]["name"] == "thorium-operator")
          reads = [r for r in role["rules"] if "namespaces" in r.get("resources", []) and "get" in r.get("verbs", [])]
          if not reads:
              sys.exit("the operator ClusterRole cannot get Namespaces")
          if own and any(r.get("resourceNames") != ["thorium"] for r in reads):
              sys.exit(f"with watchOwnNamespaceOnly the Namespace read must be limited to thorium: {reads}")
          print("watchOwnNamespaceOnly=" + os.environ["OWN"] + ": ok")
          '
          done
      # Thorium namespaces sharing an S3 endpoint must not share buckets, so the default bucket
      # names follow the release namespace, while names set in the config (as convert-to-helm.sh
      # writes them) win
      - name: Check the default bucket names follow the release namespace
        run: |
          check_buckets() {
            local name=$1 namespace=$2 expected=$3
            shift 3
            helm template thorium "$CHARTS/thorium" -n "$namespace" --set secrets.renderOnly=true "$@" \
              --show-only charts/operator/templates/thoriumcluster.yaml \
              | EXPECTED="$expected" python3 -c '
          import json, os, sys, yaml
          cluster = next(d for d in yaml.safe_load_all(sys.stdin) if d and d.get("kind") == "ThoriumCluster")
          config = cluster["spec"]["config"]["thorium"]
          expected = json.loads(os.environ["EXPECTED"])
          found = {kind: config.get(kind, {}).get("bucket") for kind in expected}
          if found != expected:
              sys.exit(f"expected buckets {expected}, rendered {found}")
          '
            echo "$name: ok"
          }
          kinds="files repos attachments results ephemeral graphics reaction_cache"
          expect() {
            local prefix=$1 kind suffix sep="" out="{"
            for kind in $kinds; do
              suffix=$kind
              [ "$kind" = reaction_cache ] && suffix=reaction-cache-files
              out+="$sep\"$kind\": \"$prefix-$suffix\""
              sep=", "
            done
            echo "$out}"
          }
          check_buckets thorium thorium "$(expect thorium)"
          check_buckets dev-thorium dev-thorium "$(expect dev-thorium)"
          check_buckets explicit dev-thorium \
            '{"files": "legacy-files", "graphics": "legacy-graphics", "repos": "dev-thorium-repos"}' \
            --set operator.cluster.config.thorium.files.bucket=legacy-files \
            --set operator.cluster.config.thorium.graphics.bucket=legacy-graphics
      # ECK's self-signed HTTP certificate omits the .svc.<clusterDomain> name Thorium connects
      # to unless the Elasticsearch resource adds it as a subject alternative name
      - name: Check the Elasticsearch certificate covers the host Thorium connects to
        run: |
          for ns in thorium dev-thorium; do
            helm template thorium "$CHARTS/thorium" -n "$ns" --set secrets.renderOnly=true \
              --set global.clusterDomain=cluster.example \
              --show-only charts/operator/templates/thoriumcluster.yaml \
              --show-only charts/infra/templates/elastic.yaml \
              | python3 -c '
          import sys, yaml
          from urllib.parse import urlparse
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          cluster = next(d for d in docs if d["kind"] == "ThoriumCluster")
          elastic = next(d for d in docs if d["kind"] == "Elasticsearch")
          host = urlparse(cluster["spec"]["config"]["elastic"]["node"]).hostname
          sans = elastic["spec"].get("http", {}).get("tls", {}).get("selfSignedCertificate", {}).get("subjectAltNames", [])
          if {"dns": host} not in sans:
              sys.exit(f"the Elasticsearch certificate SANs {sans} do not include {host}")
          print(f"{host} is in the Elasticsearch certificate SANs")
          '
          done
      - name: Check every image follows global.imageRegistry
        run: |
          stray=$(helm template thorium "$CHARTS/thorium" -n thorium --set secrets.renderOnly=true \
            --set global.imageRegistry=mirror.invalid \
            | grep -E '^\s*(- )?(image|repository|agentRepository|registry):' \
            | grep -v 'mirror.invalid' || true)
          if [ -n "$stray" ]; then
            echo "Images not using global.imageRegistry:"
            echo "$stray"
            exit 1
          fi
          stray=$(helm template infra-operators "$CHARTS/infra-operators" -n infra-operators \
            --set global.imageRegistry=mirror.invalid \
            | grep -E '^\s*(- )?(image|scyllaUtilsImage|unsupportedBashToolsImageOverride):\s*\S' \
            | grep -v 'mirror.invalid' || true)
          if [ -n "$stray" ]; then
            echo "infra-operators images not using global.imageRegistry:"
            echo "$stray"
            exit 1
          fi
      - name: List images
        run: |
          "$CHARTS/scripts/list-images.sh"

  # packages the charts beside the chart lint rather than after it, so a lint failure never
  # blocks packaging or publishing. It needs no other job, so it starts with the builds, and the
  # image and chart publish wait for it
  helm-package:
    name: Build · Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # .github/scripts/release_refs.py picks the chart version, whether to publish, and the image the
      # thorium chart deploys; see its docstring for the rules
      - name: Choose the chart version
        id: version
        env:
          IS_FORK: ${{ github.event.repository.fork }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/release_refs.py chart "$CHARTS/thorium/Chart.yaml" "$CHARTS/infra-operators/Chart.yaml"
      # deploy/charts/scripts/package.sh points the thorium chart at this ref's image and checks the
      # rendered result before packaging
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_REPOSITORY: ${{ steps.version.outputs.image-repository }}
          IMAGE_TAG: ${{ steps.version.outputs.image-tag }}
        run: |
          "$CHARTS/scripts/package.sh" -d dist --version "$VERSION" --image-repository "$IMAGE_REPOSITORY" \
            --image-tag "$IMAGE_TAG"
      - name: Upload packaged charts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-charts
          path: dist/*.tgz
          retention-days: 7

  # pushes the packaged charts to the OCI registry when this ref publishes
  helm-publish:
    name: Publish · Helm charts
    needs:
      - changes
      - build-core-container
      - helm-package
      - publish-core-container
    # A run that publishes the image publishes the charts only once the image they deploy is
    # published, so a chart never points at an image that failed to publish. A run whose changes
    # publish no image publishes the charts on their own; the image for the ref is already in the
    # registry
    if: >-
      ${{ !cancelled() && needs.helm-package.result == 'success' && needs.helm-package.outputs.publish == 'true' &&
      (needs.changes.outputs.publish-image != 'true' || needs.publish-core-container.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # push charts to ghcr.io
    steps:
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Download packaged charts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-charts
          path: ${{ runner.temp }}/charts
      - name: Log in to the container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # ghcr can briefly fail to tag a manifest it was just sent when pushes of the same blobs
      # overlap, so each push is retried; pushing the same chart again is harmless
      - name: Push
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          for chart in "${RUNNER_TEMP}"/charts/*.tgz; do
            for delay in 10 30 0; do
              if helm push "$chart" "oci://ghcr.io/${repo}/charts"; then
                break
              fi
              if [ "$delay" -eq 0 ]; then
                echo "::error::helm push of $(basename "$chart") failed 3 times"
                exit 1
              fi
              echo "::warning::helm push of $(basename "$chart") failed; retrying in ${delay}s"
              sleep "$delay"
            done
          done

  # Checks the minithor and megathor deployment tools: the shell scripts are syntax-checked with
  # bash -n and linted with shellcheck (warnings and above), from the runner image or the distro's
  # signed packages, and minithor's offline tests run
  deploy-tools-shell:
    name: Lint · deployment shell scripts
    needs:
      - changes
      - publish-core-container
    if: ${{ !cancelled() && needs.changes.outputs.deploy-tools == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax
        run: |
          for script in minithor/minithor minithor/tests/*.sh megathor/scripts/*.bash; do
            bash -n "$script"
          done
      # shellcheck comes from the runner image, or the distro's signed packages when it lacks it
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Run shellcheck
        run: shellcheck --severity=warning minithor/minithor minithor/tests/*.sh megathor/scripts/*.bash
      # offline tests of deploy's helpers against stub minikube, kubectl, and helm commands (the
      # chart checks use the runner image's helm)
      - name: Run minithor's tests
        run: |
          for test in minithor/tests/*_test.sh; do
            bash "$test"
          done
      - name: Check every command's help
        run: |
          for cmd in "" minikube "minikube install" "minikube delete" start deploy credentials \
            get-config expose stop cleanup; do
            # word splitting turns each entry into its subcommand and arguments
            # shellcheck disable=SC2086
            bash minithor/minithor $cmd --help > /dev/null
          done

  # megathor's thorium chart values template is rendered with its default variables and each
  # group_vars variant, and every rendering is linted and rendered against deploy/charts/thorium
  # (and its infra-operators values template against deploy/charts/infra-operators), so a
  # template change that breaks the chart (or a chart change that breaks megathor) fails here
  # rather than in a deployment. secrets.renderOnly stands in placeholder credentials, since helm
  # can't read generated ones back from a cluster.
  megathor-values:
    name: Check · megathor values render
    needs:
      - changes
      - publish-core-container
    if: ${{ !cancelled() && needs.changes.outputs.deploy-tools == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # Jinja2 and PyYAML come from the distro's signed packages when the runner image lacks them
      - name: Install Jinja2 and PyYAML
        run: |
          python3 -c 'import jinja2, yaml' 2>/dev/null \
            || { sudo apt-get update && sudo apt-get install -y python3-jinja2 python3-yaml; }
      - name: Parse every megathor YAML file
        run: |
          find megathor -name '*.yml' -print0 | xargs -0 python3 -c '
          import sys, yaml
          for path in sys.argv[1:]:
              with open(path) as handle:
                  list(yaml.safe_load_all(handle))
          '
      # Each variant renders values.yaml.j2 from every role's defaults and group_vars/all.yml (as
      # megathor/deploy.yml loads them), any extra vars, and placeholder credentials standing in for the
      # ones the secrets role sets, then lints and renders the thorium chart with the result
      - name: Render megathor's values and check them against the thorium chart
        run: |
          render_dir="${RUNNER_TEMP}/megathor-values"
          mkdir -p "$render_dir"
          creds="${render_dir}/credentials.yml"
          for var in thorium_secret redis_password scylla_password elastic_password s3_access_key \
            s3_secret_key quickwit_postgres_super_password thorium_admin_password; do
            echo "${var}: render-only"
          done > "$creds"
          defaults=(megathor/roles/*/defaults/main.yml megathor/inventory/group_vars/all.yml)
          # check <name> <thorium namespace> [vars files and -e key=value...]
          check() {
            local name=$1 namespace=$2
            shift 2
            local values="${render_dir}/${name}.yaml"
            echo "::group::${name}"
            python3 megathor/scripts/render-values.py megathor/roles/thorium/templates/values.yaml.j2 \
              "${defaults[@]}" "$@" "$creds" > "$values"
            helm lint --strict -n "$namespace" -f "$values" --set secrets.renderOnly=true "$CHARTS/thorium"
            helm template thorium "$CHARTS/thorium" -n "$namespace" -f "$values" \
              --set secrets.renderOnly=true > /dev/null
            echo "::endgroup::"
          }
          check defaults thorium
          check offline thorium megathor/inventory/group_vars/offline.yml
          check single-node thorium megathor/inventory/group_vars/single_node.yml
          check no-quickwit thorium -e quickwit_enabled=false \
            -e thorium_tracing_endpoint=http://otel.example.com:4317
          check external thorium -e redis_enabled=false -e thorium_external_redis_host=redis.example.com \
            -e rook_enabled=false -e seaweedfs_enabled=false -e s3_endpoint=https://s3.example.com \
            -e s3_region=us-east-1
          check prefixed dev-thorium -e namespace_prefix=dev -e thorium_version=1.2.3 \
            -e thorium_container_registry=registry.example.com:5000 -e thorium_scaler_enabled=false
          check dev thorium -e thorium_upgrade_auto_target_dev=true \
            -e thorium_upgrade_dangerous_downgrade_lossy=true
          grep -q '^      autoTargetDev: true$' "${render_dir}/dev.yaml" \
            || { echo "thorium_upgrade_auto_target_dev didn't set autoTargetDev"; exit 1; }
          grep -q '^      dangerousDowngradeLossy: true$' "${render_dir}/dev.yaml" \
            || { echo "thorium_upgrade_dangerous_downgrade_lossy didn't set dangerousDowngradeLossy"; exit 1; }
          grep -q '^      dangerousDowngradeLossy: false$' "${render_dir}/defaults.yaml" \
            || { echo "dangerousDowngradeLossy isn't false by default"; exit 1; }
          grep -q '^      driftAcknowledged: \[\]$' "${render_dir}/defaults.yaml" \
            || { echo "driftAcknowledged isn't empty by default"; exit 1; }
      # Only a dev deployment's namespace keeps the dev label, which marks it a dev cluster
      - name: Check megathor labels the Thorium namespace only for autoTargetDev
        run: |
          python3 - megathor/roles/thorium/tasks/main.yml <<'PY'
          import sys, yaml
          tasks = yaml.safe_load(open(sys.argv[1]))
          def tasks_running(arg):
              return [t for t in tasks if arg in str(t.get("ansible.builtin.command"))]
          def gate(task):
              return " ".join(str(task.get("when")).split())
          labels = tasks_running("thorium.sandia.gov/dev=true")
          if len(labels) != 1:
              sys.exit(f"expected one task labelling the Thorium namespace, found {len(labels)}")
          if gate(labels[0]) != "thorium_upgrade_auto_target_dev | bool":
              sys.exit("the namespace label task must only run with thorium_upgrade_auto_target_dev")
          removals = tasks_running("thorium.sandia.gov/dev-")
          if len(removals) != 1:
              sys.exit(f"expected one task removing the namespace label, found {len(removals)}")
          if gate(removals[0]) != "not (thorium_upgrade_auto_target_dev | bool)":
              sys.exit("the label removal task must only run without thorium_upgrade_auto_target_dev")
          PY
      # minithor's dev label follows autoTargetDev, and a failed ThoriumCluster read changes nothing
      - name: Check minithor's dev label handling with a stubbed kctl
        run: |
          fn="$(sed -n '/^label_dev_namespace() {$/,/^}$/p' minithor/minithor)"
          [ -n "$fn" ] || { echo "label_dev_namespace not found in minithor"; exit 1; }
          # run the function against a kctl stub that answers the ThoriumCluster read with $read
          # (failing when it is "fail") and the label read with $label, and prints label commands
          check() {
            local name=$1 read=$2 label=$3 expect=$4 out
            out="$(
              export THORIUM_NAMESPACE=thorium
              # the function under test calls kctl once it is evaluated
              # shellcheck disable=SC2329
              kctl() {
                case "$*" in
                  *thoriumclusters*) if [ "$read" = fail ]; then return 1; fi; printf '%s' "$read" ;;
                  *"get namespace"*) printf '%s' "$label" ;;
                  "label "*) echo "RAN: kctl $*" ;;
                esac
              }
              eval "$fn"
              label_dev_namespace 2>&1
            )"
            if [ "$expect" = none ]; then
              if grep -q '^RAN:' <<< "$out"; then echo "$name: unexpected $out"; exit 1; fi
            else
              grep -qxF "RAN: kctl $expect" <<< "$out" || { echo "$name: expected $expect, got $out"; exit 1; }
            fi
            echo "$name: ok"
          }
          check auto-true "true" "" "label namespace thorium thorium.sandia.gov/dev=true --overwrite"
          check auto-false-labelled "false" "true" "label namespace thorium thorium.sandia.gov/dev-"
          check unset-unlabelled "" "" none
          check read-fails-labelled fail "true" none
      - name: Render megathor's infra-operators values and check them against the chart
        run: |
          render_dir="${RUNNER_TEMP}/megathor-values"
          mkdir -p "$render_dir"
          defaults=(megathor/roles/*/defaults/main.yml megathor/inventory/group_vars/all.yml)
          for variant in defaults offline; do
            echo "::group::infra-operators ${variant}"
            vars=()
            if [ "$variant" = offline ]; then
              vars=(megathor/inventory/group_vars/offline.yml)
            fi
            values="${render_dir}/infra-operators-${variant}.yaml"
            python3 megathor/scripts/render-values.py megathor/roles/infra_operators/templates/values.yaml.j2 \
              "${defaults[@]}" "${vars[@]}" > "$values"
            helm lint --strict -n infra-operators -f "$values" "$CHARTS/infra-operators"
            helm template infra-operators "$CHARTS/infra-operators" -n infra-operators -f "$values" > /dev/null
            echo "::endgroup::"
          done

  # docs deploy only from main on the core repo, and only after the container image is
  # published, so the hosted docs never describe an image that failed to publish
  deploy-updated-pages:
    name: Publish · docs to GitHub Pages
    if: ${{ github.ref_type == 'branch' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    needs:
      - build-mdbook-docs
      - publish-core-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write # create the GitHub Pages deployment
      id-token: write # OIDC token deploy-pages uses to authenticate the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
