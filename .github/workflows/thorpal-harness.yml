# Builds the ThorPal harness image (thorpal/toolbox/harness/Dockerfile), scans it with Trivy, and
# publishes it to ghcr.io from main
#
# - The harness binary builds on the ubuntu-22.04 runner, the release of the image's runtime, from
#   this repo alone: cargo fetches the workspace's git dependencies, rig and ghidra-cli among them,
#   from their public repositories at the commits Cargo.lock pins, so the build needs no secrets.
#   thorpal/toolbox/check-harness-binary.sh fails the build when the binary needs a glibc newer than
#   the runtime's (2.35) or an OpenSSL other than 3, and build-harness-image.sh --binary packages it.
# - The image builds and is scanned on every push to every branch but Dependabot's (which build
#   through their pull requests), every release tag, and every pull request, whatever changed.
# - Like ci.yml's core image, every build is saved and scanned with the digest-pinned Trivy image
#   (vulnerabilities only warn), and a separate job, the only one with `packages: write`, pushes
#   it. Only main publishes (the weekly schedule, manual runs, and pushes that change what goes into
#   the image: thorpal/, the workspace's Cargo.toml or Cargo.lock, or this workflow), as
#   ghcr.io/<owner>/<repo>/thorpal-harness:<version>, with the version from
#   thorpal/toolbox/harness/manifest.toml: for cisagov/thorium, the image the harness tool names
#   from thorpal/toolbox/config.toml's registry. Other branches, tags, and pull requests build and
#   scan only.
#
# To bump Trivy, update its digest here with the other workflows' (see dockerfile-lint.yml).
name: ThorPal Harness Image

on:
  # Dependabot branches are built by their pull requests instead, so each update runs once
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  # pull requests build and scan but never publish
  pull_request:
  schedule:
    # weekly, for the base image's security updates
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

# superseded runs are cancelled, except on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # trivy 0.76.1 (Apache-2.0 open source edition)
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build-harness-image:
    name: Build · ThorPal harness image
    # the harness image's runtime release, so the binary links no newer glibc than the runtime has
    runs-on: ubuntu-22.04
    # a cold build of the harness and its dependencies on a 4 CPU runner, then the scan
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # gxhash needs the AES and SSE2 target features on x86_64
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
      CARGO_INCREMENTAL: "0"
    outputs:
      image: ${{ steps.image.outputs.image }}
      publish: ${{ steps.image.outputs.publish }}
    steps:
      # the history holds a push's previous commit, which decides whether main publishes; without
      # blobs it is only commits and trees, which is all `git diff --name-only` reads
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # the image is <ghcr.io/owner/repo>/thorpal-harness:<version>; only main publishes it, on
      # schedules, manual runs, and pushes that change what goes into it
      - name: Choose Image Tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' thorpal/toolbox/harness/manifest.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version in thorpal/toolbox/harness/manifest.toml"
            exit 1
          fi
          prefix=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "registry=${prefix}"
            echo "version=${version}"
            echo "image=${prefix}/thorpal-harness:${version}"
          } >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            publish=true
            # a push publishes only when it changes what goes into the image; one with no previous
            # commit to compare with publishes
            if [ "$EVENT_NAME" = "push" ] && ! [[ "$BEFORE" =~ ^0*$ ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
              && changed=$(git diff --no-renames --name-only "$BEFORE" HEAD); then
              publish=false
              while IFS= read -r path; do
                case "$path" in
                  thorpal/* | Cargo.toml | Cargo.lock | .github/workflows/thorpal-harness.yml) publish=true ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Nightly Toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version

      - name: Build ThorPal Harness Binary
        run: cargo +nightly build --release --locked -p thorpal --bin thorpal-harness

      # the image's runtime is Ubuntu 22.04, so the binary may need no newer glibc than its 2.35
      # and must link OpenSSL 3
      - name: Check ThorPal Harness Binary
        run: bash thorpal/toolbox/check-harness-binary.sh target/release/thorpal-harness 2.35

      # the script stages the binary with harness/Dockerfile in a build context of its own,
      # labelling the image with the commit and the harness version
      - name: Build ThorPal Harness Image
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          HARNESS_VERSION: ${{ steps.image.outputs.version }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          thorpal/toolbox/build-harness-image.sh --binary target/release/thorpal-harness --pull \
            --registry "$REGISTRY" --tag "$HARNESS_VERSION" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${HARNESS_VERSION}" \
            --label "runnumber=${GITHUB_RUN_ID}"
          docker run --rm "$IMAGE" --capabilities

      # the image is saved for the vulnerability scan, and handed to the publish job so the
      # registry token never shares a job with the build
      - name: Save ThorPal Harness Image
        id: save
        # a build that is not published only needs the tar for the scan, so failing to save it
        # does not fail the build
        continue-on-error: ${{ steps.image.outputs.publish != 'true' }}
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker save --output "${RUNNER_TEMP}/thorpal-harness-image.tar" "$IMAGE"

      # uploaded before the scan so the warn-only scan steps can never delay or block publishing
      - name: Upload ThorPal Harness Image
        if: steps.image.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorpal-harness-image
          path: ${{ runner.temp }}/thorpal-harness-image.tar
          retention-days: 1

      # Trivy reads the saved image, so it gets no Docker socket, and needs the network only for
      # its vulnerability database. Vulnerabilities only warn, so these steps never fail the job.
      - name: Scan ThorPal Harness Image
        id: scan
        if: steps.save.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-image" "${RUNNER_TEMP}/trivy-cache/tmp"
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,size=512m -e HOME=/tmp -e TMPDIR=/cache/tmp -w /tmp \
            -v "${RUNNER_TEMP}/thorpal-harness-image.tar:/in/thorpal-harness-image.tar:ro" \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" \
            -v "${RUNNER_TEMP}/trivy-image:/out" \
            "$TRIVY_IMAGE" image --input /in/thorpal-harness-image.tar --scanners vuln --list-all-pkgs \
            --skip-version-check --timeout 10m --cache-dir /cache --format json --output /out/thorpal-harness.json

      # the CycloneDX SBOM is converted from the scan, so the image is read once
      - name: Write ThorPal Harness Image SBOM
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,size=512m -e HOME=/tmp -w /tmp \
            -v "${RUNNER_TEMP}/trivy-image:/out" \
            "$TRIVY_IMAGE" convert --format cyclonedx --output /out/thorpal-harness.cdx.json /out/thorpal-harness.json

      # ranks findings by EPSS and CISA KEV (downloaded in full, so no CVE IDs leave the runner)
      - name: Report ThorPal Harness Image Vulnerabilities
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          python3 .github/scripts/vuln_report.py --input "${RUNNER_TEMP}/trivy-image/thorpal-harness.json" \
            --image-name "$IMAGE" --dockerfile thorpal/toolbox/harness/Dockerfile \
            --sarif "${RUNNER_TEMP}/trivy-image/trivy-image.sarif" \
            --json "${RUNNER_TEMP}/trivy-image/vulnerabilities.json" \
            --markdown "${RUNNER_TEMP}/trivy-image/vulnerabilities.md"
          cat "${RUNNER_TEMP}/trivy-image/vulnerabilities.md" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/lint_report.py --tool trivy-image --format sarif --collapse-by-rule \
            --input "${RUNNER_TEMP}/trivy-image/trivy-image.sarif" \
            --ignore-file .github/lint-ignore.toml \
            --output-dir "${RUNNER_TEMP}/trivy-image" --fail-level none

      - name: Store ThorPal Harness Image Scan
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thorpal-harness-image-scan
          path: ${{ runner.temp }}/trivy-image/
          retention-days: 30

  publish-harness-image:
    name: Publish · ThorPal harness image
    needs: build-harness-image
    if: needs.build-harness-image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # push images to ghcr.io
    steps:
      - name: Download ThorPal Harness Image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thorpal-harness-image
          path: ${{ runner.temp }}/image
      - name: Load ThorPal Harness Image
        run: docker load --input "${RUNNER_TEMP}/image/thorpal-harness-image.tar"
      - name: Login to Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push ThorPal Harness Image
        env:
          IMAGE: ${{ needs.build-harness-image.outputs.image }}
        run: docker push "$IMAGE"
