# Runs Thorium's Rust static checks: cargo check, clippy, and rustfmt; the unit tests that need no
# services along with a check that the chart's CRD matches the operator, the schema change
# warnings, and a check that the schema pattern test series stays off main; a check that the
# integration tests compile; thoradm's tests that need no backing services; and thorctl's unit
# tests and its harness tests that need no services
#
# - ci.yml calls this workflow on pushes and pull requests that change Rust code, after its
#   builds and image publish, whatever they concluded, so these jobs never gate or block a build
#   or image publish and a failed build never hides them. It also runs weekly and on demand on
#   its own. Any of these jobs can be made a required status check later through branch
#   protection.
# - Every diagnostic is written to the job log, inline annotations, the job
#   summary, and a `<check>-report` artifact by .github/scripts/lint_report.py,
#   so reviewers can read the results without digging through build output.
# - Integration tests are type-checked but not run here; they need ScyllaDB,
#   Redis, Elasticsearch, and S3. The unit tests and the integration test check
#   are separate jobs with no `needs` between them, so a failed check never
#   hides whether the unit tests passed. The thoradm job runs thoradm's unit
#   tests and its harness tests that need no services, and compiles the rest
#   of its harness; the thorctl job does the same for thorctl. Test failures
#   are read from the job log.
# - The nightly toolchain is installed with the runner's preinstalled rustup,
#   so no third-party toolchain action is used. Nightly is unpinned, so a
#   nightly regression can fail these jobs without any change to this repo.
# - Actions are pinned by full commit SHA.
# - The Cargo registry and target/ are cached per job. Every run may restore
#   the cache, but only pushes and scheduled runs on main save it, so pull
#   request code can never write a cache entry that a main run restores. These
#   jobs publish nothing, and no other workflow uses the `rust-check-` cache
#   keys.
# - A same-repo pull request is checked twice (by its push and pull request
#   runs of ci.yml) so every pull request shows real results that can be made
#   required checks; a job skipped by a condition would count as passing.
name: Rust Check

on:
  # called by ci.yml for pushes and pull requests
  workflow_call:
  schedule:
    # weekly, to catch breakage from new nightly toolchains and lints
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions: {}

# superseded runs are cancelled; runs on main always finish so they can save
# the cache. A called run's github.workflow is the caller's name, so the suffix
# keeps this group apart from the caller's own
concurrency:
  group: ${{ github.workflow }}-rust-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # system packages the workspace needs to compile beyond the runner's build tools
  APT_PACKAGES: libssl-dev pkg-config
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    env:
      # enable the features required by gxhash explicitly
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
    steps:
      # depth 2 includes a pull request's base commit, so the report can list
      # findings in the files the pull request changed
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install system packages
        run: |
          sudo apt-get update
          # APT_PACKAGES is a fixed space-separated list, so it is split into words on purpose
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # the toolchain hash keys the cache, since build output from another
      # nightly cannot be reused
      - name: Install nightly toolchain
        id: toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version
          echo "hash=$(rustc +nightly --version --verbose | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # --workspace includes the python/thorpy bindings, which are not default
      # members. Diagnostics are written as JSON for the report step.
      - name: Run cargo check
        id: cargo
        run: |
          mkdir -p "${RUNNER_TEMP}/cargo-check"
          set +e
          cargo +nightly check --workspace --locked --message-format=json \
            > "${RUNNER_TEMP}/cargo-check/cargo-check.json"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      # warnings are reported but only errors fail this job; clippy gates on warnings
      - name: Report cargo check diagnostics
        run: |
          python3 .github/scripts/lint_report.py --tool cargo-check --format cargo \
            --input "${RUNNER_TEMP}/cargo-check/cargo-check.json" --output-dir "${RUNNER_TEMP}/cargo-check"

      - name: Store cargo check report
        if: ${{ !cancelled() && steps.cargo.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-check-report
          path: |
            ${{ runner.temp }}/cargo-check/cargo-check-report.md
            ${{ runner.temp }}/cargo-check/cargo-check-report.txt
          retention-days: 7

      - name: Fail on cargo check errors
        env:
          CARGO_EXIT: ${{ steps.cargo.outputs.exit-code }}
        run: |
          if [ "$CARGO_EXIT" != "0" ]; then
            echo "cargo check failed (exit code ${CARGO_EXIT}); see the job summary"
            exit 1
          fi

      - name: Save Cargo cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    env:
      # enable the features required by gxhash explicitly
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
    steps:
      # depth 2 includes a pull request's base commit, so the report can list
      # findings in the files the pull request changed
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install system packages
        run: |
          sudo apt-get update
          # APT_PACKAGES is a fixed space-separated list, so it is split into words on purpose
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # the toolchain hash keys the cache, since build output from another
      # nightly cannot be reused
      - name: Install nightly toolchain
        id: toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component clippy
          rustc +nightly --version
          echo "hash=$(rustc +nightly --version --verbose | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # lints the default workspace members with clippy's default lint set.
      # Warnings are not denied here, so cargo keeps going after the first
      # crate with warnings and every finding is collected; the report step
      # fails the job on any warning instead, matching `-D warnings`.
      - name: Run clippy
        id: clippy
        run: |
          mkdir -p "${RUNNER_TEMP}/clippy"
          set +e
          cargo +nightly clippy --locked --message-format=json \
            > "${RUNNER_TEMP}/clippy/clippy.json"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Report clippy findings
        run: |
          python3 .github/scripts/lint_report.py --tool clippy --format cargo \
            --input "${RUNNER_TEMP}/clippy/clippy.json" --output-dir "${RUNNER_TEMP}/clippy" \
            --fail-level warning

      - name: Store clippy report
        if: ${{ !cancelled() && steps.clippy.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy-report
          path: |
            ${{ runner.temp }}/clippy/clippy-report.md
            ${{ runner.temp }}/clippy/clippy-report.txt
          retention-days: 7

      # covers failures with no diagnostic, such as a dependency resolution error
      - name: Fail on clippy errors
        if: ${{ !cancelled() && steps.clippy.outputs.exit-code != '0' }}
        env:
          CLIPPY_EXIT: ${{ steps.clippy.outputs.exit-code }}
        run: |
          echo "cargo clippy failed (exit code ${CLIPPY_EXIT}); see the job summary"
          exit 1

      # saved even when clippy reports findings, since the build output is still valid
      - name: Save Cargo cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.toolchain.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  thoradm-test:
    name: thoradm tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    env:
      # enable the features required by gxhash explicitly
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
      # every harness test is its own binary linking the whole API, so with debug info the
      # target dir outgrows the runner's disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          # APT_PACKAGES is a fixed space-separated list, so it is split into words on purpose
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # the toolchain hash keys the cache, since build output from another
      # nightly cannot be reused
      - name: Install nightly toolchain
        id: toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version
          echo "hash=$(rustc +nightly --version --verbose | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # the library's unit tests and the examples, which include the coverage
      # page generator
      - name: Run thoradm unit tests
        run: cargo +nightly test --locked -p thoradm --lib --examples

      # the harness tests that need no services: fault injectors, enum lists,
      # and the coverage report
      - name: Run thoradm offline harness tests
        run: cargo +nightly test --locked -p thoradm --test offline

      # the integration harness needs services, so it is only compiled here
      - name: Compile the thoradm harness
        run: cargo +nightly test --locked -p thoradm --no-run --tests

      - name: Save Cargo cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  thorctl-test:
    name: thorctl tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    env:
      # enable the features required by gxhash explicitly
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
      # every harness test is its own binary linking the whole API, so with debug info the
      # target dir outgrows the runner's disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          # APT_PACKAGES is a fixed space-separated list, so it is split into words on purpose
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # the toolchain hash keys the cache, since build output from another
      # nightly cannot be reused
      - name: Install nightly toolchain
        id: toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version
          echo "hash=$(rustc +nightly --version --verbose | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # thorctl is a bin-only crate, so --bins runs the unit tests compiled into
      # the binary: toolbox v2 loading, validation, and import planning, and the
      # edit, run, and batch handlers against mock APIs
      - name: Run thorctl unit tests
        run: cargo +nightly test --locked -p thorctl --bins

      # the harness tests that need no services: toolbox build and convert run
      # as programs, and the pseudo-terminal prompt tests
      - name: Run thorctl offline harness tests
        run: cargo +nightly test --locked -p thorctl --test toolbox_build --test toolbox_convert --test tty

      # the rest of the harness needs a live Thorium, so it is only compiled here
      - name: Compile the thorctl harness
        run: cargo +nightly test --locked -p thorctl --no-run --tests

      - name: Save Cargo cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      # depth 2 includes a pull request's base commit, so the report can list
      # findings in the files the pull request changed
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # rustfmt runs on nightly like the other jobs, so formatting is checked by
      # the same toolchain developers build with
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Run rustfmt
        id: rustfmt
        run: |
          mkdir -p "${RUNNER_TEMP}/rustfmt"
          set +e
          cargo +nightly fmt --check > "${RUNNER_TEMP}/rustfmt/rustfmt.diff"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Report rustfmt findings
        run: |
          python3 .github/scripts/lint_report.py --tool rustfmt --format rustfmt \
            --input "${RUNNER_TEMP}/rustfmt/rustfmt.diff" --output-dir "${RUNNER_TEMP}/rustfmt"

      - name: Store rustfmt report
        if: ${{ !cancelled() && steps.rustfmt.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfmt-report
          path: ${{ runner.temp }}/rustfmt/
          retention-days: 7

      - name: Fail on unformatted code
        env:
          RUSTFMT_EXIT: ${{ steps.rustfmt.outputs.exit-code }}
        run: |
          if [ "$RUSTFMT_EXIT" != "0" ]; then
            echo "cargo fmt --check failed (exit code ${RUSTFMT_EXIT}); see the job summary"
            exit 1
          fi

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    env:
      # enable the features required by gxhash explicitly
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
      # the unit tests don't need debug info, and leaving it out keeps target/ well inside the
      # runner's disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          # APT_PACKAGES is a fixed space-separated list, so it is split into words on purpose
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # the toolchain hash keys the cache, since build output from another
      # nightly cannot be reused
      - name: Install nightly toolchain
        id: toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version
          echo "hash=$(rustc +nightly --version --verbose | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # the operator's reconcile and upgrade tests use an in-process fake kube
      # API, and the API library's tests cover the upgrade catalog and the
      # shipped configs, so none of these need a cluster or backing services.
      # With scylla-utils they also run the schema checks that fail the job:
      # each catalog revision's recorded fingerprint against its committed
      # snapshot, and the fingerprint snapshot of the declared schema.
      # With upgrades-runtime they also run the upgrade planner, downgrade,
      # rebuild, and cast tests and the schema lease tests
      - name: Run unit tests
        run: |
          cargo +nightly test --locked -p thorium-operator
          cargo +nightly test --locked -p thorium-api --no-default-features --features client --lib
          cargo +nightly test --locked -p thorium-api --no-default-features --features scylla-utils,client --lib
          cargo +nightly test --locked -p thorium-api --no-default-features --features upgrades-runtime,client --lib

      # the chart ships a generated copy of the CRD, which must match the
      # operator's types
      - name: Check the chart's CRD matches the operator
        run: |
          cargo +nightly run --locked -q -p thorium-operator -- crd > "${RUNNER_TEMP}/thoriumcluster.yaml"
          if ! diff -u deploy/charts/thorium/charts/operator/crds/thoriumcluster.yaml "${RUNNER_TEMP}/thoriumcluster.yaml"; then
            echo "::error file=deploy/charts/thorium/charts/operator/crds/thoriumcluster.yaml::The CRD is out of date; regenerate it with: cargo run -p thorium-operator -- crd > deploy/charts/thorium/charts/operator/crds/thoriumcluster.yaml"
            exit 1
          fi

      # warns about schema changes the latest catalog revision's snapshot doesn't
      # have, and about breaking changes no catalog step migrates yet, as
      # annotations and a job summary; the warnings never fail the job (a release
      # tag included), but failing to produce them does. It runs even after a
      # failed step so the warnings are always shown
      - name: Report schema changes
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "${RUNNER_TEMP}/schema"
          cargo +nightly run --locked -q -p thorium-api --no-default-features --features scylla-utils,client \
            --example schema_report -- --sarif "${RUNNER_TEMP}/schema/schema-changes.sarif"
          python3 .github/scripts/lint_report.py --tool schema --format sarif \
            --input "${RUNNER_TEMP}/schema/schema-changes.sarif" --output-dir "${RUNNER_TEMP}/schema"

      # the schema pattern test series lives on its own test branch: finding it
      # fails the job on main and warns on every other branch. The pattern is
      # assembled so it never matches its own text, and an ordinary
      # schema_tests module doesn't match it
      - name: Check that the schema test series is absent
        if: ${{ !cancelled() }}
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          word="schema"; tail="test"
          pattern="\\b${word}[-_]${tail}(\\b|[-_.0-9])"
          if hits=$(git grep -nE "$pattern" -- . ':!.gitlab/' ':!.github/'); then
            echo "$hits"
            if [ "$ON_MAIN" = "true" ]; then
              echo "::error::The schema test series is present on main; it belongs only on its test branch"
              exit 1
            fi
            echo "::warning::The schema test series is present; it must be removed before this branch reaches main"
          else
            echo "No schema test series content found"
          fi

      # saved even when a test fails, since the build output is still valid
      - name: Save Cargo cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.toolchain.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  integration-tests-check:
    name: integration tests check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    env:
      # enable the features required by gxhash explicitly
      RUSTFLAGS: "-C target-feature=+aes,+sse2"
      # the unit tests job's debug settings. `check` generates no code, so they
      # change nothing here, but a switch to `build` keeps them and can't fill
      # the runner's disk with debug info
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          # APT_PACKAGES is a fixed space-separated list, so it is split into words on purpose
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # the toolchain hash keys the cache, since build output from another
      # nightly cannot be reused
      - name: Install nightly toolchain
        id: toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version
          echo "hash=$(rustc +nightly --version --verbose | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-check-${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # the integration tests need a live Thorium, so they are only type-checked
      # here to catch API changes that break them. `check` skips codegen and
      # linking: a full build runs two rustc processes for the API library
      # (the library and its unit-test target) side by side at about 10 GB
      # each, which exhausts the runner's 16 GB, and links one large binary
      # per integration test, which needs about 22 GB of target/
      - name: Check integration tests
        run: cargo +nightly check --locked -p thorium-api --features test-utilities --tests

      - name: Save Cargo cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
