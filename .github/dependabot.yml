version: 2
updates:
  # actions are pinned by commit SHA, which Dependabot updates along with the
  # version comment, so pins don't go stale
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # a week's wait gives a compromised or broken release time to be pulled
    # before it is proposed
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(ci)"

  # base images for the published Thorium and thorctl images; they are pinned by
  # tag, so this proposes new Ubuntu releases while security updates within a
  # release come from rebuilding. base/ is left out because its images come from
  # an internal registry Dependabot cannot reach
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/thorctl"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # only Ubuntu LTS releases (YY.04 of even years) are proposed; the ranges
    # skip every interim release between one LTS and the next. Add the next
    # range when a new LTS ships
    ignore:
      - dependency-name: "ubuntu"
        versions:
          - ">24.04, <26.04"
          - ">26.04, <28.04"
          - ">28.04, <30.04"
    groups:
      docker-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(docker)"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # security fixes skip the PR limit, so they are grouped into one PR too
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # one PR carries every UI update; Dependabot rebases it and closes it once
    # the proposed versions are already in the lock file from other commits
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
      # security fixes skip the PR limit, so they are grouped into one PR too
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "fix(ui)"

  # crates outside the root workspace that carry their own lock files
  - package-ecosystem: "cargo"
    directory: "/cart-rs/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      cargo-other-components:
        patterns:
          - "*"
      # security fixes skip the PR limit, so they are grouped into one PR too
      cargo-other-components-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"

  # Python requirements for the megathor Ansible deployment
  - package-ecosystem: "pip"
    directory: "/megathor"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      pip-other-components:
        patterns:
          - "*"
      # security fixes skip the PR limit, so they are grouped into one PR too
      pip-other-components-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"
