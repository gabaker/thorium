version: 2
updates:
  # actions are pinned by commit SHA, which Dependabot updates along with the
  # version comment, so pins don't go stale
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # a week's wait gives a compromised or broken release time to be pulled
    # before it is proposed
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(ci)"

  # base images for the published Thorium and thorctl images; they are pinned by
  # tag, so this proposes new Ubuntu releases while security updates within a
  # release come from rebuilding. base/ is left out because its images come from
  # an internal registry Dependabot cannot reach
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/thorctl"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(docker)"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "fix(ui)"
