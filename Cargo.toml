[workspace]
resolver = "2"

members = [
  "api",
  "scaler",
  "agent",
  "thorctl",
  "reactor",
  "event-handler",
  "thoradm",
  "search-streamer",
  "operator",
  "thorium-derive",
  "cart-rs",
  "thorpal",
  "python/thorpy",
  "python/thorpy-stubs"
]

default-members = [
  "api",
  "scaler",
  "agent",
  "thorctl",
  "reactor",
  "event-handler",
  "thoradm",
  "search-streamer",
  "operator",
  "thorium-derive",
  "cart-rs"
]

[workspace.package]
version = "1.8.1"
authors = ["mcarson <mcarson@sandia.gov>", "gmbaker <gmbaker@sandia.gov>", "jehamza <jehamza@sandia.gov>"]
edition = "2024"

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
thorium-api = { version= "1.8.1", path="api", default-features = false }
thorium-derive = { version = "1.8.1", path = "thorium-derive" }
thorpal = { path = "thorpal" }
rig = "0.42.0"
ghidra-cli = { path = "../ghidra-cli" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "blocking"] }
tokio = { version = "1.45", features = ["full"] }
kube = { git = "https://github.com/stackabletech/kube-rs.git", rev="cfdfcd1", features = ["rustls-tls", "derive", "config", "client", "runtime", "http-proxy"] }
kube-derive = { git = "https://github.com/stackabletech/kube-rs.git", rev="cfdfcd1" }
k8s-openapi = { version = "0.26", default-features = false, features = ["v1_30"] }
schemars = { version = "1.0.4", features = ["uuid1"] }
tracing = { version = "0.1", features = ["valuable"] }
opentelemetry = { version = "0.30", features = ["trace"] }
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9"
chrono = { version = "0.4", features = ["serde"] }
openssl = "0.10"
cart-rs = { version = "2.0.0", path = "cart-rs"}
pyo3 = { version = "0.28", features = ["experimental-inspect", "multiple-pymethods", "uuid", "chrono", "abi3-py310"] }
sigma-rust = { git = "https://github.com/mjcarson/sigma-rust.git", branch="EditableSigmaRules", features=["openapi"]}
strum = { version = "0.27", features = ["derive"] }
http = { version = "1.3" }
# yara-x's default features minus zip-module are spelled out below: zip-module's
# tinyzip dependency is currently unfetchable through the dev network proxy and
# the zip module is not in Thorium's default yara module allowlist anyways.
# Swap the module list for default features once tinyzip is fetchable again.
yara-x = { version = "=1.21.0", default-features = false, features = [
  "rules-profiling",
  "constant-folding",
  "exact-atoms",
  "fast-regexp",
  "generate-proto-code",
  "console-module",
  "crx-module",
  "cuckoo-module",
  "dex-module",
  "dotnet-module",
  "elf-module",
  "lnk-module",
  "macho-module",
  "math-module",
  "hash-module",
  "pe-module",
  "string-module",
  "time-module",
  "test_proto2-module",
  "test_proto3-module",
  "vt-module",
] }
inventory = "0.3"
rhai = { version = "1.26", features = ["serde"] }

# `thorpal` pulls in `rig` 0.42.0, which reverse-engineers this workspace's
# LLM tooling. The published rig-core 0.42.0 has a latent type-inference bug in
# `start_text_item` (`self.current_text_item.as_deref() != Some(item_id)` with
# `item_id: &String`) that only surfaces here: thorium enables chrono's `rkyv`
# feature, whose rkyv 0.7 blanket `PartialEq` impls defeat the `&String`->`&str`
# deref coercion and make the comparison ambiguous. The local rig checkout is a
# coherent 0.42.0 workspace that already refactored that signature, so we patch
# the whole rig family to it (patching only rig-core would mix an ahead-of-release
# rig-core with crates.io facade/agent). rig is a sibling checkout at ../rig, like
# the ../ghidra-cli checkout thorpal also depends on.
[patch.crates-io]
rig = { path = "../rig" }
rig-core = { path = "../rig/crates/rig-core" }
rig-agent = { path = "../rig/crates/rig-agent" }
rig-derive = { path = "../rig/crates/rig-derive" }
