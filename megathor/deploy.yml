---

- name: deploy Thorium and its dependencies
  hosts: localhost
  gather_facts: no
  roles:
    - role: common
    # rook must go first because s3 user keys get set by Ceph
    - role: rook
      when: rook_enabled | bool
    - role: secrets
    # Quickwit's bucket on Rook or an external S3 service (the thorium chart creates it on SeaweedFS)
    - role: s3
      when: not (seaweedfs_enabled | bool)
    - role: traefik
      when: traefik_enabled | bool
    # the Scylla, ECK, and Kubegres operators, shared by every Thorium deployment in the cluster
    - role: infra_operators
      when: infra_operators_enabled | bool
    # Thorium and its backing services (the thorium Helm chart)
    - role: thorium
      when: thorium_enabled | bool
