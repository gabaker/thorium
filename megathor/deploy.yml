---

- name: deploy Thorium and its dependencies
  hosts: localhost
  gather_facts: no
  roles:
    - role: common
    # rook must go first because s3 user keys get set by Ceph
    - role: rook
      when: rook_enabled | bool
    - role: secrets
    # seaweedfs must be deployed after secrets get read/setup
    - role: seaweedfs
      when: seaweedfs_enabled | bool
    # bucket creation must happen after the S3 backend is deployed
    - role: s3
    # Databases/Tracing
    - role: elastic
      when: elastic_enabled | bool
    - role: redis
      when: redis_enabled | bool
    - role: jaeger
      when: jaeger_enabled | bool
    # the Kubegres operator is cluster-wide; kubegres_enabled alone still decides
    # whether Quickwit's Postgres is run through Kubegres
    - role: kubegres
      when: kubegres_operator_enabled | bool
    - role: quickwit
      when: quickwit_enabled | bool
    - role: scylla
      when: scylla_enabled | bool
    - role: traefik
      when: traefik_enabled | bool
    # Thorium Operator/Cluster
    - role: thorium
      when: thorium_enabled | bool
