---
- name: Download Helm Charts locally for use during offline deployments
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Ensure Helm is installed
      command: helm version
      register: helm_version
      ignore_errors: yes

    - name: Install Helm if not present
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: helm_version.rc != 0

    - name: Add Helm Traefik repo
      kubernetes.core.helm_repository:
        name: "traefik"
        repo_url: "https://helm.traefik.io/traefik"

    - name: Pull the Traefik Helm chart
      command: helm pull traefik/traefik --version {{ traefik_helm_chart_version }} --destination ./files/
      args:
        chdir: "{{ playbook_dir }}"

    # The thorium and infra-operators charts carry every subchart, so each is one file. Set
    # thorium_stage_charts_from to a deploy/charts directory to package unpublished charts.
    - name: Pull the Thorium Helm charts
      command: "helm pull {{ thorium_chart_repo }}/{{ item }} --version {{ thorium_chart_version }} --destination ./files/"
      args:
        chdir: "{{ playbook_dir }}"
      loop: [thorium, infra-operators]
      when: thorium_stage_charts_from is not defined

    - name: Package the Thorium Helm charts from source
      command: "helm package {{ thorium_stage_charts_from }}/{{ item }} --destination ./files/"
      args:
        chdir: "{{ playbook_dir }}"
      loop: [thorium, infra-operators]
      when: thorium_stage_charts_from is defined

    # The images the charts deploy, as "<source> <path>" lines for scripts/mirror-images.bash
    - name: List the images the Thorium charts deploy
      shell: >-
        {{ playbook_dir }}/../deploy/charts/list-images.sh {{ thorium_values_files | default([]) | map('quote') | join(' ') }}
        > ./files/thorium-images.txt
      args:
        chdir: "{{ playbook_dir }}"
      environment:
        THORIUM_CHART: "{{ playbook_dir }}/files/thorium-{{ thorium_chart_version }}.tgz"
        INFRA_OPERATORS_CHART: "{{ playbook_dir }}/files/infra-operators-{{ thorium_chart_version }}.tgz"

    - name: Add Helm Rook repo
      kubernetes.core.helm_repository:
        name: "rook-release"
        repo_url: "https://charts.rook.io/release" 

    - name: Pull the Rook Operator Helm chart
      command: helm pull rook-release/rook-ceph --version {{ rook_helm_chart_version }} --destination ./files/
      args:
        chdir: "{{ playbook_dir }}"

    - name: Pull the Rook Ceph Cluster Helm chart
      command: helm pull rook-release/rook-ceph-cluster --version {{ rook_helm_chart_version }} --destination ./files/
      args:
        chdir: "{{ playbook_dir }}"
