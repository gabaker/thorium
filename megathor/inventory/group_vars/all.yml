offline: false
service_wait_timeout: 300
# storage_class: ceph-block # use with rook
# storage_class: hostpath # use with docker desktop k8s
storage_class: local-path
# The file holding the password megathor encrypts its secrets vault with; create it before the
# first run and pass it to ansible-playbook with --vault-password-file so the vault can be read
vault_password_file: "artifacts/vault_pass"
# vault_path: "artifacts/secrets.yml"

# The Thorium Helm charts (thorium and infra-operators). Online deployments install the
# published charts; offline deployments install the copies offline-stage.yml saves to files/.
# thorium_chart / infra_operators_chart override either with a chart directory, packaged .tgz,
# or oci:// reference (e.g. to test unpublished charts from ../deploy/charts).
thorium_chart_repo: "oci://ghcr.io/cisagov/thorium/charts"
thorium_chart_version: "1.8.1"
# thorium_chart: ""
# infra_operators_chart: ""
# Extra values files for the thorium chart, applied after the values megathor generates
# (see deploy/charts/thorium/values.yaml for every setting)
# thorium_values_files: []
# Extra values files for the infra-operators chart
# infra_operators_values_files: []

# Prefix Thorium's namespaces ("<namespace_prefix>-thorium", ...); a lowercase DNS label of at
# most 32 characters (see "Namespaces and the namespace prefix" in the Thorium deployment docs).
# Thorium's own namespace, thorium_namespace, is derived from it
# namespace_prefix: ""

# The cluster-wide operators (infra-operators chart); disable any the cluster already runs
# scylla_operator_enabled: true
# elastic_operator_enabled: true
# kubegres_operator_enabled: true
# scylla_operator_replicas: 1

# Backing services deployed by the thorium chart (sizes and the thorium_external_* settings an
# external service needs: roles/thorium/defaults/main.yml)
redis_enabled: true
elastic_enabled: true
# kibana_enabled: true
scylla_enabled: true
# scylla_members: 3
# scylla_replication_factor: 3
# scylla_developer_mode: false
# Jaeger reads traces from Quickwit, so it is only deployed with quickwit_enabled
jaeger_enabled: true
quickwit_enabled: true
quickwit_bucket: "quickwit"
# The OTLP gRPC collector Thorium sends traces to; empty uses the chart's Quickwit indexer, so set
# it when quickwit_enabled is false
# thorium_tracing_endpoint: ""
# An external Postgres for the Quickwit metastore instead of the chart's (create the database first)
# quickwit_metastore_uri: "postgres://user:password@host:5432/quickwit-metastore"
# An external Redis instead of the chart's. redis_password is required and must be the password it
# requires; megathor neither generates it nor saves it to its vault, so keep it in an
# ansible-vault encrypted vars file
# redis_enabled: false
# thorium_external_redis_host: "redis.example.com"
# redis_password: ""
# An external Scylla / Elasticsearch instead of the chart's. Without
# thorium_scylla_admin_secret / thorium_elastic_admin_secret (roles/thorium/defaults) the
# operator doesn't create Thorium's role or user, so give the ones you created; the run fails
# without them. Keep the passwords in an ansible-vault encrypted file, e.g.
# `ansible-vault encrypt_string --name thorium_external_scylla_password '<password>'`
# scylla_enabled: false
# thorium_external_scylla_nodes: ["scylla-1.example.com:9042"]
# thorium_external_scylla_username: "thorium"
# thorium_external_scylla_password: ""
# elastic_enabled: false
# thorium_external_elastic_node: "https://elastic.example.com:9200"
# thorium_external_elastic_username: "thorium"
# thorium_external_elastic_password: ""

# The cluster's service and pod CIDRs, passed to the chart's global.clusterCIDRs so in-cluster
# traffic addressed by IP bypasses an operator proxy (megathor can't detect them)
# thorium_cluster_cidrs: ["10.96.0.0/12", "10.244.0.0/16"]

# S3 backend: enable at most one of rook_enabled or seaweedfs_enabled.
# - rook: replicated Ceph object store (and ceph-block storage class) for multi-node clusters
# - seaweedfs: single-instance SeaweedFS (`weed mini`) on one PVC; the single_node default
# Disable both to use an external S3 service and set the s3_* overrides below.
seaweedfs_enabled: false
# seaweedfs_volume_size: "128Gi"

# Rook Operator
rook_enabled: true
rook_helm_chart_version: "v1.18.1"
# rook_namespace: "rook-ceph"

# Rook Ceph Cluster
ceph_ignore_health_errors: true
ceph_health_check_retries: 1

# S3
# s3_endpoint, s3_region, s3_flavor, s3_thorium_region, and s3_use_path_style are derived
# from the enabled S3 backend (see roles/s3/defaults/main.yml); set them only for external S3
# s3_endpoint: "https://s3.example.com" # required when no S3 backend is enabled
# s3_region: "us-east-1"
# s3_flavor: "" # Quickwit flavor ("minio" covers rook/ceph)
# s3_use_path_style: false
# The keys for an external S3 service are required and, like an external redis_password, never
# generated or saved to megathor's vault
# s3_access_key: ""
# s3_secret_key: ""
s3_validate_certs: true

# Traefik
traefik_enabled: true
traefik_helm_chart_version: "37.1.0"
# traefik_namespace: "traefik"
# the type of Traefik's Service. A LoadBalancer Service needs a load balancer controller (MetalLB,
# a cloud provider) to assign its address, or traefik_external_ips; without either use NodePort
# traefik_service_type: "LoadBalancer"
# the node addresses Traefik's Service is reachable on (its externalIPs), e.g.
# ["10.0.0.11", "10.0.0.12"]; empty leaves them out, for a cluster whose load balancer assigns
# the address. Kubernetes rejects unspecified (0.0.0.0, ::), loopback, and link-local addresses
traefik_external_ips: []
# wait for the whole Traefik release, Service included; by default skipped for a LoadBalancer
# Service without externalIPs, which only a load balancer controller can make ready (the role
# then waits for Traefik's Deployment alone)
# traefik_wait: true

# Thorium
thorium_enabled: true
# thorium_deployment_name: "thorium"
# thorium_container_registry: "ghcr.io"
# thorium_image: "cisagov/thorium/infrastructure/thorium"
# thorium_version: "" # defaults to the chart's appVersion
# thorium_image_pull_policy: "Always" # IfNotPresent to run from images cached on the nodes
# thorium_admin_username: "admin"
# The Kubernetes nodes Thorium may schedule jobs on (an empty list means every node)
thorium_nodes: []
# Pull secret value is just a stub placeholder base64(thorium:corn)
# thorium_image_pull_secret:
#   auths:
#     "registry.domain:port":
#       auth: "dGhvcml1bTpjb3JuCg=="
# thorium_ui_banner: |
#   Welcome to Thorium. <Please place you banner here>
#
# thorium_ingress_enabled: true
# thorium_ingress_hostname: "*" # or put thorium.<SLD>.<TLD>
# thorium_tls_cert_secret_name: "api-certs"
