offline: true
use_proxy: false
# replace this IP:PORT with the IP/Hostname:port of your private registry. Every image must be
# mirrored there under its upstream path without the registry host (e.g.
# docker.io/scylladb/scylla:6.2.3 -> <offline_registry>/scylladb/scylla:6.2.3): the Thorium
# charts' images are listed in files/thorium-images.txt by offline-stage.yml, the rest in
# scripts/offline-images.txt; mirror both with scripts/mirror-images.bash.
offline_registry: "10.0.0.1:5000"

k8s_registry: "{{ offline_registry }}"

# The thorium and infra-operators charts pull every image from offline_registry
# (global.imageRegistry), installing the packaged charts offline-stage.yml saved to files/

# Rook Operator
rook_container_registry: "{{ offline_registry }}"
# rook_image: "rook/ceph"
# rook_helm_chart_version: "v1.18.1"

# Rook Ceph Cluster
ceph_container_registry: "{{ offline_registry }}"
# ceph_image: "ceph/ceph"
# ceph_version: "v19.2.3"

# Traefik
traefik_container_registry: "{{ offline_registry }}"
# traefik_image: "traefik"
# traefik_helm_chart_version: "37.1.0"
