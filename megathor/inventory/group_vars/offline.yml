offline: true
use_proxy: false
# replace this IP:PORT with the IP/Hostname:port of your private registry; every
# image must be mirrored there under its upstream path (see scripts/offline-images.txt
# and scripts/mirror-images.bash)
offline_registry: "10.0.0.1:5000"

k8s_registry: "{{ offline_registry }}"

# Elastic
elastic_container_registry: "{{ offline_registry }}"
# elastic_operator_version: "2.16.0"
# elastic_search_version: "8.19.2"

# Redis
redis_container_registry: "{{ offline_registry }}"
# redis_image: "redis"
# redis_version: "7.4.11"

# SeaweedFS
seaweedfs_container_registry: "{{ offline_registry }}"
# seaweedfs_image: "chrislusf/seaweedfs"
# seaweedfs_version: "4.48"

# Rook Operator
rook_container_registry: "{{ offline_registry }}"
# rook_image: "rook/ceph"
# rook_helm_chart_version: "v1.18.1"

# Rook Ceph Cluster
ceph_container_registry: "{{ offline_registry }}"
# ceph_image: "ceph/ceph"
# ceph_version: "v19.2.3"

# Jaeger
jaeger_container_registry: "{{ offline_registry }}"
# jaeger_image: "jaegertracing/jaeger-query"
# jaeger_version: "1.76.0"

# Kubegres
kubegres_container_registry: "{{ offline_registry }}"
# kubegres_image: "reactivetechio/kubegres"
# kubegres_version: "1.19"

# Quickwit
quickwit_container_registry: "{{ offline_registry }}"
# quickwit_image: "quickwit/quickwit"
quickwit_postgres_container_registry: "{{ offline_registry }}"
# quickwit_postgres_image: "postgres"
# quickwit_postgres_version: "17"

# Traefik
traefik_container_registry: "{{ offline_registry }}"
# traefik_image: "traefik"
# traefik_helm_chart_version: "37.1.0"

# Cert Manager
cert_manager_container_registry: "{{ offline_registry }}"
cert_manager_cainjector_image: "{{ cert_manager_container_registry }}/jetstack/cert-manager-cainjector:{{ cert_manager_version }}"
cert_manager_controller_image: "{{ cert_manager_container_registry }}/jetstack/cert-manager-controller:{{ cert_manager_version }}"
cert_manager_webhook_image: "{{ cert_manager_container_registry }}/jetstack/cert-manager-webhook:{{ cert_manager_version }}"
cert_manager_acme_solver_image: "{{ cert_manager_container_registry }}/jetstack/cert-manager-acmesolver:{{ cert_manager_version }}"
# cert_manager_version: "v1.18.2"

# Scylla Operator and Cluster
scylla_container_registry: "{{ offline_registry }}"
# scylla_base_image: "scylladb"
# scylla_image: "scylladb/scylla"
# scylla_agent_image: "scylladb/scylla-manager-agent"
# offline-stage.yml pulls files/scylla-operator-<scylla_helm_chart_version>.tgz (the chart
# versions carry a "v" prefix, e.g. scylla-operator-v1.21.1.tgz)
# scylla_helm_chart_version: "v1.21.1"

# Thorium Operator
thorium_container_registry: "{{ offline_registry }}"
# thorium_image: "cisagov/thorium/infrastructure/thorium"
# thorium_version: "latest"
