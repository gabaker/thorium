---

- name: Create Quickwit namespace
  kubernetes.core.k8s:
    name: "{{ quickwit_namespace }}"
    state: present
    kind: Namespace

- name: Create Kubegres Postgres secrets
  kubernetes.core.k8s:
    namespace: "{{ quickwit_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'postgres/kubegres/secret.yaml.j2') }}"
  when: kubegres_enabled | bool
  no_log: true

- name: Create Kubegres Postgres cluster
  kubernetes.core.k8s:
    namespace: "{{ quickwit_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'postgres/kubegres/cluster.yaml.j2') }}"
  when: kubegres_enabled | bool

# Kubegres creates the statefulset some time after the Kubegres resource, and
# rollout status fails immediately while it doesn't exist, so retry until it does
- name: Wait for Kubegres Postgres to be rolled out
  shell: /bin/bash -c "kubectl rollout status --watch --timeout=60s statefulset/postgres-1 -n {{ quickwit_namespace }}"
  register: postgres_rollout
  until: postgres_rollout.rc == 0
  retries: 10
  delay: 5
  changed_when: false

# Kubegres requires password auth even on the local socket. The password goes
# over stdin into PGPASSWORD inside the pod so it never appears on a command
# line, and a failure here stops the run instead of leaving Quickwit to
# crash-loop without its metastore database. POSTGRES_PASSWORD only applies
# when the data directory is created, so a failed login also means the saved
# password no longer matches the database.
- name: Create the Quickwit metastore database
  shell: >-
    kubectl -n {{ quickwit_namespace }} exec -i pod/postgres-1-0 --
    sh -c 'IFS= read -r pw; export PGPASSWORD="$pw";
    psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='"'"'quickwit-metastore'"'"'" | grep -q 1
    || createdb -U postgres quickwit-metastore'
  args:
    stdin: "{{ quickwit_postgres_super_password }}"
  register: quickwit_metastore_db
  until: quickwit_metastore_db.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  no_log: true

- name: Add helm Quickwit repo (online only)
  kubernetes.core.helm_repository:
    name: "quickwit"
    repo_url: "https://helm.quickwit.io"
  when: offline == false

- name: Deploy helm Quickwit chart with values (online)
  kubernetes.core.helm:
    name: "quickwit"
    chart_ref: "quickwit/quickwit"
    release_namespace: "{{ quickwit_namespace }}"
    chart_version: "{{ quickwit_helm_chart_version }}"
    values: "{{ lookup('template', 'quickwit.yaml.j2') | from_yaml }}"
    wait: true
  when: offline == false
  no_log: true

- name: Deploy helm Quickwit chart with values (offline)
  kubernetes.core.helm:
    name: "quickwit"
    chart_ref: "{{ playbook_dir }}/files/quickwit-{{ quickwit_helm_chart_version }}.tgz"
    release_namespace: "{{ quickwit_namespace }}"
    values: "{{ lookup('template', 'quickwit.yaml.j2') | from_yaml }}"
    wait: true
  when: offline == true
  no_log: true
