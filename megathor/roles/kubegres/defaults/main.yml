
# kubegres
# Whether Quickwit's Postgres is run through Kubegres
kubegres_enabled: true
# Deploy the cluster-wide Kubegres operator and CRD; disable when another
# Thorium deployment in this cluster already provides them
kubegres_operator_enabled: "{{ kubegres_enabled }}"
kubegres_container_registry: "docker.io"
kubegres_image: "reactivetechio/kubegres"
kubegres_version: "1.19"
