# The S3 settings below are derived from whichever S3 backend role is enabled
# (seaweedfs_enabled or rook_enabled); set them in group_vars only when pointing
# Thorium at an external S3 service, in which case s3_endpoint is required
s3_endpoint: >-
  {%- if seaweedfs_enabled | default(false) | bool -%}
  {{ seaweedfs_s3_endpoint }}
  {%- elif rook_enabled | default(false) | bool -%}
  http://rook-ceph-rgw-thorium-s3.{{ rook_namespace }}.svc.cluster.local
  {%- endif -%}
# The region used to sign requests and, for any region other than us-east-1, the
# LocationConstraint the Thorium operator creates buckets with. Rook names the
# Ceph zonegroup after the object store (thorium-s3), which RGW requires as the
# constraint; SeaweedFS and AWS accept us-east-1.
s3_region: "{{ 'thorium-s3' if rook_enabled | default(false) | bool else 'us-east-1' }}"
# Quickwit storage flavor ("minio" covers rook/ceph); Quickwit has no SeaweedFS
# flavor so an empty value leaves it out of the Quickwit config
s3_flavor: "{{ 'minio' if rook_enabled | default(false) | bool else '' }}"
# The region given to Thorium's S3 client; an empty value leaves it out of the Thorium config
s3_thorium_region: "{{ s3_region }}"
# Whether Thorium addresses buckets with path-style URLs. In-cluster backends are
# reached through a single service name, so bucket subdomains wouldn't resolve.
s3_use_path_style: "{{ rook_enabled | default(false) | bool or seaweedfs_enabled | default(false) | bool }}"
s3_validate_certs: true
