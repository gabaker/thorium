thorium_enabled: true
# The ThoriumCluster's name and the namespace this deployment runs in (the thorium chart's
# release namespace; every other namespace gets the same prefix)
thorium_deployment_name: "thorium"
thorium_namespace: "{{ namespace_prefix }}thorium"
# The chart to install; empty uses the published chart online or files/ offline
thorium_chart: ""
# Extra values files for the thorium chart, applied after the values megathor generates
thorium_values_files: []
# How long to wait for the operator to report the ThoriumCluster ready
thorium_ready_timeout: 1800

# The Thorium image; an empty version uses the chart's appVersion
thorium_container_registry: "ghcr.io"
thorium_image: "cisagov/thorium/infrastructure/thorium"
thorium_version: ""
thorium_operator_memory_limits: "512Mi"
thorium_operator_cpu_limits: "512m"
thorium_operator_memory_requests: "256Mi"
thorium_operator_cpu_requests: "256m"
# The Kubernetes nodes Thorium may schedule jobs on (an empty list means every node)
thorium_nodes: []
# Run the Thorium k8s scaler; it names namespaces after Thorium groups, so only one
# deployment per cluster should run it
thorium_scaler_enabled: true
# The initial Thorium admin user; its password is generated once and kept in the vault
thorium_admin_username: "admin"
# Pull secret value is just a stub placeholder base64(thorium:corn)
thorium_image_pull_secret: {}
# thorium_image_pull_secret:
#  auths:
#    "registry.domain:port":
#      auth: "dGhvcml1bTpjb3JuCg=="
thorium_ui_banner: |
  Welcome to Thorium. <Please place you banner here>
# Route the API through Traefik (needs Traefik's CRDs in the cluster)
thorium_ingress_enabled: true
# Deployments sharing one Traefik must each set a distinct hostname; unset (or "*") routes
# every host to this deployment
# thorium_ingress_hostname: "thorium.example.com"
# thorium_tls_cert_secret_name: "api-certs"

# Backing services deployed by the thorium chart
redis_enabled: true
redis_volume_size: "16Gi"
redis_cpu_requests: "512m"
redis_memory_requests: "512Mi"
redis_cpu_limits: "2"
redis_memory_limits: "4Gi"

seaweedfs_volume_size: "128Gi"
seaweedfs_cpu_requests: "500m"
seaweedfs_memory_requests: "1Gi"
seaweedfs_cpu_limits: "2"
seaweedfs_memory_limits: "4Gi"

scylla_enabled: true
scylla_members: 3
scylla_replication_factor: 3
scylla_developer_mode: false
scylla_storage_size: "32Gi"
scylla_cpu_requests: "0"
scylla_memory_requests: "0"
scylla_cpu_limits: "4"
scylla_memory_limits: "16Gi"
scylla_username: "thorium"

elastic_enabled: true
elastic_username: "thorium"
elastic_search_node_count: 1
elastic_search_volume_size: "32Gi"
elastic_search_cpu_requests: "1"
elastic_search_cpu_limits: "2"
elastic_search_memory_requests: "4G"
elastic_search_memory_limits: "4G"
kibana_enabled: true
kibana_cpu_requests: "1"
kibana_cpu_limits: "1"
kibana_memory_requests: "1G"
kibana_memory_limits: "1G"

jaeger_enabled: true
jaeger_cpu_requests: "512m"
jaeger_memory_requests: "512Mi"
jaeger_cpu_limits: "1"
jaeger_memory_limits: "1G"

quickwit_enabled: true
quickwit_metastore_replica_count: 1
quickwit_searcher_replica_count: 1
quickwit_postgres_replicas: 1
quickwit_postgress_storage_size: "32G"
quickwit_postgres_memory_requests: "1Gi"
quickwit_postgres_cpu_requests: "1"
quickwit_postgres_memory_limits: "2Gi"
quickwit_postgres_cpu_limits: "2"
