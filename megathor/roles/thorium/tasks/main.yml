---

- name: Create namespace
  kubernetes.core.k8s:
    name: "{{ thorium_namespace }}"
    state: present
    kind: Namespace

- name: Create registry-token for service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: registry-token
        namespace: "{{ thorium_namespace }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ thorium_image_pull_secret | to_json | ansible.builtin.b64encode }}"

- name: Create UI Banner 
  kubernetes.core.k8s:
    name: banner
    state: present
    namespace: "{{ thorium_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: banner
      data:
        banner.txt: "{{ thorium_ui_banner }}"

- name: Create Service Account and rbac
  kubernetes.core.k8s:
    namespace: "{{ thorium_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'rbac.yaml.j2') }}"

- name: Deploy the Thorium operator
  when: thorium_operator_enabled | bool
  block:
    - name: Create operator deployment
      kubernetes.core.k8s:
        namespace: "{{ thorium_namespace }}"
        state: present
        apply: true
        definition: "{{ lookup('template', 'operator.yaml.j2') }}"

    - name: Wait for Operator to be available
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: operator
        namespace: "{{ thorium_namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300
        wait_sleep: 5

# A deployment sharing another deployment's operator needs the operator to have
# registered the ThoriumCluster CRD before the ThoriumCluster can be created
- name: Wait for the ThoriumCluster CRD to be established
  shell: kubectl wait --for condition=established --timeout=30s crd/thoriumclusters.sandia.gov
  register: thorium_crd_wait
  until: thorium_crd_wait.rc == 0
  retries: "{{ (service_wait_timeout | int / 30) | int }}"
  delay: 1
  changed_when: false

- name: Create Traefik ingress and TLS configurations
  kubernetes.core.k8s:
    namespace: "{{ thorium_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'traefik.yaml.j2') }}"
  when: thorium_ingress_enabled | bool

- name: Create ThoriumCluster
  kubernetes.core.k8s:
    namespace: "{{ thorium_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'thorium-cluster.yaml.j2') }}"
  # the resource embeds every backend credential
  no_log: true
