---

- name: Deploy Cert Manager
  when: cert_manager_enabled | bool
  block:
    - name: Create cert-manager resources
      kubernetes.core.k8s:
        namespace: "cert-manager"
        state: present
        definition: "{{ lookup('template', 'cert-manager/{{ cert_manager_version }}/cert-manager.yaml.j2') }}"

    # The Scylla operator chart creates an Issuer and Certificate, which the
    # cert-manager webhook must be serving before they can be admitted
    - name: Wait for cert-manager CRDs to be established
      shell: >-
        kubectl wait --for condition=established --timeout={{ service_wait_timeout }}s
        crd/certificates.cert-manager.io crd/issuers.cert-manager.io
      changed_when: false

    - name: Wait for cert-manager to roll out
      shell: /bin/bash -c "kubectl rollout status --watch deployment/{{ item }} -n cert-manager --timeout={{ service_wait_timeout }}s"
      loop:
        - cert-manager
        - cert-manager-cainjector
        - cert-manager-webhook
      changed_when: false

    # A rolled-out webhook still rejects requests until the cainjector has
    # written its CA bundle, so retry a dry-run Issuer until it is admitted
    - name: Wait for the cert-manager webhook to accept requests
      shell: kubectl apply --dry-run=server -f -
      args:
        stdin: |
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: cert-manager-readiness-check
            namespace: cert-manager
          spec:
            selfSigned: {}
      register: cert_manager_webhook
      until: cert_manager_webhook.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Deploy the Scylla operator
  when: scylla_operator_enabled | bool
  block:
    - name: Add Helm Scylla repo (online only)
      kubernetes.core.helm_repository:
        name: "scylla"
        repo_url: "https://scylla-operator-charts.storage.googleapis.com/stable"
      when: offline == false

    - name: Deploy Helm Scylla operator chart with values (online)
      kubernetes.core.helm:
        name: "scylla"
        chart_ref: "scylla/scylla-operator"
        create_namespace: true
        release_namespace: "{{ scylla_operator_namespace }}"
        chart_version: "{{ scylla_helm_chart_version }}"
        values: "{{ lookup('template', 'scylla/operator/{{ scylla_helm_chart_version }}/operator.yaml.j2') | from_yaml }}"
        wait: true
      when: offline == false

    - name: Deploy Helm Scylla operator chart with values (offline)
      kubernetes.core.helm:
        name: "scylla"
        chart_ref: "{{ playbook_dir }}/files/scylla-operator-{{ scylla_helm_chart_version }}.tgz"
        create_namespace: true
        release_namespace: "{{ scylla_operator_namespace }}"
        values: "{{ lookup('template', 'scylla/operator/{{ scylla_helm_chart_version }}/operator.yaml.j2') | from_yaml }}"
        wait: true
      when: offline == true

    - name: Wait for the Scylla operator and its webhook to roll out
      shell: /bin/bash -c "kubectl rollout status --watch deployment/{{ item }} -n {{ scylla_operator_namespace }} --timeout={{ service_wait_timeout }}s"
      loop:
        - scylla-operator
        - webhook-server
      changed_when: false

    - name: Wait for the Scylla webhook to start serving
      ansible.builtin.pause:
        seconds: 10

- name: Create Scylla namespace
  kubernetes.core.k8s:
    name: "{{ scylla_namespace }}"
    state: present
    kind: Namespace

- name: Create Scylla config file
  kubernetes.core.k8s:
    name: scylla-config
    state: present
    namespace: "{{ scylla_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: scylla-config
      data:
        scylla.yaml: "{{ lookup('template', 'scylla/cluster/scylla.yaml.j2') }}"

- name: Check for the Scylla agent auth token secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: scylla-auth-token
    namespace: "{{ scylla_namespace }}"
  register: scylla_auth_token

# The racks reference the scylla-agent-config agent config, so the operator
# mounts the agent auth token from this secret rather than generating one, and
# the Scylla pod can't start without it. It's only created when missing so a
# rerun keeps the token the running agents already use.
- name: Create the Scylla agent auth token secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: scylla-auth-token
        namespace: "{{ scylla_namespace }}"
      type: Opaque
      stringData:
        auth-token.yaml: "auth_token: {{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"
  when: scylla_auth_token.resources | length == 0
  no_log: true

- name: Create Scylla cluster
  kubernetes.core.k8s:
    namespace: "{{ scylla_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'scylla/cluster/cluster.yaml.j2') }}"

# The operator creates the statefulset some time after the ScyllaCluster, and
# rollout status fails immediately while it doesn't exist, so retry until it does
- name: Wait for cluster to be ready
  shell: /bin/bash -c "kubectl rollout status --watch statefulset/scylla-us-east-1-us-east-1a -n {{ scylla_namespace }} --timeout={{ service_wait_timeout }}s"
  register: scylla_rollout
  until: scylla_rollout.rc == 0
  retries: 10
  delay: 10
  changed_when: false

- name: Configure Database User and Replication Factor
  shell: "kubectl -n {{ scylla_namespace }} exec -i pod/scylla-us-east-1-us-east-1a-0 -c scylla -- /bin/bash"
  args:
    stdin: "{{ lookup('template', 'scylla/init.sh.j2') }}"
  no_log: true
