---

- name: Add Helm repo (online only)
  kubernetes.core.helm_repository:
    name: "rook-release"
    repo_url: "https://charts.rook.io/release" 
  when: not (offline | bool)

- name: Deploy Helm operator chart with values (online)
  kubernetes.core.helm:
    release_name: "rook-release"
    chart_ref: "rook-release/rook-ceph"
    create_namespace: true
    release_namespace: "{{ rook_namespace }}"
    chart_version: "{{ rook_helm_chart_version }}"
    values: "{{ lookup('template', 'operator.yaml.j2') | from_yaml }}"
    wait: true
  when: not (offline | bool)

- name: Deploy Helm operator chart with values (offline)
  kubernetes.core.helm:
    release_name: "rook-release"
    chart_ref: "{{ playbook_dir }}/files/rook-ceph-{{ rook_helm_chart_version }}.tgz"
    create_namespace: true
    release_namespace: "{{ rook_namespace }}"
    values: "{{ lookup('template', 'operator.yaml.j2') | from_yaml }}"
    wait: true
  when: offline | bool

- name: Deploy Helm Ceph cluster chart with values (online)
  kubernetes.core.helm:
    release_name: "rook-ceph-cluster"
    chart_ref: "rook-release/rook-ceph-cluster"
    create_namespace: true
    release_namespace: "{{ rook_namespace }}"
    chart_version: "{{ rook_helm_chart_version }}"
    values: "{{ lookup('template', 'cluster.yaml.j2') | from_yaml }}"
    wait: true
  when: not (offline | bool)

- name: Deploy Helm Ceph cluster chart with values (offline)
  kubernetes.core.helm:
    release_name: "rook-ceph-cluster" 
    chart_ref: "{{ playbook_dir }}/files/rook-ceph-cluster-{{ rook_helm_chart_version }}.tgz"
    create_namespace: true
    release_namespace: "{{ rook_namespace }}"
    values: "{{ lookup('template', 'cluster.yaml.j2') | from_yaml }}"
    wait: true
  when: offline | bool

- name: Wait for Ceph cluster pods to be running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ rook_namespace }}"
    label_selectors:
      - app=rook-ceph-mon
    wait: yes
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ service_wait_timeout }}"

- name: Wait for Ceph Rados Gateway (rgw) pods to be running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ rook_namespace }}"
    label_selectors:
      - app=rook-ceph-rgw
    wait: yes
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ service_wait_timeout }}"

- name: Verify cluster is healthy using Ceph tool box
  ansible.builtin.command: "kubectl -n {{ rook_namespace }} exec deploy/rook-ceph-tools -- ceph status"
  register: ceph_status_output
  until: "'HEALTH_OK' in ceph_status_output.stdout"
  retries: "{{ ceph_health_check_retries }}"
  delay: 10
  ignore_errors: "{{ ceph_ignore_health_errors }}"

# radosgw-admin prints the user's keys, so its output stays out of the log
- name: Look up Thorium's S3 user
  ansible.builtin.command: "kubectl -n {{ rook_namespace }} exec deploy/rook-ceph-tools -- radosgw-admin user info --rgw-realm thorium-s3 --uid=thorium-s3-user"
  register: s3_user_info
  failed_when: false
  changed_when: false
  no_log: true

- name: Create Thorium's S3 user
  ansible.builtin.command: "kubectl -n {{ rook_namespace }} exec deploy/rook-ceph-tools -- radosgw-admin user create --rgw-realm thorium-s3 --uid=thorium-s3-user --display-name='Thorium S3 User'"
  register: s3_user_create
  when: s3_user_info.rc != 0
  # the failure is reported by the next task, since this one's output holds the keys
  failed_when: false
  no_log: true

- name: Fail when Thorium's S3 user couldn't be created
  ansible.builtin.fail:
    msg: "radosgw-admin user create failed (rc {{ s3_user_create.rc }}): {{ s3_user_create.stderr }}"
  when:
    - s3_user_create is not skipped
    - s3_user_create.rc != 0

- name: Save the S3 user's access and secret keys
  ansible.builtin.set_fact:
    s3_access_key: "{{ (s3_user_info if s3_user_info.rc == 0 else s3_user_create).stdout | from_json | json_query('keys[0].access_key') }}"
    s3_secret_key: "{{ (s3_user_info if s3_user_info.rc == 0 else s3_user_create).stdout | from_json | json_query('keys[0].secret_key') }}"
  no_log: true
