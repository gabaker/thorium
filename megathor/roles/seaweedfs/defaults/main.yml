seaweedfs_enabled: false
seaweedfs_namespace: "{{ namespace_prefix }}seaweedfs"
seaweedfs_container_registry: "docker.io"
seaweedfs_image: "chrislusf/seaweedfs"
# Pinned because `weed mini` defaults (ports, enabled services) can change between releases
seaweedfs_version: "4.48"
seaweedfs_storage_class: "{{ storage_class }}"
seaweedfs_volume_size: "128Gi"
seaweedfs_cpu_requests: "500m"
seaweedfs_memory_requests: "1Gi"
seaweedfs_cpu_limits: "2"
seaweedfs_memory_limits: "4Gi"
# The name of the S3 identity that owns s3_access_key/s3_secret_key
seaweedfs_s3_identity: "thorium"
# `weed mini` serves S3 on port 8333
seaweedfs_s3_endpoint: "http://seaweedfs.{{ seaweedfs_namespace }}.svc.cluster.local:8333"
# Buckets created in-cluster with `weed shell`; Thorium's own buckets are created by the Thorium operator
seaweedfs_buckets:
  - "{{ quickwit_bucket }}"
