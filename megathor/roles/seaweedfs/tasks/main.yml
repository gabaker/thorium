---

- name: Create SeaweedFS namespace
  kubernetes.core.k8s:
    name: "{{ seaweedfs_namespace }}"
    state: present
    kind: Namespace

- name: Create SeaweedFS S3 config, statefulset, service, and network policy
  kubernetes.core.k8s:
    namespace: "{{ seaweedfs_namespace }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'deployment.yaml.j2') }}"
    wait: true
    wait_timeout: "{{ service_wait_timeout }}"
  # the rendered secret contains the S3 keys
  no_log: true

# Jobs are immutable so any previous bucket job is removed before a new one is created
- name: Remove previous SeaweedFS bucket creation job
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    name: create-s3-buckets
    namespace: "{{ seaweedfs_namespace }}"
    state: absent
    delete_options:
      propagationPolicy: Background
    wait: true

- name: Create S3 buckets with weed shell
  kubernetes.core.k8s:
    namespace: "{{ seaweedfs_namespace }}"
    state: present
    definition: "{{ lookup('template', 'bucket-job.yaml.j2') }}"

# Polls instead of waiting on the Complete condition so a Job that exhausts its
# retries fails the run right away (with its logs) rather than at the timeout
- name: Wait for the SeaweedFS bucket creation job to finish
  ansible.builtin.shell: |
    for attempt in $(seq 1 {{ (service_wait_timeout | int / 5) | int }}); do
      succeeded=$(kubectl get job create-s3-buckets -n {{ seaweedfs_namespace }} -o jsonpath='{.status.succeeded}')
      if [ "${succeeded:-0}" -ge 1 ]; then
        exit 0
      fi
      failed=$(kubectl get job create-s3-buckets -n {{ seaweedfs_namespace }} -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')
      if [ "$failed" = "True" ]; then
        echo "The SeaweedFS bucket creation job failed:" >&2
        kubectl logs -n {{ seaweedfs_namespace }} job/create-s3-buckets --tail=50 >&2
        exit 1
      fi
      sleep 5
    done
    echo "Timed out waiting for the SeaweedFS bucket creation job:" >&2
    kubectl logs -n {{ seaweedfs_namespace }} job/create-s3-buckets --tail=50 >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
