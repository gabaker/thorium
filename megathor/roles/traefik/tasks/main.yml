---

- name: Create traefik namespace
  kubernetes.core.k8s:
    name: "{{ traefik_namespace }}"
    state: present
    kind: Namespace

- name: Add helm traefik repo
  kubernetes.core.helm_repository:
    name: "traefik"
    repo_url: "https://helm.traefik.io/traefik" 
  when: not (offline | bool)

- name: Deploy helm chart with values (online)
  kubernetes.core.helm:
    name: "traefik" 
    chart_ref: "traefik/traefik"
    release_namespace: "{{ traefik_namespace }}"
    chart_version: "{{ traefik_helm_chart_version }}"
    values: "{{ lookup('template', 'traefik.yaml.j2') | from_yaml }}"
    wait: "{{ traefik_wait | bool }}"
  when: not (offline | bool)

- name: Deploy helm chart with values (offline only)
  kubernetes.core.helm:
    name: "traefik" 
    chart_ref: "{{ playbook_dir }}/files/traefik-{{ traefik_helm_chart_version }}.tgz"
    release_namespace: "{{ traefik_namespace }}"
    values: "{{ lookup('template', 'traefik.yaml.j2') | from_yaml }}"
    wait: "{{ traefik_wait | bool }}"
  when: offline | bool

# without Helm's wait (see traefik_wait) still make sure Traefik itself came up
- name: Wait for the Traefik Deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "traefik"
    namespace: "{{ traefik_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ service_wait_timeout | default(300) }}"
  when: not (traefik_wait | bool)
