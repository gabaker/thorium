elastic_enabled: true
# Deploy the cluster-wide ECK operator and CRDs; disable when another Thorium
# deployment in this cluster already provides them
elastic_operator_enabled: true
# The ECK operator manifest always installs into elastic-system
elastic_operator_namespace: "elastic-system"
elastic_search_node_count: 1
# A named instance keeps Elasticsearch/Kibana in its own namespace; the default
# deployment keeps them alongside the operator
elastic_namespace: "{{ namespace_prefix ~ 'elastic' if thorium_instance else 'elastic-system' }}"
elastic_container_registry: "docker.elastic.co"
elastic_url: "https://elastic-es-http.{{ elastic_namespace }}.svc.cluster.local:9200"
elastic_username: "thorium"
elastic_operator_version: "2.16.0"
elastic_search_version: "8.19.2"
elastic_search_volume_size: "32Gi"
elastic_search_cpu_requests: "1"
elastic_search_cpu_limits: "2"
elastic_search_memory_requests: "4G"
elastic_search_memory_limits: "4G"
kibana_cpu_requests: "1"
kibana_cpu_limits: "1"
kibana_memory_requests: "1G"
kibana_memory_limits: "1G"
