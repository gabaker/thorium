---

- name: Deploy the ECK operator
  when: elastic_operator_enabled | bool
  block:
    - name: Create Custom Resource Definitions (CRDs)
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: "{{ lookup('template', 'operator/' + elastic_operator_version + '/crds.yaml.j2') }}"

    - name: Create Elastic Operator
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: "{{ lookup('template', 'operator/' + elastic_operator_version + '/operator.yaml.j2') }}"

    - name: Wait for Elastic operator rollout to complete
      shell: /bin/bash -c "kubectl rollout status --watch --timeout=600s statefulset/elastic-operator -n {{ elastic_operator_namespace }}"
      changed_when: false

- name: Create Elastic namespace
  kubernetes.core.k8s:
    name: "{{ elastic_namespace }}"
    state: present
    kind: Namespace

- name: Create Elastic resource from template
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('template', 'search/elastic.yaml.j2') }}"

- name: Create Kibana resource from template
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('template', 'search/kibana.yaml.j2') }}"

# kubectl wait fails immediately while the operator hasn't created the pod yet,
# so retry until the pod exists and reports Ready
- name: Wait for Elastic to be running
  shell: kubectl wait --for='jsonpath={.status.conditions[?(@.type=="Ready")].status}=True' pods/elastic-es-default-{{ item }} -n {{ elastic_namespace }} --timeout=30s
  loop: "{{ range( elastic_search_node_count ) | list }}"
  register: elastic_pod_wait
  until: elastic_pod_wait.rc == 0
  retries: "{{ (service_wait_timeout | int / 30) | int }}"
  delay: 1
  changed_when: false

- name: Get Elastic admin user password from secret
  shell: "kubectl get secret -n {{ elastic_namespace }} elastic-es-elastic-user -o=jsonpath='{.data.elastic}' | base64 --decode"
  register: elastic_admin_pass
  changed_when: false
  no_log: true

# The Elastic API is called from inside the Elasticsearch pod so this works from
# any machine with a kubeconfig (cluster DNS names don't resolve outside the
# cluster). The admin password is the first stdin line and any request body
# follows, so neither appears on a command line.
#
# Only the "thorium" index is created here: the search-streamer creates the
# result/tag indices itself with their mappings, but only when they don't
# already exist, so pre-creating them would leave them without mappings.
- name: Create Thorium index in Elastic
  shell: >-
    kubectl exec -i -n {{ elastic_namespace }} elastic-es-default-0 -c elasticsearch --
    sh -c 'IFS= read -r pw; curl -sk -o /dev/null -w "%{http_code}" -u "elastic:$pw" -X PUT https://localhost:9200/thorium'
  args:
    stdin: "{{ elastic_admin_pass.stdout }}"
  register: create_index_response
  # 400 means the index already exists
  failed_when: create_index_response.stdout not in ["200", "400"]
  changed_when: create_index_response.stdout == "200"
  no_log: true

- name: Create Thorium role in Elastic
  shell: >-
    kubectl exec -i -n {{ elastic_namespace }} elastic-es-default-0 -c elasticsearch --
    sh -c 'IFS= read -r pw; curl -skf -u "elastic:$pw" -X POST -H "Content-Type: application/json" --data-binary @- https://localhost:9200/_security/role/thorium'
  args:
    stdin: |-
      {{ elastic_admin_pass.stdout }}
      {"indices": [{"names": ["thorium*"], "privileges": ["all"]}]}
  no_log: true

# POSTing the user also resets its password, so the saved elastic_password always applies
- name: Create Thorium user in Elastic
  shell: >-
    kubectl exec -i -n {{ elastic_namespace }} elastic-es-default-0 -c elasticsearch --
    sh -c 'IFS= read -r pw; curl -skf -u "elastic:$pw" -X POST -H "Content-Type: application/json" --data-binary @- https://localhost:9200/_security/user/{{ elastic_username }}'
  args:
    stdin: |-
      {{ elastic_admin_pass.stdout }}
      {{ {"password": elastic_password, "roles": ["thorium"], "full_name": "Thorium", "email": "thorium@sandia.gov"} | to_json }}
  no_log: true
