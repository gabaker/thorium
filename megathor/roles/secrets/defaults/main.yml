vault_path: "artifacts/secrets.yml"
# The credentials megathor generates and keeps in its vault: each variable, its key in the thorium
# chart's thorium-credentials secret, and the length of a generated value
megathor_credentials:
  - { name: "thorium_secret", key: "thoriumSecretKey", length: 48 }
  - { name: "redis_password", key: "redisPassword", length: 48 }
  - { name: "scylla_password", key: "scyllaPassword", length: 48 }
  - { name: "elastic_password", key: "elasticPassword", length: 48 }
  - { name: "s3_access_key", key: "s3AccessKey", length: 20 }
  - { name: "s3_secret_key", key: "s3SecretKey", length: 40 }
  - { name: "quickwit_postgres_super_password", key: "postgresPassword", length: 48 }
  - { name: "thorium_admin_password", key: "adminPassword", length: 24 }
# The vault's contents, loaded by the secrets role
megathor_vault: {}
# The credentials with no existing value, which the secrets role generates
megathor_missing_credentials: []
