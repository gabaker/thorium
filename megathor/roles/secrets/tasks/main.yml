---
# Every credential is taken from the first of: the inventory (including --extra-vars), megathor's
# vault, the thorium-credentials secret of the deployed chart, and a newly generated value. The
# vault and the secret both hold the credentials every stateful service was created with, so a
# vault that exists but can't be read stops the run, and nothing is generated over an existing
# deployment: a new thoriumSecretKey locks out every user and new passwords break every backend
# still using the old ones.
- name: Check for an existing secrets vault
  ansible.builtin.stat:
    path: "{{ vault_path }}"
  register: secrets_vault

- name: Ensure the vault password file exists
  ansible.builtin.assert:
    that:
      - vault_password_file is defined
      - vault_password_file is exists
    fail_msg: >-
      The vault password file {{ vault_password_file | default('(vault_password_file is unset)') }}
      does not exist; create it (or pass --extra-vars vault_password_file=<path>) so the
      credentials can be saved to {{ vault_path }}

# loaded under its own name so credentials set in the inventory take precedence over it
- name: Load the vault
  ansible.builtin.include_vars:
    file: "{{ vault_path }}"
    name: megathor_vault
  when: secrets_vault.stat.exists
  no_log: true

# the thorium chart keeps thorium-credentials on uninstall, so it outlives a lost vault
- name: Read the deployed thorium-credentials secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: thorium-credentials
    namespace: "{{ thorium_namespace }}"
  register: thorium_credentials_secret
  no_log: true

- name: Find an existing thorium release
  kubernetes.core.helm_info:
    release_name: thorium
    release_namespace: "{{ thorium_namespace }}"
  register: thorium_existing_release

# the ThoriumCluster CRD only exists once a Thorium operator has run in this cluster, so a failed
# lookup means there is no ThoriumCluster
- name: Find an existing ThoriumCluster
  kubernetes.core.k8s_info:
    api_version: sandia.gov/v1
    kind: ThoriumCluster
    namespace: "{{ thorium_namespace }}"
  register: thorium_existing_clusters
  failed_when: false

# an external Redis or S3 service issued its own credentials (checked by the common role), and
# Rook's S3 keys are read from Ceph on every run, so megathor neither generates nor vaults them
- name: Gather the deployed credentials and the credentials megathor doesn't manage
  ansible.builtin.set_fact:
    megathor_deployed_credentials: "{{ (thorium_credentials_secret.resources | default([]) | first | default({})).data | default({}) }}"
    megathor_existing_deployment: "{{ thorium_existing_release.status is defined or thorium_existing_clusters.resources | default([]) | length > 0 }}"
    megathor_external_credentials: >-
      {{ ([] if redis_enabled | bool else ['redis_password'])
         + ([] if seaweedfs_enabled | bool else ['s3_access_key', 's3_secret_key']) }}
  no_log: true

- name: Reuse each credential from the inventory, the vault, or thorium-credentials
  ansible.builtin.set_fact:
    "{{ item.name }}": >-
      {{ lookup('vars', item.name) if lookup('vars', item.name, default='') | default('', true) | length > 0
         else megathor_vault[item.name] if megathor_vault[item.name] | default('', true) | length > 0
         else megathor_deployed_credentials[item.key] | b64decode }}
  loop: "{{ megathor_credentials }}"
  when:
    - item.name not in megathor_external_credentials
    - >-
      lookup('vars', item.name, default='') | default('', true) | length > 0
      or megathor_vault[item.name] | default('', true) | length > 0
      or megathor_deployed_credentials[item.key] | default('', true) | length > 0
  no_log: true

- name: List the credentials with no existing value
  ansible.builtin.set_fact:
    megathor_missing_credentials: "{{ megathor_missing_credentials + [item.name] }}"
  loop: "{{ megathor_credentials }}"
  when:
    - item.name not in megathor_external_credentials
    - lookup('vars', item.name, default='') | default('', true) | length == 0

- name: Refuse to generate credentials over an existing deployment
  ansible.builtin.assert:
    that:
      - megathor_missing_credentials | length == 0
    fail_msg: >-
      Thorium is already deployed in {{ thorium_namespace }}, but {{ megathor_missing_credentials | join(', ') }}
      {{ 'is' if megathor_missing_credentials | length == 1 else 'are' }} in neither the inventory,
      the vault ({{ vault_path }}), nor the thorium-credentials secret. Generating new values would
      lock out every user and break every backend still using the old ones, so restore the vault
      or the thorium-credentials secret from your backup (or set the values in the inventory) and
      run the playbook again.
  when: megathor_existing_deployment | bool

- name: Generate the credentials a new deployment needs
  ansible.builtin.set_fact:
    "{{ item.name }}": "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=item.length) }}"
  loop: "{{ megathor_credentials | selectattr('name', 'in', megathor_missing_credentials) | list }}"
  no_log: true

# The plaintext copy only exists between these tasks and is removed even if encryption fails.
# Vault entries megathor doesn't manage (such as quickwit_postgres_rep_password, the replication
# password a pre-Helm megathor gave the Postgres it still runs) are carried over unchanged.
- name: Save the credentials to the encrypted vault
  block:
    - name: Write the credentials to a private temporary file
      ansible.builtin.copy:
        dest: ./artifacts/tmp-secrets.yml
        mode: "0600"
        content: |
          {% for item in megathor_credentials if item.name not in megathor_external_credentials %}
          {{ item.name }}: {{ lookup('vars', item.name) | to_json }}
          {% endfor %}
          {% for name, value in megathor_vault.items() if name not in megathor_credentials | map(attribute='name') | list %}
          {{ name }}: {{ value | to_json }}
          {% endfor %}
      no_log: true

    - name: Encrypt the temporary file into the vault
      ansible.builtin.command: "ansible-vault encrypt ./artifacts/tmp-secrets.yml --vault-password-file {{ vault_password_file | quote }} --output {{ vault_path | quote }}"
  always:
    - name: Remove the unencrypted temporary file
      ansible.builtin.file:
        path: ./artifacts/tmp-secrets.yml
        state: absent
