[book]
authors = ["Michael Carson", "Gavin Baker", "Jake Hamzawi"]
language = "en"
src = "src"
title = "Thorium"

[build]
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["assets/asciinema-player.css", "theme/widescreen.css"]
additional-js = ["assets/asciinema-player.min.js", "assets/casts-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = true
