thorium:
  interface: "127.0.0.1"
  port: 38000
  namespace: "testing"
  secret_key: "<SECRET_KEY>"
  tracing:
    local:
      level: "Off"
  files:
    password: "SecretCornIsBest"
    bucket: "<BUCKET>"
  results:
    bucket: "<BUCKET>"
  ephemeral:
    bucket: "<BUCKET>"
  attachments:
    bucket: "<BUCKET>"
  repos:
    bucket: "<BUCKET>"
  # tiny worker reclaim knobs so the reap/backstop integration tests run in
  # seconds; these only matter to tests that call the reap/depths routes
  events:
    heartbeat_secs: 1
    worker_expiry_secs: 3
    in_flight_backstop_secs: 4
    # tiny snapshot windows so the gate and history tests run in seconds, with
    # partitions a few windows wide so ranged reads cross partition boundaries
    stats_snapshot_secs: 2
    stats_partition_size: 10
  yara:
    cache_bucket: "testing-thorium-yara-rulesets"
  s3:
    access_key: "<ACCESS_KEY>"
    secret_token: "<SECRET_TOKEN>"
    endpoint: "<S3_ENDPOINT>"
    region: "<REGION>"
    use_path_style: false
  retention:
    data: 10
    logs: 10
redis:
  host: "<REDIS_IP>"
  port: 6379
scylla:
  nodes:
    - "<IP>"
  replication: 1
elastic:
  node: "<ELASTIC_IP>"
  username: "<ELASTIC_USERNAME>"
  password: "<ELASTIC_PASSWORD>"
  results:
    samples: "<ELASTIC_SAMPLE_RESULTS_INDEX>"
    repos: "<ELASTIC_REPO_RESULTS_INDEX>"
  tags:
    samples: "<ELASTIC_SAMPLE_TAGS_INDEX>"
    repos: "<ELASTIC_REPO_TAGS_INDEX>"
