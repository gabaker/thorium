{{- if .Values.createNamespaces }}
{{- /*
Thorium's namespaces before the namespace prefix is added. The other subcharts and the operator's
namespace blacklist use these names directly, so the list is fixed.
*/}}
{{- $namespaces := list "thorium" "redis" "scylla" "elastic" "seaweedfs" "quickwit" "jaeger" }}
{{- /* whether each optional namespace is used: by its backing service's global.managed toggle, or by Quickwit */}}
{{- $quickwit := include "thorium.quickwit" $ }}
{{- $used := dict
  "redis" (include "thorium.managed" (dict "root" $ "service" "redis"))
  "seaweedfs" (include "thorium.managed" (dict "root" $ "service" "s3"))
  "scylla" (include "thorium.managed" (dict "root" $ "service" "scylla"))
  "elastic" (include "thorium.managed" (dict "root" $ "service" "elastic"))
  "quickwit" $quickwit
  "jaeger" $quickwit
}}
{{- range $namespaces }}
{{- $name := include "thorium.ns" (dict "root" $ "name" .) }}
{{- /* an unused namespace would be empty, so it isn't created */}}
{{- $wanted := or (not (hasKey $used .)) (get $used .) }}
{{- /* the release namespace already exists (created by helm install --create-namespace) */}}
{{- if and $wanted (ne $name $.Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
  annotations:
    # namespaces hold PVCs and data, so never delete them on uninstall
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
{{- end }}
