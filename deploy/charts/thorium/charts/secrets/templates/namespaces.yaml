{{- if .Values.createNamespaces }}
{{- range .Values.namespaces }}
{{- $name := include "thorium.ns" (dict "root" $ "name" .) }}
{{- /* the release namespace already exists (created by helm install --create-namespace) */}}
{{- if ne $name $.Release.Namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
  annotations:
    # namespaces hold PVCs and data, so never delete them on uninstall
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
{{- end }}
