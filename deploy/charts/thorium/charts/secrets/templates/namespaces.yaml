{{- if .Values.createNamespaces }}
{{- /* the namespace each optional backing service lives in, keyed by its global.managed toggle */}}
{{- $services := dict "redis" "redis" "seaweedfs" "s3" "scylla" "scylla" "elastic" "elastic" }}
{{- range .Values.namespaces }}
{{- $name := include "thorium.ns" (dict "root" $ "name" .) }}
{{- /* an unmanaged service's namespace would be empty, so it isn't created */}}
{{- $managed := or (not (hasKey $services .)) (include "thorium.managed" (dict "root" $ "service" (get $services .))) }}
{{- /* the release namespace already exists (created by helm install --create-namespace) */}}
{{- if and $managed (ne $name $.Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
  annotations:
    # namespaces hold PVCs and data, so never delete them on uninstall
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
{{- end }}
