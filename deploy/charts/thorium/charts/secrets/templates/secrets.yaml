{{- /*
Every credential is resolved once here and fanned out to the secret format each consumer
expects. All secrets live in this one template so a freshly generated value is identical
everywhere it is used.
*/ -}}
{{- $thoriumNs := include "thorium.ns" (dict "root" $ "name" "thorium") -}}
{{- $existing := dict -}}
{{- $found := lookup "v1" "Secret" $thoriumNs "thorium-credentials" -}}
{{- if $found }}{{ $existing = $found.data | default dict }}{{ end -}}
{{- $c := .Values.credentials -}}
{{- $creds := dict
  "thoriumSecretKey" (include "secrets.resolve" (dict "explicit" $c.thoriumSecretKey "existing" $existing "key" "thoriumSecretKey" "length" 48))
  "redisPassword" (include "secrets.resolve" (dict "explicit" $c.redisPassword "existing" $existing "key" "redisPassword" "length" 48))
  "scyllaUsername" $c.scyllaUsername
  "scyllaPassword" (include "secrets.resolve" (dict "explicit" $c.scyllaPassword "existing" $existing "key" "scyllaPassword" "length" 48))
  "elasticUsername" $c.elasticUsername
  "elasticPassword" (include "secrets.resolve" (dict "explicit" $c.elasticPassword "existing" $existing "key" "elasticPassword" "length" 48))
  "s3AccessKey" (include "secrets.resolve" (dict "explicit" $c.s3AccessKey "existing" $existing "key" "s3AccessKey" "length" 20))
  "s3SecretKey" (include "secrets.resolve" (dict "explicit" $c.s3SecretKey "existing" $existing "key" "s3SecretKey" "length" 40))
  "postgresPassword" (include "secrets.resolve" (dict "explicit" $c.postgresPassword "existing" $existing "key" "postgresPassword" "length" 48))
  "adminUsername" $c.adminUsername
  "adminPassword" (include "secrets.resolve" (dict "explicit" $c.adminPassword "existing" $existing "key" "adminPassword" "length" 24))
  "registryPassword" (include "secrets.resolve" (dict "explicit" $c.registryPassword "existing" $existing "key" "registryPassword" "length" 24))
-}}
---
# The canonical store every other secret is derived from; read back on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: thorium-credentials
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $creds }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
---
# A partial thorium.yml merged over the ThoriumCluster config by the operator
apiVersion: v1
kind: Secret
metadata:
  name: thorium-config-secrets
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
    thorium.sandia.gov/cluster: {{ .Values.clusterName | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  thorium.yml: |
    thorium:
      secret_key: {{ $creds.thoriumSecretKey | quote }}
      s3:
        access_key: {{ $creds.s3AccessKey | quote }}
        secret_token: {{ $creds.s3SecretKey | quote }}
    redis:
      password: {{ $creds.redisPassword | quote }}
    scylla:
      auth:
        username: {{ $creds.scyllaUsername | quote }}
        password: {{ $creds.scyllaPassword | quote }}
    elastic:
      username: {{ $creds.elasticUsername | quote }}
      password: {{ $creds.elasticPassword | quote }}
---
# The initial Thorium admin user the operator creates
apiVersion: v1
kind: Secret
metadata:
  name: thorium-admin
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ $creds.adminUsername | quote }}
  password: {{ $creds.adminPassword | quote }}
{{- if .Values.consumers.redis }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: {{ include "thorium.ns" (dict "root" $ "name" "redis") }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $creds.redisPassword | quote }}
{{- end }}
{{- if .Values.consumers.seaweedfs }}
---
# SeaweedFS S3 identities, read by `weed mini -s3.config`
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ include "thorium.ns" (dict "root" $ "name" "seaweedfs") }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "thorium",
          "credentials": [
            {"accessKey": {{ $creds.s3AccessKey | quote }}, "secretKey": {{ $creds.s3SecretKey | quote }}}
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
{{- end }}
{{- with .Values.registryAuth.username }}
---
# Basic auth for the infra subchart's registry (point infra.registry.htpasswdSecret at it)
apiVersion: v1
kind: Secret
metadata:
  name: registry-auth
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
type: Opaque
stringData:
  htpasswd: {{ htpasswd . $creds.registryPassword | quote }}
  username: {{ . | quote }}
  password: {{ $creds.registryPassword | quote }}
{{- end }}
{{- if .Values.consumers.quickwit }}
{{- $quickwitNs := include "thorium.ns" (dict "root" $ "name" "quickwit") }}
---
# Kubegres superuser/replication passwords for the Quickwit metastore 
apiVersion: v1
kind: Secret
metadata:
  name: postgres-cluster-auth
  namespace: {{ $quickwitNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  superUserPassword: {{ $creds.postgresPassword | quote }}
  replicationUserPassword: {{ $creds.postgresPassword | quote }}
---
# Environment for Quickwit: its metastore URI, S3 endpoint, and S3 credentials, referenced
# as ${VAR} from the Quickwit node config
apiVersion: v1
kind: Secret
metadata:
  name: quickwit-credentials
  namespace: {{ $quickwitNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  QW_METASTORE_URI: {{ printf "postgres://postgres:%s@postgres.%s.svc.%s:5432/quickwit-metastore" ($creds.postgresPassword | urlquery) $quickwitNs (.Values.global.clusterDomain | default "cluster.local") | quote }}
  QW_S3_ENDPOINT: {{ .Values.quickwitS3Endpoint | default (printf "http://%s:8333" (include "thorium.host" (dict "root" $ "service" "seaweedfs" "ns" "seaweedfs"))) | quote }}
  AWS_ACCESS_KEY_ID: {{ $creds.s3AccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.s3SecretKey | quote }}
{{- end }}
