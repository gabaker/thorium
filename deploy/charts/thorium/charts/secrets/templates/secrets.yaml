{{- /*
Every credential is resolved once here and fanned out to the secret format each consumer
expects. All secrets live in this one template so a freshly generated value is identical
everywhere it is used.
*/ -}}
{{- include "secrets.removedValues" . -}}
{{- $thoriumNs := include "thorium.ns" (dict "root" $ "name" "thorium") -}}
{{- $c := ((.Values.global).credentials) | default dict -}}
{{- $managedRedis := include "thorium.managed" (dict "root" $ "service" "redis") -}}
{{- $managedS3 := include "thorium.managed" (dict "root" $ "service" "s3") -}}
{{- $quickwit := include "thorium.quickwit" . -}}
{{- /* the chart's Postgres only exists for Quickwit's metastore */ -}}
{{- $managedPostgres := and $quickwit (include "thorium.managed" (dict "root" $ "service" "postgres")) -}}
{{- $registryUser := .Values.registryBasicAuth.username -}}
{{- /*
Every generated credential as {name, key, length, external, used}: name is its value under
global.credentials, key the thorium-credentials data key it is stored under (read back on
upgrade, so it never changes), external the global.managed toggle of the service that issues it
when that service is external, and used whether this deployment uses it.
*/ -}}
{{- $specs := list
  (dict "name" "thoriumSecretKey" "key" "thoriumSecretKey" "length" 48 "used" true)
  (dict "name" "redisPassword" "key" "redisPassword" "length" 48 "external" (ternary "" "redis" (not (empty $managedRedis))) "used" true)
  (dict "name" "scyllaPassword" "key" "scyllaPassword" "length" 48 "used" true)
  (dict "name" "elasticPassword" "key" "elasticPassword" "length" 48 "used" true)
  (dict "name" "s3AccessKey" "key" "s3AccessKey" "length" 20 "external" (ternary "" "s3" (not (empty $managedS3))) "used" true)
  (dict "name" "s3SecretToken" "key" "s3SecretKey" "length" 40 "external" (ternary "" "s3" (not (empty $managedS3))) "used" true)
  (dict "name" "adminPassword" "key" "adminPassword" "length" 24 "used" true)
  (dict "name" "postgresPassword" "key" "postgresPassword" "length" 48 "used" (not (empty $managedPostgres)))
  (dict "name" "registryPassword" "key" "registryPassword" "length" 24 "used" (not (empty $registryUser)))
-}}
{{- /*
The credentials a deployment uses, which must all be set explicitly whenever the existing ones
can't be read back from the cluster.
*/ -}}
{{- $unset := list -}}
{{- range $specs }}{{ if and .used (not (index $c .name)) }}{{ $unset = append $unset (printf "global.credentials.%s" .name) }}{{ end }}{{ end -}}
{{- /*
Helm's lookup returns an empty result whenever it isn't talking to a cluster (helm template,
helm lint, client-side --dry-run, Argo CD and Flux rendering). kube-system exists on every
Kubernetes cluster, so an empty lookup of it reliably means lookup is unavailable rather than
that a secret is missing.
*/ -}}
{{- $lookupWorks := not (empty (lookup "v1" "Namespace" "" "kube-system")) -}}
{{- $renderOnly := .Values.renderOnly -}}
{{- if and $renderOnly $lookupWorks -}}
{{- fail "secrets.renderOnly is only for rendering without a cluster (helm template, helm lint) and must not be set for helm install/upgrade, since it would store placeholder credentials" -}}
{{- end -}}
{{- if and (not $lookupWorks) (not $renderOnly) $unset -}}
{{- fail (printf "Helm can't read the existing thorium-credentials secret here (helm template, helm lint, --dry-run without =server, or a GitOps renderer such as Argo CD or Flux), so these credentials would be regenerated: %s. A new thoriumSecretKey locks out every user and new passwords break every backend still using the old ones. Set every one of them explicitly (e.g. from your thorium-credentials backup), or set secrets.renderOnly=true for output that is never applied." (join ", " $unset)) -}}
{{- end -}}
{{- $existing := dict -}}
{{- $found := lookup "v1" "Secret" $thoriumNs "thorium-credentials" -}}
{{- if $found }}{{ $existing = $found.data | default dict }}{{ end -}}
{{- if and $lookupWorks .Release.IsUpgrade (not $found) $unset (not .Values.allowRegenerate) -}}
{{- fail (printf "This upgrade found no thorium-credentials secret in %s, so these credentials would be regenerated: %s. A new thoriumSecretKey locks out every user and new passwords break every backend still using the old ones. Restore thorium-credentials from your backup (or set every credential explicitly) and retry; only set secrets.allowRegenerate=true for a deployment with no data to keep." $thoriumNs (join ", " $unset)) -}}
{{- end -}}
{{- /*
Resolve each credential, keyed by its thorium-credentials data key. A credential the deployment
doesn't use is only kept when it is set or already stored, so renders that can't read the stored
ones (GitOps) don't generate a new random value for it every time.
*/ -}}
{{- $creds := dict "scyllaUsername" ($c.scyllaUsername | default "thorium") "elasticUsername" ($c.elasticUsername | default "thorium") "adminUsername" ($c.adminUsername | default "admin") -}}
{{- range $specs -}}
{{- if or .used (index $c .name) (hasKey $existing .key) -}}
{{- $_ := set $creds .key (include "secrets.resolve" (dict "explicit" (index $c .name) "existing" $existing "name" .name "key" .key "length" .length "placeholder" $renderOnly "external" (.external | default ""))) -}}
{{- end -}}
{{- end -}}
{{- /*
Keep the credentials a service was using before they changed, so the service can be logged in to
with them to apply the new ones: Thorium's previous Scylla role (a superuser the operator logs in
as to change the role) and the previous Postgres password (which the chart's password sync Job
logs in with to run ALTER USER). They are recorded when a render changes the stored value and
carried forward otherwise. While a change hasn't reached the service yet the oldest unapplied
value is kept instead, since that is what the service still has: for Postgres while
thorium-credential-revisions records postgresPending, and for Scylla while
global.manageSecretUpdates.scylla is explicitly false (the secrets subchart can't see the
operator's bootstrap settings, so an unset value counts as on). Two Scylla changes in a row before
the operator reconciles the first still replace it, and need the previous role restored in
thorium-scylla-previous by hand. Renders that can't read thorium-credentials can't know them.
*/ -}}
{{- $storedOf := dict -}}
{{- range $key, $value := $existing }}{{ $_ := set $storedOf $key ($value | b64dec) }}{{ end -}}
{{- $revisionsData := (lookup "v1" "ConfigMap" $thoriumNs "thorium-credential-revisions").data | default dict -}}
{{- $postgresPending := eq (get $revisionsData "postgresPending") "true" -}}
{{- $scyllaSetting := dig "scylla" nil (((.Values.global).manageSecretUpdates) | default dict) -}}
{{- $scyllaOff := and (not (kindIs "invalid" $scyllaSetting)) (not $scyllaSetting) -}}
{{- $scyllaChanged := or (ne (get $storedOf "scyllaUsername") $creds.scyllaUsername) (ne (get $storedOf "scyllaPassword") (get $creds "scyllaPassword")) -}}
{{- $scyllaHasPrevious := and (hasKey $storedOf "scyllaUsernamePrevious") (hasKey $storedOf "scyllaPasswordPrevious") -}}
{{- if and $scyllaOff $scyllaHasPrevious -}}
{{- $_ := set $creds "scyllaUsernamePrevious" (get $storedOf "scyllaUsernamePrevious") -}}
{{- $_ := set $creds "scyllaPasswordPrevious" (get $storedOf "scyllaPasswordPrevious") -}}
{{- else if and (hasKey $storedOf "scyllaUsername") (hasKey $storedOf "scyllaPassword") $scyllaChanged -}}
{{- $_ := set $creds "scyllaUsernamePrevious" (get $storedOf "scyllaUsername") -}}
{{- $_ := set $creds "scyllaPasswordPrevious" (get $storedOf "scyllaPassword") -}}
{{- else if $scyllaHasPrevious -}}
{{- $_ := set $creds "scyllaUsernamePrevious" (get $storedOf "scyllaUsernamePrevious") -}}
{{- $_ := set $creds "scyllaPasswordPrevious" (get $storedOf "scyllaPasswordPrevious") -}}
{{- end -}}
{{- if and $postgresPending (hasKey $storedOf "postgresPasswordPrevious") -}}
{{- $_ := set $creds "postgresPasswordPrevious" (get $storedOf "postgresPasswordPrevious") -}}
{{- else if and (hasKey $storedOf "postgresPassword") (hasKey $creds "postgresPassword") (ne (get $storedOf "postgresPassword") (get $creds "postgresPassword")) -}}
{{- $_ := set $creds "postgresPasswordPrevious" (get $storedOf "postgresPassword") -}}
{{- else if hasKey $storedOf "postgresPasswordPrevious" -}}
{{- $_ := set $creds "postgresPasswordPrevious" (get $storedOf "postgresPasswordPrevious") -}}
{{- end -}}
---
# The canonical store every other secret is derived from; read back on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: thorium-credentials
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $creds }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
---
# A partial thorium.yml merged over the ThoriumCluster config by the operator
apiVersion: v1
kind: Secret
metadata:
  name: thorium-config-secrets
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  thorium.yml: |
    thorium:
      secret_key: {{ $creds.thoriumSecretKey | quote }}
      s3:
        access_key: {{ $creds.s3AccessKey | quote }}
        secret_token: {{ $creds.s3SecretKey | quote }}
    redis:
      password: {{ $creds.redisPassword | quote }}
    scylla:
      auth:
        username: {{ $creds.scyllaUsername | quote }}
        password: {{ $creds.scyllaPassword | quote }}
    elastic:
      username: {{ $creds.elasticUsername | quote }}
      password: {{ $creds.elasticPassword | quote }}
---
# The initial Thorium admin user the operator creates
apiVersion: v1
kind: Secret
metadata:
  name: thorium-admin
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ $creds.adminUsername | quote }}
  password: {{ $creds.adminPassword | quote }}
---
# The Helm release revision each group of credentials last changed at, which the
# thorium.sandia.gov/credentials-revision annotations carry forward while it is unchanged (see
# thorium.credentialRevisions)
apiVersion: v1
kind: ConfigMap
metadata:
  name: thorium-credential-revisions
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  # kept with thorium-credentials so a reinstall over them still knows which changes are pending
  annotations:
    helm.sh/resource-policy: keep
data:
  {{- include "thorium.credentialRevisions" $ | nindent 2 }}
---
# The Scylla role Thorium used before its credentials last changed, which the operator logs in as
# to set the new ones (operator.cluster.bootstrap.scylla.adminSecret defaults to it while
# global.manageSecretUpdates.scylla is on). Until they first change it holds the default
# cassandra superuser that a fresh Scylla starts with
apiVersion: v1
kind: Secret
metadata:
  name: thorium-scylla-previous
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ get $creds "scyllaUsernamePrevious" | default "cassandra" | quote }}
  password: {{ get $creds "scyllaPasswordPrevious" | default "cassandra" | quote }}
{{- if include "thorium.managed" (dict "root" $ "service" "elastic") }}
{{- $elasticNs := include "thorium.ns" (dict "root" $ "name" "elastic") }}
{{- $role := include "thorium.elasticRole" . }}
{{- $indices := list "thorium*" }}
{{- range $name := values (include "thorium.elasticIndices" . | fromYaml) | sortAlpha }}
{{- if not (hasPrefix "thorium" $name) }}{{ $indices = append $indices $name }}{{ end }}
{{- end }}
---
# Thorium's Elastic user, added to ECK's file realm (spec.auth.fileRealm on the Elasticsearch)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thorium.elasticUserSecret" . }}
  namespace: {{ $elasticNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ $creds.elasticUsername | quote }}
  password: {{ $creds.elasticPassword | quote }}
  roles: {{ $role | quote }}
---
# The Elastic role granting Thorium every thorium* index and any configured index outside that
# pattern (spec.auth.roles on the Elasticsearch)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thorium.elasticRolesSecret" . }}
  namespace: {{ $elasticNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  roles.yml: |
    {{ $role }}:
      indices:
        - names: {{ $indices | uniq | toJson }}
          privileges: ["all"]
{{- end }}
{{- if $managedRedis }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: {{ include "thorium.ns" (dict "root" $ "name" "redis") }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $creds.redisPassword | quote }}
  # included by the infra subchart's redis.conf, so the password never appears in Redis's
  # command line; a quoted Redis config string, with backslashes and quotes escaped
  auth.conf: {{ printf "requirepass \"%s\"\n" ($creds.redisPassword | replace "\\" "\\\\" | replace "\"" "\\\"") | quote }}
{{- end }}
{{- if $managedS3 }}
---
# SeaweedFS S3 identities, read by `weed mini -s3.config`
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ include "thorium.ns" (dict "root" $ "name" "seaweedfs") }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "thorium",
          "credentials": [
            {"accessKey": {{ $creds.s3AccessKey | toJson }}, "secretKey": {{ $creds.s3SecretKey | toJson }}}
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
{{- end }}
{{- with $registryUser }}
{{- /*
htpasswd hashes with bcrypt and a random salt, so a precomputed registryBasicAuth.htpasswd is used
verbatim, and otherwise the existing entry is reused while the username and password it was made
from are unchanged; without either every upgrade would rewrite the secret. renderOnly output is
never applied, so it gets a fixed placeholder that keeps repeated renders identical.
*/}}
{{- $htpasswd := $.Values.registryBasicAuth.htpasswd | default "" }}
{{- if not $htpasswd }}
{{- with (lookup "v1" "Secret" $thoriumNs "registry-auth").data }}
{{- if and (eq (index . "username" | default "" | b64dec) $registryUser) (eq (index . "password" | default "" | b64dec) $creds.registryPassword) }}
{{- $htpasswd = index . "htpasswd" | default "" | b64dec }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (not $htpasswd) $renderOnly }}
{{- $htpasswd = printf "%s:render-only" $registryUser }}
{{- end }}
---
# Basic auth for the infra subchart's registry (point infra.registry.htpasswdSecret at it)
apiVersion: v1
kind: Secret
metadata:
  name: registry-auth
  namespace: {{ $thoriumNs }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  htpasswd: {{ $htpasswd | default (htpasswd $registryUser $creds.registryPassword) | quote }}
  username: {{ $registryUser | quote }}
  password: {{ $creds.registryPassword | quote }}
{{- end }}
{{- if $quickwit }}
{{- $quickwitNs := include "thorium.ns" (dict "root" $ "name" "quickwit") }}
{{- $quickwitValues := ((.Values.global).quickwit) | default dict }}
{{- if $managedPostgres }}
---
# Kubegres superuser/replication passwords for the Quickwit metastore
apiVersion: v1
kind: Secret
metadata:
  name: postgres-cluster-auth
  namespace: {{ $quickwitNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  superUserPassword: {{ $creds.postgresPassword | quote }}
  replicationUserPassword: {{ $creds.postgresPassword | quote }}
  # the password Postgres had before postgresPassword last changed, which the password sync Job
  # logs in with when the current one is rejected
  previousSuperUserPassword: {{ get $creds "postgresPasswordPrevious" | default $creds.postgresPassword | quote }}
{{- end }}
{{- $metastoreUri := $quickwitValues.metastoreUri }}
{{- if and (not $metastoreUri) $managedPostgres }}
{{- /* urlquery percent-encodes every reserved character but writes spaces as "+", which URI
userinfo reads literally, so they are rewritten to %20 (a literal "+" is already %2B) */ -}}
{{- $metastoreUri = printf "postgres://postgres:%s@%s:5432/quickwit-metastore" ($creds.postgresPassword | urlquery | replace "+" "%20") (include "thorium.host" (dict "root" $ "service" "postgres" "ns" "quickwit")) }}
{{- end }}
{{- $quickwitS3 := $quickwitValues.s3Endpoint }}
{{- if and (not $quickwitS3) $managedS3 }}
{{- $quickwitS3 = printf "http://%s:8333" (include "thorium.host" (dict "root" $ "service" "seaweedfs" "ns" "seaweedfs")) }}
{{- end }}
---
# Environment for Quickwit: its metastore URI (the chart's Postgres unless
# global.quickwit.metastoreUri is set), S3 endpoint (the chart's SeaweedFS unless
# global.quickwit.s3Endpoint is set), and S3 credentials,
# referenced as ${VAR} from the Quickwit node config. The umbrella chart requires the external
# values whenever Quickwit is enabled without the matching managed service.
apiVersion: v1
kind: Secret
metadata:
  name: quickwit-credentials
  namespace: {{ $quickwitNs }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  QW_METASTORE_URI: {{ $metastoreUri | quote }}
  QW_S3_ENDPOINT: {{ $quickwitS3 | quote }}
  AWS_ACCESS_KEY_ID: {{ $creds.s3AccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.s3SecretKey | quote }}
{{- end }}
