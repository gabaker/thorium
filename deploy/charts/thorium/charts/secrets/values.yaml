# Create the deployment's namespaces; they are kept when this chart is uninstalled
createNamespaces: true
# The namespaces used by the instance, before the instance's prefix is added
namespaces:
  - thorium
  - redis
  - scylla
  - elastic
  - seaweedfs
  - quickwit
  - jaeger
# The name of the ThoriumCluster these credentials belong to; labels the config secret so
# the operator reconciles when it changes
clusterName: thorium
# Credentials for Thorium and its backends. Any value left empty is generated on first
# install and preserved on every upgrade (read back from the thorium-credentials secret).
credentials:
  thoriumSecretKey: ""
  redisPassword: ""
  scyllaUsername: thorium
  scyllaPassword: ""
  elasticUsername: thorium
  elasticPassword: ""
  s3AccessKey: ""
  s3SecretKey: ""
  postgresPassword: ""
  adminUsername: admin
  adminPassword: ""
  # password for the optional registry's basic auth (used when registryAuth.username is set)
  registryPassword: ""
# Which backend-specific secrets to render; disable any backend you do not deploy
consumers:
  redis: true
  seaweedfs: true
  quickwit: true
# Basic auth for the infra subchart's registry: set a username to render the registry-auth
# secret (htpasswd built from credentials.registryPassword) and set
# infra.registry.htpasswdSecret: registry-auth
registryAuth:
  username: ""
# The S3 endpoint Quickwit stores traces in; empty uses the infra subchart's SeaweedFS
quickwitS3Endpoint: ""
