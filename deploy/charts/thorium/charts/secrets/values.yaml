# Create the deployment's namespaces; they are kept when this chart is uninstalled. The redis,
# seaweedfs, scylla, and elastic namespaces are skipped when global.managed turns off the service
# that lives in them (redis, s3, scylla, elastic)
createNamespaces: true
# Thorium's namespaces, before the namespace prefix is added
namespaces:
  - thorium
  - redis
  - scylla
  - elastic
  - seaweedfs
  - quickwit
  - jaeger
# Credentials for Thorium and its backends. Any value left empty is generated on first
# install and preserved on every upgrade (read back from the thorium-credentials secret with
# Helm lookup). An external Redis or S3 store (global.managed.redis/s3 false) can't be given a
# generated credential, so set redisPassword or s3AccessKey/s3SecretKey to the ones it issued.
# When lookup can't reach the cluster (helm template, --dry-run, Argo CD/Flux rendering) every
# credential must be set here (or renderOnly set), since generating new ones would lock out every
# user and break every backend.
credentials:
  thoriumSecretKey: ""
  redisPassword: ""
  scyllaUsername: thorium
  scyllaPassword: ""
  elasticUsername: thorium
  elasticPassword: ""
  s3AccessKey: ""
  s3SecretKey: ""
  postgresPassword: ""
  adminUsername: admin
  adminPassword: ""
  # password for the optional registry's basic auth (used when registryAuth.username is set)
  registryPassword: ""
# Render with placeholder credentials when Helm can't read thorium-credentials from the cluster
# (helm template, helm lint, image listing). Only for output that is never applied: it fails
# when lookup works, so it can't affect a real helm install/upgrade
renderOnly: false
# Generate new credentials on an upgrade that finds no thorium-credentials secret. Only for a
# deployment with no data to keep; otherwise restore thorium-credentials from your backup
allowRegenerate: false
# Basic auth for the infra subchart's registry: set a username to render the registry-auth
# secret (htpasswd built from credentials.registryPassword) and set
# infra.registry.htpasswdSecret: registry-auth
registryAuth:
  username: ""
# The S3 endpoint Quickwit stores traces in; empty uses the chart's SeaweedFS. Required with
# Quickwit when global.managed.s3 is false (create the quickwit bucket in that store yourself)
quickwitS3Endpoint: ""
# The Quickwit metastore URI for an external Postgres (e.g.
# postgres://user:password@host:5432/quickwit-metastore); empty uses the chart's Postgres.
# Required with Quickwit when global.managed.postgres is false (create the database yourself)
quickwitMetastoreUri: ""
