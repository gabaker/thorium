# Create the deployment's namespaces (with the namespace prefix): thorium, redis, scylla,
# elastic, seaweedfs, quickwit, and jaeger. They are kept when this chart is uninstalled. The
# redis, seaweedfs, scylla, and elastic namespaces are skipped when global.managed turns off the
# service that lives in them (redis, s3, scylla, elastic), and quickwit and jaeger without
# global.quickwit.enabled. The release namespace is never created here (use helm install
# --create-namespace). With false, create every namespace the deployment uses yourself before
# installing, since the chart still renders secrets and services into them
createNamespaces: true
# Credentials for Thorium and its backends. Any value left empty is generated on first
# install and preserved on every upgrade (read back from the thorium-credentials secret with
# Helm lookup). An external Redis or S3 store (global.managed.redis/s3 false) can't be given a
# generated credential, so set redisPassword or s3AccessKey/s3SecretToken to the ones it issued.
# When lookup can't reach the cluster (helm template, --dry-run, Argo CD/Flux rendering) every
# credential the deployment uses must be set here (or renderOnly set), since generating new ones
# would lock out every user and break every backend; a credential the deployment doesn't use
# (postgresPassword without the chart's Postgres, registryPassword without registry basic auth)
# is only stored once it is set or used. A value set here always wins over the stored one, so
# setting one rotates it (never rotate thoriumSecretKey). Keys other than the ones below are
# rejected, so a misspelled credential fails the render instead of being generated
credentials:
  # the config's thorium.secret_key, which peppers every password hash; never change it on an
  # existing deployment
  thoriumSecretKey: ""
  # the config's redis.password; required when global.managed.redis is false
  redisPassword: ""
  # the config's scylla.auth: the role Thorium logs in as. The operator creates it when it
  # bootstraps Scylla (operator.cluster.bootstrap.scylla); otherwise it must already exist
  scyllaUsername: thorium
  scyllaPassword: ""
  # the config's elastic.username/password. The chart's Elasticsearch gets this user from ECK's
  # file realm; an external one needs it created by the site or by
  # operator.cluster.bootstrap.elastic
  elasticUsername: thorium
  elasticPassword: ""
  # the config's thorium.s3.access_key/secret_token, also used by Quickwit; required when
  # global.managed.s3 is false. thorium-credentials stores the secret token under its
  # s3SecretKey key, but the value here is always s3SecretToken (the schema rejects a
  # credentials.s3SecretKey value as an unknown key)
  s3AccessKey: ""
  s3SecretToken: ""
  # the superuser (and replication) password of the chart's Quickwit metastore Postgres; unused
  # unless global.managed.postgres and global.quickwit.enabled are both true
  postgresPassword: ""
  # the initial Thorium admin user, rendered into the thorium-admin secret
  adminUsername: admin
  adminPassword: ""
  # password for the optional registry's basic auth (used when registryBasicAuth.username is set)
  registryPassword: ""
# Render with placeholder credentials when Helm can't read thorium-credentials from the cluster
# (helm template, helm lint, image listing). Only for output that is never applied: it fails
# when lookup works, so it can't affect a real helm install/upgrade
renderOnly: false
# Generate new credentials on an upgrade that finds no thorium-credentials secret. Only for a
# deployment with no data to keep; otherwise restore thorium-credentials from your backup
allowRegenerate: false
# Basic auth for the infra subchart's registry (infra.registry). This is unrelated to
# operator.cluster.registryAuth, which holds credentials for pulling tool images
registryBasicAuth:
  # set a username to render the registry-auth secret (htpasswd built from
  # credentials.registryPassword), then set infra.registry.htpasswdSecret: registry-auth. The
  # htpasswd entry is reused while the username and password stay the same, except when Helm
  # can't read the existing secret (helm template, GitOps renderers), which re-hashes it with a
  # new salt on every render; set htpasswd below to keep such renders stable
  username: ""
  # a precomputed htpasswd line for username and credentials.registryPassword (for example from
  # `htpasswd -nbB <username> <password>`), stored in registry-auth verbatim instead of a hash
  # the chart generates. It must match both values, which registry-auth also holds
  htpasswd: ""
