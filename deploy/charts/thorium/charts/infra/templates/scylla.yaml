{{- if include "infra.managed" (dict "root" $ "service" "scylla") }}
{{- $ns := include "thorium.ns" (dict "root" $ "name" "scylla") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scylla-config
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
data:
  scylla.yaml: |
    {{- .Values.scylla.config | trim | nindent 4 }}
    developer_mode: {{ .Values.scylla.developerMode }}
---
# The Scylla operator generates and owns the manager agent's auth token Secret
# (<cluster>-auth-token, here scylla-auth-token). No custom agent config Secret
# (scyllaAgentConfig) is set, since the operator waits for a named one to exist before it
# manages that token
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: scylla
  namespace: {{ $ns }}
  labels:
    controller-tools.k8s.io: "1.0"
    {{- include "infra.labels" . | nindent 4 }}
spec:
  repository: {{ include "thorium.image" (dict "root" $ "image" .Values.scylla.repository) | quote }}
  agentRepository: {{ include "thorium.image" (dict "root" $ "image" .Values.scylla.agentRepository) | quote }}
  version: {{ .Values.scylla.version | quote }}
  agentVersion: {{ .Values.scylla.agentVersion | quote }}
  developerMode: {{ .Values.scylla.developerMode }}
  datacenter:
    name: {{ .Values.scylla.datacenter | quote }}
    racks:
      - name: {{ .Values.scylla.rack | quote }}
        scyllaConfig: scylla-config
        members: {{ .Values.scylla.members }}
        storage:
          capacity: {{ .Values.scylla.storage }}
          {{- if .Values.storageClass }}
          storageClassName: {{ .Values.storageClass | quote }}
          {{- end }}
        resources:
          {{- toYaml .Values.scylla.resources | nindent 10 }}
        {{- if .Values.scylla.coredumps.enabled }}
        volumes:
          - name: coredumpfs
            hostPath:
              path: {{ .Values.scylla.coredumps.path | quote }}
        volumeMounts:
          - mountPath: /tmp/coredumps
            name: coredumpfs
        {{- end }}
{{- end }}
