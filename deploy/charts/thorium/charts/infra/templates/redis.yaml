{{- if include "infra.managed" (dict "root" $ "service" "redis") }}
{{- $ns := include "thorium.ns" (dict "root" $ "name" "redis") }}
{{- $conf := include "infra.redisConf" . }}
---
# redis.conf without the password, which it includes from the redis-auth secret
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-conf
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
data:
  redis.conf: |
    {{- $conf | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-persistent-storage-claim
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- include "infra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    app: redis
    {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        # Redis only reads redis.conf at startup, so the pod rolls when it changes
        checksum/config: {{ $conf | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "thorium.image" (dict "root" $ "image" .Values.redis.image) }}
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/var/lib/redis/redis.conf"]
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: redis-data
            - mountPath: /var/lib/redis/
              name: redis-conf
            - mountPath: /etc/redis/auth
              name: redis-auth
              readOnly: true
      volumes:
        - name: redis-conf
          configMap:
            name: redis-conf
        # only auth.conf (requirepass), readable by the pod's group
        - name: redis-auth
          secret:
            secretName: redis-auth
            defaultMode: 0440
            items:
              - key: auth.conf
                path: auth.conf
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-persistent-storage-claim
{{- end }}
