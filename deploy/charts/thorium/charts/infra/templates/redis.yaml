{{- if include "infra.managed" (dict "root" $ "service" "redis") }}
{{- $ns := include "thorium.ns" (dict "root" $ "name" "redis") }}
{{- $conf := include "infra.redisConf" . }}
{{- $start := .Files.Get "files/redis-start.sh" }}
---
# the Redis conf without the password, which it includes from the redis-auth secret, and the start
# script that switches an existing RDB-only data volume to AOF before Redis runs with appendonly yes.
# The conf's key is redis-aof.conf, not the redis.conf of charts that ran Redis with appendonly no
# and no start script: a pod of such a chart that restarts against this ConfigMap (an upgrade that
# applied the ConfigMap but not the StatefulSet) finds no conf and fails to start, rather than
# starting with appendonly yes and no start script, which would start empty and lose the data
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-conf
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
data:
  redis-aof.conf: |
    {{- $conf | nindent 4 }}
  redis-start.sh: |
    {{- $start | trimSuffix "\n" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-persistent-storage-claim
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- include "infra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    app: redis
    {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        # Redis only reads its conf (and runs redis-start.sh) at startup, so the pod rolls when
        # either changes
        checksum/config: {{ print $conf $start | sha256sum }}
        # and when redisPassword changes (global.manageSecretUpdates.redis), so it reads the new
        # auth.conf (see thorium.credentialRevisions)
        thorium.sandia.gov/credentials-revision: {{ (include "thorium.credentialRevisions" $ | fromYaml).redis | quote }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "thorium.image" (dict "root" $ "image" .Values.redis.image) }}
          imagePullPolicy: IfNotPresent
          # execs redis-server with redis-aof.conf, first switching an RDB-only volume to AOF (the
          # ConfigMap's files aren't executable, so sh runs it)
          command: ["sh", "/var/lib/redis/redis-start.sh", "/var/lib/redis/redis-aof.conf"]
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: redis-data
            - mountPath: /var/lib/redis/
              name: redis-conf
            - mountPath: /etc/redis/auth
              name: redis-auth
              readOnly: true
      volumes:
        - name: redis-conf
          configMap:
            name: redis-conf
        # only auth.conf (requirepass), readable by the pod's group
        - name: redis-auth
          secret:
            secretName: redis-auth
            defaultMode: 0440
            items:
              - key: auth.conf
                path: auth.conf
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-persistent-storage-claim
{{- end }}
