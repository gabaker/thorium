                          password_key:
                            description: The key in the Secret containing the password
                            type: string
                          username:
                            description: A literal username to use
                            nullable: true
                            type: string
                          username_key:
                            description: The key in the Secret containing the username (takes precedence over `username`)
                            nullable: true
                            type: string
                        required:
                        - name
                        - password_key
                        type: object
                    required:
                    - secret
                    type: object
                  elastic:
                    description: Create Thorium's Elastic role and user (only for an externally managed Elasticsearch)
                    nullable: true
                    properties:
                      admin_secret:
                        description: The Elastic superuser credentials to create the role and user with
                        properties:
                          name:
                            description: The name of the Secret containing the credentials
                            type: string
                          password_key:
