                        description: The settings for the search-streamer
                        properties:
                          init:
                            default:
                              chunks_per_worker: 10000
                            description: The settings for the search-streamer init phase
                            properties:
                              chunks_per_worker:
                                default: 10000
                                description: |-
                                  The number of chunks per worker to split the Scylla into when
                                  running the init phase

                                  In general, the more data is in Scylla, the greater the number of chunks
                                  it should be split up into. Having more chunks means if the search-streamer
                                  is interrupted while initiating indexes, it can resume the process at a more
                                  specific point and repeat less work; however for very small databases,
                                  having too many chunks will lead to many very sparse or empty chunks and
                                  impact performance.
                                format: uint
                                minimum: 1.0
                                type: integer
                            type: object
                          max_document_size:
                            default: 100.0 MiB
                            description: |-
                              The maximum size an individual document/value can be for indexing
                              in the search store; accepts M, MB, MiB, or equivalents for KB and GB

                              In Elastic, this is equivalent to `http.max_content_len`
                              (see <https://www.elastic.co/docs/reference/elasticsearch/configuration-reference/networking-settings>).
                            example: 100 MiB
                            type: string
                          max_request_size:
                            default: 100.0 MiB
                            description: |-
                              The maximum size a single create request to the search store;
                              accepts M, MB, MiB, or equivalents for KB and GB
                            example: 100 MiB
                            type: string
                          workers:
                            default: 5
                            description: |-
                              The number of workers each streamer in the search-streamer has

                              The more workers, the more data can potentially be held in memory
                              and sent to Elasticsearch at once. Decrease the number of workers
                              if the search-streamer runs out of memory or Elasticsearch complains.
                            format: uint
                            minimum: 1.0
                            type: integer
