{{- if .Values.uninstallHook.enabled }}
{{- $ns := include "thorium.namespace" . }}
{{- $name := .Values.cluster.name }}
{{- /*
On `helm uninstall`, delete the ThoriumCluster before Helm removes the operator so the operator
runs its finalizer: it removes node labels and provision pods and the resources it created, then
releases the ThoriumCluster. The hook's account can only get and delete this one ThoriumCluster.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thorium-uninstall
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{- with include "operator.imagePullSecrets" . }}
imagePullSecrets:
  {{- . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thorium-uninstall
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["sandia.gov"]
    resources: ["thoriumclusters"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thorium-uninstall
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: thorium-uninstall
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: thorium-uninstall
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: thorium-uninstall
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.uninstallHook.timeoutSeconds 30 }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: thorium-uninstall
      automountServiceAccountToken: true
      {{- with include "operator.imagePullSecrets" . }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.uninstallHook.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: delete-thoriumcluster
          image: {{ printf "%s:%s" (include "thorium.image" (dict "root" $ "image" .Values.image.repository)) (include "operator.tag" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.uninstallHook.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.uninstallHook.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # the operator binary deletes the ThoriumCluster with the account's token and waits for
          # it to go, printing the cluster's last status if the operator doesn't finish in time
          command:
            - /app/thorium-operator
            - uninstall
            - --namespace
            - {{ $ns | quote }}
            - --name
            - {{ $name | quote }}
            - --timeout
            - {{ .Values.uninstallHook.timeoutSeconds | quote }}
      {{- /* run where the operator runs, e.g. on nodes reserved for infrastructure */}}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
