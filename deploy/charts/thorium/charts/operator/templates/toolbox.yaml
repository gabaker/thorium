{{- /*
The toolbox ConfigMap's name, which tracks its contents so a new toolbox gets a new ConfigMap.
*/ -}}
{{- define "operator.toolboxConfigMap" -}}
{{- printf "toolbox-%s" (sha256sum .Values.toolbox.json | trunc 10) -}}
{{- end -}}
{{- /*
The toolbox import Job's spec. The Job is named after a hash of this rendered spec: a Job's pod
template is immutable, so any change to it (the toolbox settings, the image, pull settings, the
admin secret, scheduling, ...) must create a new Job rather than patch the existing one.
*/ -}}
{{- define "operator.toolboxJobSpec" -}}
{{- $t := .Values.toolbox }}
{{- $ns := include "thorium.namespace" . }}
{{- $source := ternary "/toolbox/toolbox.json" $t.url (empty $t.url) }}
{{- $admin := .Values.cluster.bootstrap.admin.secret -}}
backoffLimit: {{ $t.backoffLimit }}
template:
  spec:
    restartPolicy: Never
    automountServiceAccountToken: false
    {{- with include "operator.imagePullSecrets" . }}
    imagePullSecrets:
      {{- . | nindent 6 }}
    {{- end }}
    {{- with $t.podSecurityContext }}
    securityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    containers:
      - name: import
        image: {{ printf "%s:%s" (include "thorium.image" (dict "root" $ "image" .Values.image.repository)) (include "operator.tag" .) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with $t.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $t.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: HOME
            value: /tmp
          - name: THORIUM_URL
            value: {{ printf "http://thorium-api.%s.svc.%s" $ns (.Values.global.clusterDomain | default "cluster.local") | quote }}
          - name: TOOLBOX
            value: {{ $source | quote }}
          - name: THORCTL
            value: {{ $t.thorctlPath | quote }}
          - name: THORIUM_USER
            valueFrom:
              secretKeyRef:
                name: {{ required "operator.cluster.bootstrap.admin.secret.name is required for the toolbox import" $admin.name | quote }}
                key: {{ $admin.usernameKey | default "username" | quote }}
          - name: THORIUM_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $admin.name | quote }}
                key: {{ $admin.passwordKey | default "password" | quote }}
        command:
          - /bin/sh
          - -c
          - |
            set -e
            # the Thorium image ships thorctl for linux/x86-64 and linux/arm64 under the API's binary
            # names; operator.toolbox.thorctlPath points at another one
            thorctl="$THORCTL"
            if [ -z "$thorctl" ]; then
              case "$(uname -m)" in
                x86_64) arch=x86-64 ;;
                aarch64|arm64) arch=arm64 ;;
                *) arch="$(uname -m)" ;;
              esac
              thorctl="/app/binaries/linux/$arch/thorctl"
            fi
            if [ ! -x "$thorctl" ]; then
              echo "$thorctl doesn't exist in this image; set operator.toolbox.thorctlPath to its thorctl"
              exit 1
            fi
            # thorctl login only takes a password as an argument, so thorctl's config is written
            # directly with the credentials as YAML single-quoted strings
            yaml_quote() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"; }
            # only this user may read the config, from the moment it is created
            umask 077
            mkdir -p "$HOME/.thorium"
            {
              printf 'keys:\n'
              printf '  api: %s\n' "$(yaml_quote "$THORIUM_URL")"
              printf '  username: %s\n' "$(yaml_quote "$THORIUM_USER")"
              printf '  password: %s\n' "$(yaml_quote "$THORIUM_PASSWORD")"
              printf 'skip_insecure_warning: true\n'
              printf 'skip_update: true\n'
            } > "$HOME/.thorium/config.yml"
            chmod 600 "$HOME/.thorium/config.yml"
            # thorctl's errors can span many lines, so messages show them on one line
            oneline() { printf '%s' "$1" | tr -s ' \n' ' ' | cut -c 1-400; }
            # wait for the API and the admin login together: `thorctl groups get` reads the admin's
            # own user, so it fails until the API is up and the operator has created the admin
            attempt=1
            until out="$("$thorctl" groups get 2>&1)"; do
              if [ "$attempt" -ge 120 ]; then
                echo "Thorium still can't be reached or the admin user $THORIUM_USER still can't log in: $out"
                exit 1
              fi
              echo "Waiting for the Thorium API and the admin user $THORIUM_USER ($attempt/120): $(oneline "$out")"
              attempt=$((attempt + 1))
              sleep 10
            done
            # create the groups and network policies the toolbox references; the API refuses ones
            # that already exist, so a failed create is reported and anything existing is left as is
            create() {
              what="$1"
              shift
              if out="$("$thorctl" "$@" 2>&1)"; then
                echo "$what: created"
              else
                echo "$what: not created, an existing one is left as is ($(oneline "$out"))"
              fi
            }
            {{- range $t.groups }}
            create {{ include "operator.shellQuote" (printf "Group %s" .) }} groups create {{ include "operator.shellQuote" . }}
            {{- end }}
            {{- range $i, $policy := $t.networkPolicies }}
            {{- $groups := required (printf "operator.toolbox.networkPolicies[%d] (%s) needs groups" $i $policy.name) $policy.groups }}
            {{- /* the rules file holds only the directions the policy sets, since a missing one allows all traffic */}}
            printf '%s' {{ include "operator.shellQuote" (pick $policy "ingress" "egress" | toJson) }} > "/tmp/network-policy-{{ $i }}.json"
            create {{ include "operator.shellQuote" (printf "Network policy %s" $policy.name) }} network-policies create --name {{ include "operator.shellQuote" $policy.name }} --groups {{ include "operator.shellQuote" (join "," $groups) }} --rules-file "/tmp/network-policy-{{ $i }}.json" --format json{{ if $policy.forced_policy }} --forced{{ end }}{{ if $policy.default_policy }} --default{{ end }}
            {{- end }}
            # thorctl exits 0 when the import applied or found nothing to change and 1 when it failed (a
            # conflict, a refusal, or a rollback); its report is the Job's log. A failed import can be
            # retried, since a repeat only applies what is still missing
            rc=0
            "$thorctl" toolbox import "$TOOLBOX" --{{ $t.mode }}{{ if $t.createGroups }} --create-groups{{ end }}{{ if $t.strict }} --strict{{ end }}{{ with $t.groupOverride }} --group-override {{ include "operator.shellQuote" . }}{{ end }} || rc=$?
            if [ "$rc" != 0 ]; then
              echo "The toolbox import failed (thorctl exit code $rc); see its report above"
              exit "$rc"
            fi
            echo "The toolbox import finished ({{ $t.mode }})"
        # thorctl writes its config under HOME, so the root filesystem can stay read-only
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          {{- if $t.json }}
          - name: toolbox
            mountPath: /toolbox
            readOnly: true
          {{- end }}
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      {{- if $t.json }}
      - name: toolbox
        configMap:
          name: {{ include "operator.toolboxConfigMap" . }}
      {{- end }}
    {{- /* run where the operator runs, e.g. on nodes reserved for infrastructure */}}
    {{- with .Values.controller.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.controller.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end -}}
{{- $t := .Values.toolbox }}
{{- if and $t.enabled (or $t.url $t.json) }}
{{- $ns := include "thorium.namespace" . }}
{{- $spec := include "operator.toolboxJobSpec" . }}
{{- if $t.json }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operator.toolboxConfigMap" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
data:
  toolbox.json: {{ $t.json | quote }}
{{- end }}
---
# Imports the toolbox once the API is healthy; a changed spec runs a new import (see
# operator.toolboxJobSpec) instead of mutating a finished Job
apiVersion: batch/v1
kind: Job
metadata:
  name: toolbox-import-{{ sha256sum $spec | trunc 10 }}
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  {{- $spec | nindent 2 }}
{{- end }}
