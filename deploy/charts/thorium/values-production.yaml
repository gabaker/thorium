# A starting point for a multi-node production deployment; layer it over the chart defaults and
# adjust sizes, node names, and hosts for your cluster:
#
#   helm upgrade --install thorium <chart> -n thorium --create-namespace \
#     -f values-production.yaml -f site.yaml
#
# Storage sizes and the storage class can't be changed in place for every service after the
# first install (see charts/infra/values.yaml), so size them before installing.

infra:
  # e.g. ceph-block with Rook, or your cluster's replicated storage class
  storageClass: ""
  redis:
    storage: 64Gi
    resources:
      limits: { cpu: "2", memory: 8Gi }
  scylla:
    # production mode enforces the hardware checks (such as XFS-backed storage) that developer
    # mode skips
    developerMode: false
    members: 3
    storage: 500Gi
    resources:
      requests: { cpu: "4", memory: 16Gi }
      limits: { cpu: "4", memory: 16Gi }
  elastic:
    count: 3
    # half of the memory limit, leaving the rest to the filesystem cache
    javaOpts: -Xms8g -Xmx8g
    storage: 500Gi
    resources:
      requests: { cpu: "2", memory: 16Gi }
      limits: { cpu: "4", memory: 16Gi }
  postgres:
    replicas: 3
    storage: 64Gi

# SeaweedFS runs as a single process; use a replicated S3 store (e.g. Rook/Ceph RGW) instead, and
# create the quickwit bucket in it
global:
  managed:
    s3: false
  quickwit:
    # the S3 store Quickwit keeps traces in (your S3 endpoint)
    s3Endpoint: http://rook-ceph-rgw-thorium-s3.rook-ceph.svc.cluster.local

secrets:
  # supply the S3 credentials your store issued (required, since global.managed.s3 is false);
  # the other credentials are generated once if left empty
  credentials:
    s3AccessKey: ""
    s3SecretToken: ""

quickwit:
  metastore:
    replicaCount: 2
  searcher:
    replicaCount: 2

operator:
  backends:
    scylla:
      # the keyspace replication factor; keep it at most infra.scylla.members
      replication: 3
    s3:
      # Thorium's S3 endpoint, normally the same store as global.quickwit.s3Endpoint
      endpoint: http://rook-ceph-rgw-thorium-s3.rook-ceph.svc.cluster.local
  cluster:
    components:
      api:
        replicas: 3
    scaler:
      k8s:
        # the nodes Thorium may run jobs on (an empty list means every node)
        nodes: []
  ingress:
    type: traefik
    host: thorium.example.com
    tls:
      # an existing kubernetes.io/tls secret in the thorium namespace; with the default
      # tls.traefikDefaultStore it also becomes Traefik's cluster-wide default certificate
      secretName: thorium-tls
