# Thorium umbrella chart. Install it into the "thorium" namespace, or into "<prefix>-thorium"
# (e.g. "dev-thorium") to give every Thorium namespace the namespace prefix "<prefix>-" (a
# lowercase DNS label of at most 32 characters). Any other release namespace fails to render.
# The infra-operators chart must already be installed.
#
# Each top-level key below configures one subchart; see charts/<name>/values.yaml for every
# setting. Defaults are sized for a single-node development cluster; see values-production.yaml
# for a multi-node starting point.

# Settings shared by every subchart
global:
  # The cluster DNS domain used to build in-cluster service hostnames (the operator's backend
  # defaults, the Jaeger, Quickwit metastore, and toolbox addresses, and the proxy noProxy list)
  clusterDomain: cluster.local
  # The cluster's service and pod CIDRs (e.g. [10.96.0.0/12, 10.244.0.0/16]), which the chart
  # can't detect. When operator.controller.proxy sets a proxy they are added to its noProxy along
  # with localhost and the cluster domain, so in-cluster traffic addressed by IP (a Service's
  # ClusterIP, a pod IP) bypasses the proxy instead of being sent through it. Unused without a
  # proxy
  clusterCIDRs: []
  # Pull every image from this registry instead of its upstream one (e.g. "10.0.0.1:5000" for an
  # offline mirror). The upstream registry host is dropped and the path kept:
  # docker.io/library/redis:7.4.11 -> <registry>/redis:7.4.11,
  # docker.elastic.co/elasticsearch/elasticsearch:8.19.2 -> <registry>/elasticsearch/elasticsearch:8.19.2
  # This also covers the images the operators start (Elasticsearch, Kibana, Scylla, and the
  # Thorium components), but not the infra-operators chart, which has its own setting
  imageRegistry: ""
  # The backing services this chart deploys and manages. Each toggle is shared by every
  # subchart: infra deploys the service, secrets renders its credentials (and creates its
  # namespace), and the operator picks matching endpoint and bootstrap defaults. Set one to
  # false to point Thorium at an external service instead (see "Configure the Helm Charts", "External
  # services"). Switching a toggle on an existing deployment does not move its data
  managed:
    # deploy ScyllaDB through the Scylla operator; the Thorium operator creates Thorium's
    # Scylla role with the default cassandra superuser (cluster.bootstrap.scylla). When false
    # set operator.backends.scylla.nodes, and either global.credentials.scyllaUsername/
    # scyllaPassword for a role you created or operator.cluster.bootstrap.scylla
    scylla: true
    # deploy Elasticsearch/Kibana through ECK; Thorium's Elastic user and role come from ECK's
    # file realm, so the operator needs no Elastic superuser. When false set
    # operator.backends.elastic.node, and either global.credentials.elasticUsername/
    # elasticPassword for a user you created or operator.cluster.bootstrap.elastic.adminSecret
    elastic: true
    # deploy Redis; when false set operator.backends.redis.host and global.credentials.redisPassword
    redis: true
    # deploy SeaweedFS as the S3 store (and with Quickwit create the quickwit bucket in it); when
    # false set operator.backends.s3.endpoint, global.credentials.s3AccessKey/s3SecretToken, and
    # (with Quickwit) global.quickwit.s3Endpoint. The operator creates Thorium's buckets either way
    s3: true
    # deploy Postgres (Kubegres) for the Quickwit metastore and create its quickwit-metastore
    # database; only deployed with global.quickwit.enabled. When false set
    # global.quickwit.metastoreUri (with Quickwit) to a database the site created
    postgres: true
  # Quickwit, Thorium's trace store. Global so every subchart sees it: the quickwit subchart is
  # installed, the infra subchart deploys the Quickwit metastore Postgres, the quickwit bucket,
  # and Jaeger, the secrets subchart renders Quickwit's credentials, and the operator sends traces
  # to Quickwit, all only while it is enabled
  quickwit:
    # install Quickwit into <prefix>-quickwit (the quickwit section below configures it). With it
    # disabled Thorium sends no external traces unless operator.backends.tracing.grpcEndpoint
    # names another OTLP gRPC collector
    enabled: true
    # the S3 endpoint Quickwit stores traces in; empty uses the chart's SeaweedFS. Required with
    # Quickwit when global.managed.s3 is false (create the quickwit bucket in that store yourself)
    s3Endpoint: ""
    # the metastore URI for an external Postgres (e.g.
    # postgres://user:password@host:5432/quickwit-metastore); empty uses the chart's Postgres and
    # its quickwit-metastore database. Required with Quickwit when global.managed.postgres is
    # false (create the database yourself). It holds a password, so prefer --set or a private
    # values file
    metastoreUri: ""
  # Credentials for Thorium and its backends, global so every subchart can restart what uses a
  # credential when it changes. Any value left empty is generated on first install and preserved
  # on every upgrade (read back from the thorium-credentials secret with Helm lookup). An external
  # Redis or S3 store (global.managed.redis/s3 false) can't be given a generated credential, so
  # set redisPassword or s3AccessKey/s3SecretToken to the ones it issued. When lookup can't reach
  # the cluster (helm template, --dry-run, Argo CD/Flux rendering) every credential the
  # deployment uses must be set here (or secrets.renderOnly set), since generating new ones would
  # lock out every user and break every backend; a credential the deployment doesn't use
  # (postgresPassword without the chart's Postgres, registryPassword without registry basic auth)
  # is only stored once it is set or used. A value set here always wins over the stored one, so
  # setting one changes it; manageSecretUpdates below decides whether the service itself is
  # updated too (never change thoriumSecretKey). Keys other than the ones below are rejected, so
  # a misspelled credential fails the render instead of being generated
  credentials:
    # the config's thorium.secret_key, which peppers every password hash; never change it on an
    # existing deployment
    thoriumSecretKey: ""
    # the config's redis.password; required when global.managed.redis is false
    redisPassword: ""
    # the config's scylla.auth: the role Thorium logs in as. The operator creates it when it
    # bootstraps Scylla (operator.cluster.bootstrap.scylla); otherwise it must already exist
    scyllaUsername: thorium
    scyllaPassword: ""
    # the config's elastic.username/password. The chart's Elasticsearch gets this user from ECK's
    # file realm; an external one needs it created by the site or by
    # operator.cluster.bootstrap.elastic
    elasticUsername: thorium
    elasticPassword: ""
    # the config's thorium.s3.access_key/secret_token, also used by Quickwit; required when
    # global.managed.s3 is false. thorium-credentials stores the secret token under its
    # s3SecretKey key, but the value here is always s3SecretToken (the schema rejects a
    # credentials.s3SecretKey value as an unknown key)
    s3AccessKey: ""
    s3SecretToken: ""
    # the superuser (and replication) password of the chart's Quickwit metastore Postgres; unused
    # unless global.managed.postgres and global.quickwit.enabled are both true
    postgresPassword: ""
    # the initial Thorium admin user the operator creates (operator.cluster.bootstrap.admin),
    # rendered into the thorium-admin secret
    adminUsername: admin
    adminPassword: ""
    # password for the optional registry's basic auth (used when
    # secrets.registryBasicAuth.username is set)
    registryPassword: ""
  # Whether a credential changed under global.credentials is also changed in the service that
  # checks it. Thorium's components and Quickwit always pick up a changed credential; this only
  # decides whether the service is updated to match. null turns it on wherever Thorium can change
  # the password: the services this chart deploys, and an external Scylla the operator bootstraps
  # with a superuser. With it off (or for an external Redis, S3 store, or Postgres, where true
  # fails the render) change the credential in the service first, then set it here. The chart's
  # services still read their rendered Secret when they next start, so off only means nothing
  # restarts or changes them now. Elasticsearch always follows a changed
  # elasticUsername/elasticPassword: the chart's reloads ECK's file realm, and an external one is
  # updated by the operator's Elastic bootstrap (operator.cluster.bootstrap.elastic) or by you
  manageSecretUpdates:
    # restart Redis with a changed redisPassword
    redis: null
    # restart SeaweedFS with a changed s3AccessKey/s3SecretToken
    s3: null
    # set a changed postgresPassword on the chart's Postgres with ALTER USER
    postgres: null
    # let the operator set a changed scyllaUsername/scyllaPassword on Thorium's Scylla role by
    # logging in as the previous role (the thorium-scylla-previous secret) when
    # operator.cluster.bootstrap.scylla.adminSecret doesn't name a superuser; with one, the
    # operator's Scylla bootstrap keeps the role in sync either way. After a changed
    # scyllaUsername the previous role is dropped once the new one logs in as a superuser, unless
    # adminSecret names your own superuser
    scylla: null
  # Thorium's Elastic index names (the config's elastic.results and elastic.tags), used for the
  # ThoriumCluster config and for the chart's Elastic role, which grants Thorium every thorium*
  # index plus any name here outside that pattern. Renaming an index on an existing deployment
  # makes the search streamer create and fill a new one; the old index is left in place
  elasticIndices:
    # sample (file) results, elastic.results.samples
    sampleResults: thorium_sample_results
    # repo results, elastic.results.repos
    repoResults: thorium_repo_results
    # sample tags, elastic.tags.samples
    sampleTags: thorium_sample_tags
    # repo tags, elastic.tags.repos
    repoTags: thorium_repo_tags

# Namespaces and the Secrets rendered from global.credentials (charts/secrets). Set renderOnly:
# true only for helm template/lint output that is never applied (see "Configure the Helm Charts",
# "Credentials" in the Thorium deployment docs)
secrets: {}

# Backing services: Redis, SeaweedFS, Scylla, Elasticsearch/Kibana, Quickwit's Postgres,
# Jaeger, and an optional registry (charts/infra)
infra: {}

# Trace storage, installed into <prefix>-quickwit when global.quickwit.enabled is true
# (charts/quickwit, vendored upstream chart; see its values.yaml for every setting). Thorium's
# tracing endpoint (operator.backends.tracing) and Jaeger (infra.jaeger) point at it
quickwit:
  # name Quickwit's services quickwit-<component> whatever the release is called, since Thorium's
  # tracing endpoint and Jaeger address quickwit-indexer and quickwit-searcher
  fullnameOverride: quickwit
  # the tag defaults to the vendored chart's appVersion; global.imageRegistry applies
  image:
    repository: docker.io/quickwit/quickwit
    pullPolicy: IfNotPresent
  # the metastore URI, S3 endpoint, and S3 credentials come from the quickwit-credentials secret
  # (rendered by the secrets subchart) and are expanded from ${VAR} references at startup, so no
  # credential appears in the Quickwit ConfigMap
  environmentFrom:
    - secretRef:
        name: quickwit-credentials
  # Quickwit's node config. The bucket in default_index_root_uri must exist: the chart creates
  # it in SeaweedFS (infra.seaweedfs.buckets), and an external S3 store needs it created there,
  # along with a matching storage.s3.region
  config:
    default_index_root_uri: s3://quickwit/quickwit-indexes
    metastore_uri: ${QW_METASTORE_URI}
    storage:
      s3:
        region: us-east-1
        endpoint: ${QW_S3_ENDPOINT}
        force_path_style_access: true
        access_key_id: ${AWS_ACCESS_KEY_ID}
        secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  # one metastore and searcher for a single node (the upstream chart defaults to 3 searchers)
  metastore:
    replicaCount: 1
  searcher:
    replicaCount: 1

# The Thorium operator and the ThoriumCluster it reconciles (charts/operator)
operator: {}
